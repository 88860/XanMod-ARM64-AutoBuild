name: XanMod ARM64 EDGE Build

on:
  workflow_dispatch:
  schedule:
    - cron: '37 3 * * *'

permissions:
  contents: write

concurrency:
  group: xanmod-arm64-edge
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      commit: ${{ steps.check.outputs.commit }}
      release_tag: ${{ steps.check.outputs.release_tag }}
      build_needed: ${{ steps.check.outputs.build_needed }}
    steps:
      - name: Check release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          GITLAB_API="https://gitlab.com/api/v4/projects/xanmod%2Flinux"
          tag=""
          commit=""
          for page in $(seq 1 50); do
            releases="$(curl -fsSL --retry 5 --retry-delay 2 "$GITLAB_API/releases?order_by=released_at&sort=desc&per_page=100&page=$page")"
            IFS=$'\t' read -r found_tag found_commit < <(
              jq -r '
                limit(1;
                  .[]
                  | select(.upcoming_release == false)
                  | select(.tag_name | test("^[0-9]+\\.[0-9]+\\.[0-9]+-xanmod[0-9]+$"))
                  | select(any(.assets.links[]?; (.url // "") | test("sourceforge\\.net/projects/xanmod/files/releases/edge/[^/]+/?$")))
                  | [.tag_name, .commit.id]
                  | @tsv
                )
              ' <<< "$releases"
            ) || true
            if [[ -n "${found_tag:-}" ]]; then
              tag="$found_tag"
              commit="$found_commit"
              break
            fi
            [[ "$(jq 'length' <<< "$releases")" -lt 100 ]] && break
          done
          if [[ -z "$tag" || -z "$commit" ]]; then
            echo "Failed to find release" >&2; exit 1
          fi
          gh_rel_tag="${tag}-arm64-edge"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "release_tag=$gh_rel_tag" >> "$GITHUB_OUTPUT"
          if gh release view "$gh_rel_tag" >/dev/null 2>&1; then
            assets="$(gh release view "$gh_rel_tag" --json assets --jq '.assets[].name')"
            complete=true
            grep -Eq '^linux-image-.*\.deb$' <<< "$assets" || complete=false
            grep -Eq '^linux-headers-.*\.deb$' <<< "$assets" || complete=false
            grep -Eq '^linux-libc-dev.*\.deb$' <<< "$assets" || complete=false
            grep -Fxq 'SHA256SUMS' <<< "$assets" || complete=false
            if [[ "$complete" == true ]]; then
              echo "build_needed=false" >> "$GITHUB_OUTPUT"
            else
              echo "build_needed=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "build_needed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: preflight
    if: needs.preflight.outputs.build_needed == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      TAG: ${{ needs.preflight.outputs.tag }}
      EXPECTED_COMMIT: ${{ needs.preflight.outputs.commit }}
      RELEASE_TAG: ${{ needs.preflight.outputs.release_tag }}
      ARCH: arm64
      LLVM: 1
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - name: Check environment
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == "aarch64" ]] || { echo "Not aarch64"; exit 1; }
          [[ "$(dpkg --print-architecture)" == "arm64" ]] || { echo "Not arm64"; exit 1; }

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo apt-get update
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 22
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex fakeroot kmod cpio lz4 xz-utils zstd \
            clang-22 lld-22 llvm-22 rsync libelf-dev libssl-dev libdw-dev zlib1g-dev \
            debhelper dpkg-dev dwarves ccache pkg-config python3 binutils
          for tool in clang clang++ ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-readelf llvm-strip; do
            sudo ln -sf "/usr/bin/${tool}-22" "/usr/bin/${tool}"
          done
          sudo ln -sf /usr/bin/ld.lld /usr/bin/ld
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"
          clang --version | grep -q '22\.' || { echo "Clang version mismatch"; exit 1; }
          ld.lld --version | grep -q '22\.' || { echo "LLD version mismatch"; exit 1; }
          cat >/tmp/clang-arm64-test.c <<'EOF'
          int test_function(void) { return 0; }
          EOF
          clang --target=aarch64-linux-gnu -c /tmp/clang-arm64-test.c -o /tmp/clang-arm64-test.o
          llvm-readelf -h /tmp/clang-arm64-test.o | grep -Eq 'Machine:.*AArch64|Machine:.*ARM64' || { echo "Smoke test failed"; exit 1; }

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: .ccache
          key: ${{ runner.os }}-native-arm64-xanmod-edge-${{ env.TAG }}-clang22-v1
          restore-keys: |
            ${{ runner.os }}-native-arm64-xanmod-edge-${{ env.TAG }}-clang22-
            ${{ runner.os }}-native-arm64-xanmod-edge-

      - name: Fetch source
        run: |
          set -euo pipefail
          git clone --filter=blob:none --branch "$TAG" https://gitlab.com/xanmod/linux.git kernel
          cd kernel
          actual_commit="$(git rev-parse HEAD^{commit})"
          [[ "$actual_commit" == "$EXPECTED_COMMIT" ]] || { echo "Commit mismatch"; exit 1; }
          
          # 隐藏 .git 目录，彻底切断内核构建系统对 git 状态和 -dirty 后缀的追踪
          mv .git .git.build-hidden
          
          [[ -f arch/arm64/configs/defconfig ]] || { echo "Missing defconfig"; exit 1; }
          xanmod_conf="CONFIGS/x86_64/config"
          if [[ ! -f "$xanmod_conf" ]]; then
            echo "Missing XANMOD_CONF"
            exit 1
          fi
          echo "XANMOD_CONF=$xanmod_conf" >> "$GITHUB_ENV"

      - name: Configure kernel
        run: |
          set -euo pipefail
          cd kernel
          
          make ARCH=arm64 defconfig
          cp .config .config.arm64-base
          
          find . -name "Kconfig*" -type f -exec grep -hE '^[[:space:]]*(config|menuconfig)[[:space:]]+[A-Za-z0-9_]+' {} + \
            | awk '{print "CONFIG_"$2}' \
            | sort -u > kernel.symbols
            
          awk '
          NR==FNR {
              arm[$1]=1
              next
          }
          /^CONFIG_/ {
              split($0,a,"=")
              if (a[1] in arm)
                  print
              next
          }
          /^# CONFIG_/ {
              match($0,/CONFIG_[A-Za-z0-9_]+/)
              sym=substr($0,RSTART,RLENGTH)
              if (sym in arm)
                  print
          }
          ' kernel.symbols "$XANMOD_CONF" > xanmod.arm64.fragment
          
          ./scripts/kconfig/merge_config.sh -m .config xanmod.arm64.fragment
          
          rm -f localversion
          ./scripts/config --disable LOCALVERSION_AUTO
          printf '%s\n' "-arm64-edge" > localversion
          for dbg in DEBUG_INFO DEBUG_INFO_BTF DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT DEBUG_INFO_DWARF4 DEBUG_INFO_DWARF5; do
            ./scripts/config -d "$dbg" || true
          done
          
          make ARCH=arm64 olddefconfig
          cp .config .config.final
          
          touch .scmversion
          
          release="$(make -s ARCH=arm64 kernelrelease)"
          echo "Expected: ${TAG}-arm64-edge"
          echo "Actual:   $release"
          [[ "$release" == "${TAG}-arm64-edge" ]] || { echo "Release mismatch!"; exit 1; }
          echo "KERNEL_RELEASE=$release" >> "$GITHUB_ENV"

      - name: Audit configuration
        run: |
          set -euo pipefail
          cd kernel
          for req in ARM64 64BIT MODULES NET INET PROC_FS SYSFS CGROUPS NAMESPACES BPF BPF_SYSCALL; do
            grep -q "^CONFIG_${req}=y$" .config || { echo "Missing $req"; exit 1; }
          done
          grep -q '^CONFIG_CC_IS_CLANG=y$' .config || { echo "Not CC_IS_CLANG"; exit 1; }
          grep -q '^CONFIG_LD_IS_LLD=y$' .config || { echo "Not LD_IS_LLD"; exit 1; }
          make ARCH=arm64 LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- CC="ccache clang --target=aarch64-linux-gnu" HOSTCC="ccache clang" HOSTCXX="ccache clang++" HOSTLD=ld.lld HOSTAR=llvm-ar LD=ld.lld -s prepare

      - name: Build packages
        env:
          KBUILD_BUILD_USER: github-actions
          KBUILD_BUILD_HOST: github-arm64-native
          DEBFULLNAME: github-actions
          DEBEMAIL: github-actions@users.noreply.github.com
        run: |
          set -euo pipefail
          cd kernel
          ccache --set-config=cache_dir="$CCACHE_DIR"
          ccache --zero-stats
          make ARCH=arm64 LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- KBUILD_DEBARCH=arm64 CC="ccache clang --target=aarch64-linux-gnu" HOSTCC="ccache clang" HOSTCXX="ccache clang++" HOSTLD=ld.lld HOSTAR=llvm-ar LD=ld.lld KDEB_COMPRESS=gzip skipdbg=true -j"$(nproc)" bindeb-pkg
          ccache --show-stats

      - name: Verify packages
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          debug_packages=(*dbg*.deb *dbgsym*.deb)
          if ((${#debug_packages[@]} > 0)); then echo "Debug packages found"; exit 1; fi
          packages=(*.deb)
          ((${#packages[@]} > 0)) || { echo "No packages generated"; exit 1; }
          image_pkg=""
          headers_pkg=""
          libc_pkg=""
          for deb in "${packages[@]}"; do
            pkg_name="$(dpkg-deb --field "$deb" Package)"
            arch="$(dpkg-deb --field "$deb" Architecture)"
            case "$pkg_name" in
              linux-image-*)
                [[ "$arch" == "arm64" ]] || { echo "Image arch mismatch"; exit 1; }
                [[ -z "$image_pkg" ]] || { echo "Multiple images"; exit 1; }
                image_pkg="$deb"
                ;;
              linux-headers-*)
                [[ "$arch" == "arm64" || "$arch" == "all" ]] || { echo "Headers arch mismatch"; exit 1; }
                [[ -z "$headers_pkg" ]] || { echo "Multiple headers"; exit 1; }
                headers_pkg="$deb"
                ;;
              linux-libc-dev)
                [[ "$arch" == "arm64" ]] || { echo "libc arch mismatch"; exit 1; }
                [[ -z "$libc_pkg" ]] || { echo "Multiple libcs"; exit 1; }
                libc_pkg="$deb"
                ;;
              *) { echo "Unknown package: $pkg_name"; exit 1; } ;;
            esac
            mv "$deb" dist/
          done
          [[ -n "$image_pkg" ]] || { echo "Missing image package"; exit 1; }
          [[ -n "$headers_pkg" ]] || { echo "Missing headers package"; exit 1; }
          [[ -n "$libc_pkg" ]] || { echo "Missing libc package"; exit 1; }
          cd dist
          image_basename="$(basename "$image_pkg")"
          headers_basename="$(basename "$headers_pkg")"
          image_package="$(dpkg-deb --field "$image_basename" Package)"
          image_version="$(dpkg-deb --field "$image_basename" Version)"
          [[ "$image_package" == *"-arm64-edge" ]] || { echo "Image package name mismatch"; exit 1; }
          [[ "$image_version" == *"$TAG"* ]] || { echo "Image version mismatch"; exit 1; }
          dpkg-deb --contents "$image_basename" | grep -q '/boot/vmlinuz-' || { echo "vmlinuz missing"; exit 1; }
          dpkg-deb --contents "$image_basename" | grep -q '/lib/modules/' || { echo "modules missing"; exit 1; }
          dpkg-deb --contents "$headers_basename" | grep -q '/usr/src/linux-headers-' || { echo "headers source missing"; exit 1; }
          rm -rf verify-image
          mkdir verify-image
          dpkg-deb --extract "$image_basename" verify-image
          expected_config="verify-image/boot/config-${KERNEL_RELEASE}"
          [[ -f "$expected_config" ]] || { echo "Config missing in image"; exit 1; }
          cmp -s "$expected_config" ../kernel/.config.final || { echo "Config content mismatch"; exit 1; }
          sha256sum *.deb > SHA256SUMS
          cat <<EOF > RELEASE.md
          ## XanMod ARM64 EDGE: $TAG

          * **Kernel Release:** \`${KERNEL_RELEASE}\`
          * **Architecture:** \`arm64\`
          * **Profile:** Full-Featured (Cross-Ported)
          * **Channel:** EDGE
          * **Upstream Source:** [GitLab XanMod Linux](https://gitlab.com/xanmod/linux/-/releases/$TAG)
          * **Upstream Commit:** \`${EXPECTED_COMMIT}\`
          * **Compiler:** Clang 22 / LLD 22
          * **Build:** GitHub Actions Native ARM64 compilation

          ### Checksums (SHA256)

          \`\`\`text
          $(cat SHA256SUMS)
          \`\`\`
          EOF

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.deb dist/SHA256SUMS --clobber
            gh release edit "$RELEASE_TAG" --title "XanMod ${TAG} ARM64 EDGE" --notes-file dist/RELEASE.md
          else
            gh release create "$RELEASE_TAG" dist/*.deb dist/SHA256SUMS --title "XanMod ${TAG} ARM64 EDGE" --notes-file dist/RELEASE.md
          fi
