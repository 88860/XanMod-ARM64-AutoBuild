name: XanMod ARM64 EDGE Build

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xanmod-arm64-edge
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Free disk space
        run: |
          set -euo pipefail

          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL

          sudo docker system prune -af || true
          df -h

      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Detect latest XanMod EDGE release
        id: xanmod
        shell: bash
        run: |
          set -euo pipefail

          echo "Querying official XanMod GitLab releases..."

          RELEASES_JSON="$(curl -fsSL \
            https://gitlab.com/api/v4/projects/xanmod%2Flinux/releases?per_page=100)"

          TAG="$(
            printf '%s' "$RELEASES_JSON" |
            jq -r '
              .[]
              | select(
                  any(.assets.links[]?;
                    (.url // "") | test("sourceforge\\.net/projects/xanmod/files/releases/edge/")
                  )
                )
              | .tag_name
            ' |
            head -n1
          )"

          if [[ -z "$TAG" || "$TAG" == "null" ]]; then
            echo "ERROR: Unable to find the latest official XanMod EDGE release."
            exit 1
          fi

          echo "Latest XanMod EDGE release: $TAG"

          EDGE_URL="https://sourceforge.net/projects/xanmod/files/releases/edge/${TAG}"

          if ! curl -fsIL "$EDGE_URL" >/dev/null; then
            echo "ERROR: XanMod EDGE package path does not exist:"
            echo "$EDGE_URL"
            exit 1
          fi

          {
            echo "tag=$TAG"
            echo "channel=edge"
            echo "source_url=https://gitlab.com/xanmod/linux.git"
            echo "release_url=$EDGE_URL"
          } >> "$GITHUB_OUTPUT"

      - name: Show XanMod release
        run: |
          set -euo pipefail

          echo "TAG=${{ steps.xanmod.outputs.tag }}"
          echo "CHANNEL=${{ steps.xanmod.outputs.channel }}"
          echo "SOURCE=https://gitlab.com/xanmod/linux.git"
          echo "EDGE_RELEASE=https://sourceforge.net/projects/xanmod/files/releases/edge/${{ steps.xanmod.outputs.tag }}"

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo dpkg --add-architecture arm64

          sudo mkdir -p /etc/apt/sources.list.d

          sudo tee /etc/apt/sources.list.d/ubuntu.sources >/dev/null <<'EOF'
          Types: deb
          URIs: http://archive.ubuntu.com/ubuntu
          Suites: noble noble-updates
          Components: main universe restricted multiverse
          Architectures: amd64 i386

          Types: deb
          URIs: http://security.ubuntu.com/ubuntu
          Suites: noble-security
          Components: main universe restricted multiverse
          Architectures: amd64 i386

          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: noble noble-updates noble-security
          Components: main universe restricted multiverse
          Architectures: arm64
          EOF

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            clang \
            cpio \
            debhelper \
            dpkg-dev \
            dwarves \
            fakeroot \
            flex \
            kmod \
            libdw-dev \
            libelf-dev \
            libssl-dev \
            lld \
            llvm \
            lz4 \
            openssl \
            pkg-config \
            python3 \
            rsync \
            xz-utils \
            zstd \
            crossbuild-essential-arm64 \
            libssl-dev:arm64 \
            libelf-dev:arm64 \
            zlib1g-dev:arm64 \
            jq \
            curl

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-cross-arm64-xanmod-edge-${{ steps.xanmod.outputs.tag }}-clang-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cross-arm64-xanmod-edge-${{ steps.xanmod.outputs.tag }}-clang-
            ${{ runner.os }}-cross-arm64-xanmod-edge-

      - name: Prepare ccache
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .ccache

          ccache --zero-stats
          ccache --show-config

      - name: Clone XanMod source
        shell: bash
        run: |
          set -euo pipefail

          rm -rf kernel

          git clone \
            --depth=1 \
            --branch "${{ steps.xanmod.outputs.tag }}" \
            https://gitlab.com/xanmod/linux.git \
            kernel

          cd kernel

          git fetch --depth=1 origin \
            "refs/tags/${{ steps.xanmod.outputs.tag }}:refs/tags/${{ steps.xanmod.outputs.tag }}"

          git checkout --detach "${{ steps.xanmod.outputs.tag }}"

          echo "HEAD=$(git rev-parse HEAD)"
          echo "TAG=${{ steps.xanmod.outputs.tag }}"

          test "$(git describe --tags --exact-match HEAD)" = "${{ steps.xanmod.outputs.tag }}"

          test -f arch/arm64/configs/defconfig
          test -f CONFIGS/x86_64/config
          test -f localversion
          test -x scripts/config
          test -x scripts/kconfig/merge_config.sh

      - name: Configure ARM64 kernel
        shell: bash
        working-directory: kernel
        run: |
          set -euo pipefail

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LLVM=1

          make \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 \
            defconfig

          cp .config .config.base

          awk '
            /^[[:space:]]*#/ { next }
            /^[[:space:]]*$/ { next }
            /^CONFIG_[A-Za-z0-9_]+=/ {
              print
            }
          ' CONFIGS/x86_64/config > .xanmod-candidates

          ./scripts/kconfig/merge_config.sh \
            -m \
            .config \
            .xanmod-candidates

          make \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 \
            olddefconfig

          ./scripts/config --disable LOCALVERSION_AUTO

          ./scripts/config --disable DEBUG_INFO
          ./scripts/config --disable DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT
          ./scripts/config --disable DEBUG_INFO_DWARF4
          ./scripts/config --disable DEBUG_INFO_DWARF5
          ./scripts/config --disable DEBUG_INFO_BTF
          ./scripts/config --disable DEBUG_INFO_BTF_MODULES
          ./scripts/config --enable DEBUG_INFO_NONE

          printf '%s\n' "-${{ steps.xanmod.outputs.tag }}-arm64-edge" > localversion

          make \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 \
            olddefconfig

          KERNELRELEASE="$(
            make \
              -s \
              ARCH=arm64 \
              CROSS_COMPILE=aarch64-linux-gnu- \
              LLVM=1 \
              kernelrelease
          )"

          echo "KERNELRELEASE=$KERNELRELEASE"

          test "$KERNELRELEASE" = "${{ steps.xanmod.outputs.tag }}-arm64-edge"

          cp .config .config.audit
          cp .config .config.clean

          {
            echo "CONFIGURATION ACCEPTED"
            echo
            cat .config
          } > config-final.txt

          {
            echo "XANMOD CONFIG CANDIDATES"
            echo
            cat .xanmod-candidates
          } > config-candidates.txt

      - name: Audit kernel configuration
        shell: bash
        working-directory: kernel
        run: |
          set -euo pipefail

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LLVM=1

          cp .config.audit .config

          make \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 \
            olddefconfig

          if ! cmp -s .config .config.audit; then
            echo "ERROR: olddefconfig modified the audited configuration."
            diff -u .config.audit .config || true
            exit 1
          fi

          required_configs=(
            CONFIG_ARM64=y
            CONFIG_64BIT=y
            CONFIG_MODULES=y
            CONFIG_NET=y
            CONFIG_INET=y
            CONFIG_PROC_FS=y
            CONFIG_SYSFS=y
            CONFIG_CGROUPS=y
            CONFIG_NAMESPACES=y
            CONFIG_BPF=y
            CONFIG_BPF_SYSCALL=y
          )

          for item in "${required_configs[@]}"; do
            key="${item%%=*}"
            expected="${item#*=}"

            actual="$(
              sed -n "s/^${key}=//p" .config |
              head -n1
            )"

            if [[ "$actual" != "$expected" ]]; then
              echo "ERROR: $key expected $expected, got ${actual:-unset}"
              exit 1
            fi
          done

          if grep -Eq '^CONFIG_(X86|X86_64|CPU_SUP_[A-Z0-9_]+_X86|X86_[A-Z0-9_]+)=' .config; then
            echo "ERROR: x86-specific configuration detected."
            grep -E '^CONFIG_(X86|X86_64|CPU_SUP_[A-Z0-9_]+_X86|X86_[A-Z0-9_]+)=' .config || true
            exit 1
          fi

          LOCALVERSION_VALUE="$(
            sed -n 's/^CONFIG_LOCALVERSION="\(.*\)"/\1/p' .config |
            head -n1
          )"

          if [[ -n "$LOCALVERSION_VALUE" ]]; then
            echo "ERROR: CONFIG_LOCALVERSION must be empty."
            echo "CONFIG_LOCALVERSION=$LOCALVERSION_VALUE"
            exit 1
          fi

          if grep -q '^CONFIG_LOCALVERSION_AUTO=y' .config; then
            echo "ERROR: CONFIG_LOCALVERSION_AUTO=y"
            exit 1
          fi

          KERNELRELEASE="$(
            make \
              -s \
              ARCH=arm64 \
              CROSS_COMPILE=aarch64-linux-gnu- \
              LLVM=1 \
              kernelrelease
          )"

          echo "Audited KERNELRELEASE=$KERNELRELEASE"

          test "$KERNELRELEASE" = "${{ steps.xanmod.outputs.tag }}-arm64-edge"

          if grep -nE '^[[:space:]]*CONFIG_[A-Za-z0-9_]+[[:space:]]*=' .config |
             awk '
               {
                 key=$0
                 sub(/=.*/, "", key)
                 count[key]++
               }
               END {
                 for (key in count)
                   if (count[key] > 1)
                     print key
               }
             ' |
             grep -q .; then
            echo "ERROR: duplicate configuration entries detected."
            exit 1
          fi

          make \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 \
            prepare

      - name: Build Debian packages
        shell: bash
        working-directory: kernel
        run: |
          set -euo pipefail

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LLVM=1

          export KBUILD_BUILD_USER=xanmod
          export KBUILD_BUILD_HOST=github-actions

          export DEB_BUILD_OPTIONS="parallel=$(nproc)"

          sudo ln -sf /usr/bin/ld.lld /usr/bin/lld

          export PATH="/usr/lib/ccache:$PATH"

          ccache --zero-stats

          make \
            -j"$(( $(nproc) + 1 ))" \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 \
            bindeb-pkg

          ccache --show-stats

      - name: Verify generated packages
        shell: bash
        working-directory: kernel
        run: |
          set -euo pipefail

          mapfile -t packages < <(
            find .. \
              -maxdepth 1 \
              -type f \
              -name '*.deb' \
              -printf '%f\n' |
            sort
          )

          if [[ "${#packages[@]}" -eq 0 ]]; then
            echo "ERROR: No Debian packages generated."
            exit 1
          fi

          echo "Generated packages:"
          printf '%s\n' "${packages[@]}"

          for pkg in "${packages[@]}"; do
            dpkg-deb -f "../$pkg" Architecture
          done

          for pkg in "${packages[@]}"; do
            arch="$(dpkg-deb -f "../$pkg" Architecture)"

            if [[ "$arch" != "arm64" ]]; then
              echo "ERROR: Non-arm64 package detected: $pkg ($arch)"
              exit 1
            fi
          done

          image_pkg=""
          headers_pkg=""
          libc_pkg=""

          for pkg in "${packages[@]}"; do
            if dpkg-deb -c "../$pkg" | grep -q '/boot/vmlinuz-'; then
              image_pkg="$pkg"
            fi

            if dpkg-deb -c "../$pkg" | grep -q '/usr/src/linux-headers-'; then
              headers_pkg="$pkg"
            fi

            if [[ "$pkg" == *libc-dev* ]]; then
              libc_pkg="$pkg"
            fi
          done

          [[ -n "$image_pkg" ]]
          [[ -n "$headers_pkg" ]]

          if ! dpkg-deb -c "../$image_pkg" | grep -q '/lib/modules/'; then
            echo "ERROR: Image package does not contain /lib/modules/"
            exit 1
          fi

          if ! [[ "$image_pkg" == *-arm64-edge.deb ]]; then
            echo "ERROR: Image package does not end with -arm64-edge.deb"
            echo "Actual: $image_pkg"
            exit 1
          fi

          mkdir -p ../dist

          cp ../*.deb ../dist/

          (
            cd ../dist

            sha256sum ./*.deb > SHA256SUMS

            {
              echo "# XanMod ARM64 EDGE"
              echo
              echo "Kernel: ${{ steps.xanmod.outputs.tag }}"
              echo "Channel: EDGE"
              echo "Architecture: arm64"
              echo
              echo "Kernel release:"
              echo "\`${{ steps.xanmod.outputs.tag }}-arm64-edge\`"
              echo
              echo "Packages:"
              printf '%s\n' ./*.deb
              echo
              echo "SHA256:"
              echo
              echo '```'
              cat SHA256SUMS
              echo '```'
            } > RELEASE.md
          )

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="${{ steps.xanmod.outputs.tag }}"

          gh release create "$TAG" \
            dist/*.deb \
            dist/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "XanMod ${TAG} ARM64 EDGE" \
            --notes-file dist/RELEASE.md
