name: XanMod ARM64 EDGE Build

on:
  workflow_dispatch:
  schedule:
    - cron: '37 3 * * *'

permissions: {}

concurrency:
  group: xanmod-arm64-edge
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      commit: ${{ steps.check.outputs.commit }}
      build_needed: ${{ steps.check.outputs.build_needed }}
    steps:
      - name: Preflight Check
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          GITLAB_API="https://gitlab.com/api/v4/projects/xanmod%2Flinux"

          tag=""
          commit=""

          for page in $(seq 1 50); do
            releases="$(
              curl -fsSL \
                --retry 5 \
                --retry-delay 2 \
                --retry-all-errors \
                "$GITLAB_API/releases?order_by=released_at&sort=desc&per_page=100&page=$page"
            )"

            IFS=$'\t' read -r found_tag found_commit < <(
              jq -r '
                limit(1;
                  .[]
                  | select(.upcoming_release == false)
                  | select(
                      .tag_name
                      | test("^[0-9]+\\.[0-9]+\\.[0-9]+-xanmod[0-9]+$")
                    )
                  | select(
                      any(
                        .assets.links[]?;
                        (.url // "")
                        | test(
                            "sourceforge\\.net/projects/xanmod/files/releases/edge/[^/]+/?$"
                          )
                      )
                    )
                  | [
                      .tag_name,
                      .commit.id
                    ]
                  | @tsv
                )
              ' <<< "$releases"
            ) || true

            if [[ -n "${found_tag:-}" ]]; then
              tag="$found_tag"
              commit="$found_commit"
              break
            fi

            [[ "$(jq 'length' <<< "$releases")" -lt 100 ]] && break
          done

          if [[ -z "$tag" || -z "$commit" ]]; then
            echo "Failed to find a valid XanMod EDGE release." >&2
            exit 1
          fi

          echo "Detected XanMod EDGE release:"
          echo "  TAG:    $tag"
          echo "  COMMIT: $commit"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub Release $tag already exists."

            assets="$(
              gh release view "$tag" \
                --json assets \
                --jq '.assets[].name'
            )"

            complete=true

            grep -Eq '^linux-image-.*arm64-edge.*\.deb$' <<< "$assets" || complete=false
            grep -Eq '^linux-headers-.*arm64-edge.*\.deb$' <<< "$assets" || complete=false
            grep -Eq '^linux-libc-dev.*arm64.*\.deb$' <<< "$assets" || complete=false
            grep -Fxq 'SHA256SUMS' <<< "$assets" || complete=false

            if [[ "$complete" == true ]]; then
              echo "Existing release appears complete."
              echo "build_needed=false" >> "$GITHUB_OUTPUT"
            else
              echo "Existing release is incomplete."
              echo "A rebuild will be performed."
              echo "build_needed=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "GitHub Release $tag does not exist."
            echo "Build required."
            echo "build_needed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: preflight
    if: needs.preflight.outputs.build_needed == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    permissions:
      contents: write
    env:
      TAG: ${{ needs.preflight.outputs.tag }}
      EXPECTED_COMMIT: ${{ needs.preflight.outputs.commit }}
      ARCH: arm64
      LLVM: 1
      KCONFIG_WARN_UNKNOWN_SYMBOLS: 1
      KCONFIG_WARN_CHANGED_INPUT: 1

    steps:
      - name: Native Environment Audit
        run: |
          set -euo pipefail

          echo "=== Native ARM64 environment ==="
          uname -a
          echo "Machine:     $(uname -m)"
          echo "DPKG arch:   $(dpkg --print-architecture)"
          echo "CPU cores:   $(nproc)"
          echo "Memory:"
          free -h
          echo "Disk:"
          df -h /

          [[ "$(uname -m)" == "aarch64" ]] || {
            echo "ERROR: Runner is not ARM64."
            exit 1
          }

          [[ "$(dpkg --print-architecture)" == "arm64" ]] || {
            echo "ERROR: dpkg architecture is not arm64."
            exit 1
          }

          [[ "$(nproc)" -ge 2 ]] || {
            echo "ERROR: Insufficient CPU cores."
            exit 1
          }

          echo "=== Native compiler architecture ==="

      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail

          sudo apt-get update

          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 22

          sudo apt-get install -y --no-install-recommends \
            build-essential \
            bc \
            bison \
            flex \
            fakeroot \
            kmod \
            cpio \
            lz4 \
            xz-utils \
            zstd \
            clang-22 \
            lld-22 \
            llvm-22 \
            rsync \
            libelf-dev \
            libssl-dev \
            libdw-dev \
            zlib1g-dev \
            debhelper \
            dpkg-dev \
            dwarves \
            ccache \
            pkg-config \
            python3 \
            binutils

          for tool in \
            clang \
            clang++ \
            ld.lld \
            llvm-ar \
            llvm-nm \
            llvm-objcopy \
            llvm-objdump \
            llvm-readelf \
            llvm-strip
          do
            sudo ln -sf "/usr/bin/${tool}-22" "/usr/bin/${tool}"
          done

          sudo ln -sf /usr/bin/ld.lld /usr/bin/ld

          echo "/usr/lib/ccache" >> "$GITHUB_PATH"

          sudo apt-get clean

          echo "=== LLVM toolchain ==="
          clang --version
          ld.lld --version
          llvm-ar --version

          clang --version | grep -q '22\.' || {
            echo "ERROR: Clang 22 was not selected."
            exit 1
          }

          ld.lld --version | grep -q '22\.' || {
            echo "ERROR: LLD 22 was not selected."
            exit 1
          }

          echo "=== Native compiler binaries ==="
          file "$(command -v clang)"
          file "$(command -v ld.lld)"
          file "$(command -v llvm-ar)"

          echo "=== Target triple checks ==="
          echo "Debian architecture: $(dpkg --print-architecture)"
          echo "Debian GNU triplet:   $(dpkg-architecture -qDEB_HOST_GNU_TYPE)"
          echo "Clang target:         $(clang -print-target-triple)"
          echo "Clang ARM64 target:   $(clang --target=aarch64-linux-gnu -dumpmachine)"

          clang --target=aarch64-linux-gnu -dumpmachine \
            | grep -qx 'aarch64-linux-gnu' || {
              echo "ERROR: Clang ARM64 target triple is incorrect."
              exit 1
            }

          echo "=== ARM64 LLVM smoke test ==="

          cat >/tmp/clang-arm64-test.c <<'EOF'
          int test_function(void)
          {
              return 0;
          }
          EOF

          clang \
            -c \
            /tmp/clang-arm64-test.c \
            -o /tmp/clang-arm64-test.o

          llvm-readelf -h /tmp/clang-arm64-test.o \
            | grep -Eq 'Machine:.*AArch64|Machine:.*ARM64' || {
              echo "ERROR: Clang failed to produce an ARM64 object."
              exit 1
            }

          echo "ARM64 Native Clang smoke test passed."

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ${{ runner.os }}-native-arm64-xanmod-edge-${{ env.TAG }}-clang22-v2
          restore-keys: |
            ${{ runner.os }}-native-arm64-xanmod-edge-${{ env.TAG }}-clang22-
            ${{ runner.os }}-native-arm64-xanmod-edge-

      - name: Fetch XanMod Source
        run: |
          set -euo pipefail

          git clone \
            --depth 1 \
            --branch "$TAG" \
            https://gitlab.com/xanmod/linux.git \
            kernel

          cd kernel

          actual_commit="$(git rev-parse HEAD)"

          echo "Expected commit: $EXPECTED_COMMIT"
          echo "Actual commit:   $actual_commit"

          [[ "$actual_commit" == "$EXPECTED_COMMIT" ]] || {
            echo "ERROR: Source commit mismatch."
            exit 1
          }

          [[ -f arch/arm64/configs/defconfig ]] || {
            echo "ERROR: ARM64 defconfig not found."
            exit 1
          }

          [[ -f CONFIGS/x86_64/config ]] || {
            echo "ERROR: XanMod x86_64 config not found."
            exit 1
          }

          echo "=== Git working tree audit ==="

          git status --short

          [[ -z "$(git status --porcelain)" ]] || {
            echo "ERROR: XanMod source tree is dirty."
            exit 1
          }

          echo "=== Source revision ==="
          git rev-parse HEAD
          git show -s --format='%cI' HEAD > .source-commit-date

          mv .git .git.build-hidden

      - name: Configure Kernel
        run: |
          set -euo pipefail

          cd kernel

          echo "=== ARM64 base defconfig ==="
          make defconfig

          cp .config .config.arm64-base

          echo "=== Extract current XanMod x86_64 configuration ==="

          awk '
            /^[[:space:]]*CONFIG_[A-Za-z0-9_]+=(y|m|-?[0-9]+|0x[0-9A-Fa-f]+|".*")$/ {
              sub(/^[[:space:]]+/, "")
              if ($0 !~ /^CONFIG_LOCALVERSION=/)
                print
            }
            /^[[:space:]]*# CONFIG_[A-Za-z0-9_]+ is not set$/ {
              sub(/^[[:space:]]+/, "")
              print
            }
          ' CONFIGS/x86_64/config > .xanmod-candidates

          [[ -s .xanmod-candidates ]] || {
            echo "ERROR: XanMod configuration extraction produced no entries."
            exit 1
          }

          candidate_duplicates="$(
            awk '
              {
                line=$0
                if (line ~ /^CONFIG_/) {
                  sub(/=.*/, "", line)
                  print line
                } else if (line ~ /^# CONFIG_/) {
                  sub(/^# /, "", line)
                  sub(/ is not set$/, "", line)
                  print line
                }
              }
            ' .xanmod-candidates \
            | sort \
            | uniq -d
          )"

          [[ -z "$candidate_duplicates" ]] || {
            echo "ERROR: Duplicate XanMod configuration symbols detected:"
            printf '%s\n' "$candidate_duplicates"
            exit 1
          }

          echo "Candidate configuration entries:"
          wc -l .xanmod-candidates

          echo "=== Merge current XanMod configuration into ARM64 base ==="

          ./scripts/kconfig/merge_config.sh \
            -m \
            .config \
            .xanmod-candidates

          cp .config .config.xanmod-merged

          echo "=== ARM64 base versus XanMod migration diff ==="

          diff -u \
            .config.arm64-base \
            .config.xanmod-merged \
            > .config.arm64-xanmod-migration.diff || true

          echo "Migration changes:"
          grep -E '^[+-]CONFIG_|^[+-]# CONFIG_' \
            .config.arm64-xanmod-migration.diff \
            | wc -l || true

          echo "=== Normalize migrated configuration ==="

          make olddefconfig

          cp .config .config.after-olddefconfig

          echo "=== Configuration changes caused by Kconfig ==="

          scripts/diffconfig \
            .config.xanmod-merged \
            .config.after-olddefconfig \
            > .config.kconfig-resolution.diff || true

          echo "=== Final XanMod ARM64 configuration ==="

          cp .config.after-olddefconfig .config

          rm -f localversion

          ./scripts/config --disable CONFIG_LOCALVERSION_AUTO

          for dbg in \
            DEBUG_INFO \
            DEBUG_INFO_BTF \
            DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT \
            DEBUG_INFO_DWARF4 \
            DEBUG_INFO_DWARF5
          do
            ./scripts/config -d "$dbg"
          done

          ./scripts/config -e CONFIG_DEBUG_INFO_NONE

          make olddefconfig

          cp .config .config.final

          echo "=== Force kernel LOCALVERSION ==="

          printf '%s\n' "-${TAG#*-}-arm64-edge" > localversion

          echo "localversion:"
          cat localversion

          release="$(make -s kernelrelease)"

          echo "Actual:   $release"
          echo "Expected: ${TAG}-arm64-edge"

          [[ "$release" == "${TAG}-arm64-edge" ]] || {
            echo "ERROR: Kernel release mismatch."
            exit 1
          }

      - name: Audit Kernel Configuration
        run: |
          set -euo pipefail

          cd kernel

          echo "=== Architecture audit ==="

          if grep -Eq '^CONFIG_X86(=|_)|^CONFIG_X86_64(=_)' .config; then
            echo "ERROR: X86 configuration detected."
            exit 1
          fi

          echo "=== Required configuration ==="

          for req in \
            ARM64 \
            64BIT \
            MODULES \
            NET \
            INET \
            PROC_FS \
            SYSFS \
            CGROUPS \
            NAMESPACES \
            BPF \
            BPF_SYSCALL
          do
            grep -q "^CONFIG_${req}=y$" .config || {
              echo "ERROR: CONFIG_${req}=y is required."
              exit 1
            }
          done

          echo "=== CPU tuning audit ==="

          if grep -qE \
            '^CONFIG_(MCORE2|MZEN|X86_NATIVE_CPU|X86_64_VERSION)=' \
            .config
          then
            echo "ERROR: x86-specific CPU tuning detected."
            exit 1
          fi

          echo "=== Compiler configuration ==="

          grep -q '^CONFIG_CC_IS_CLANG=y$' .config || {
            echo "ERROR: Kernel is not configured for Clang."
            exit 1
          }

          grep -q '^CONFIG_LD_IS_LLD=y$' .config || {
            echo "ERROR: Kernel is not configured for LLD."
            exit 1
          }

          echo "=== Configuration resolution audit ==="

          if grep -Eq \
            'CONFIG_X86|CONFIG_MCORE2|CONFIG_MZEN|CONFIG_X86_NATIVE_CPU|CONFIG_X86_64_VERSION' \
            .xanmod-candidates
          then
            echo "X86-specific entries existed in the source XanMod configuration."
          fi

          echo "=== Prepare ==="

          make -s prepare

      - name: Build Debian Packages
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_COMPILERCHECK: content
          CCACHE_MAXSIZE: 1G
          KBUILD_BUILD_USER: github-actions
          KBUILD_BUILD_HOST: github-arm64-native
          DEBFULLNAME: github-actions
          DEBEMAIL: github-actions@users.noreply.github.com
          CC: clang --target=aarch64-linux-gnu
          KBUILD_DEBARCH: arm64
        run: |
          set -euo pipefail

          cd kernel

          echo "=== Configure ccache ==="

          ccache --max-size=1G
          ccache --set-config=compiler_check=content
          ccache --show-config
          ccache --show-stats
          ccache --zero-stats

          echo "=== Debian architecture ==="

          dpkg-architecture -qDEB_BUILD_ARCH
          dpkg-architecture -qDEB_HOST_ARCH
          dpkg-architecture -qDEB_BUILD_GNU_TYPE
          dpkg-architecture -qDEB_HOST_GNU_TYPE

          echo "=== Compiler ==="

          echo "CC=$CC"
          clang --target=aarch64-linux-gnu -dumpmachine
          clang --target=aarch64-linux-gnu --version

          echo "=== Building ==="

          make \
            ARCH=arm64 \
            LLVM=1 \
            KDEB_COMPRESS=gzip \
            skipdbg=true \
            -j"$(nproc)" \
            bindeb-pkg

          echo "=== ccache after build ==="
          ccache --show-stats

      - name: Verify Packages
        run: |
          set -euo pipefail

          mkdir -p dist

          shopt -s nullglob

          debug_packages=(
            kernel/*dbg*.deb
            kernel/*dbgsym*.deb
          )

          if ((${#debug_packages[@]} > 0)); then
            echo "ERROR: Debug packages were generated:"
            printf '  %s\n' "${debug_packages[@]}"
            exit 1
          fi

          packages=(kernel/*.deb)

          ((${#packages[@]} > 0)) || {
            echo "ERROR: No Debian packages found."
            exit 1
          }

          image_pkg=""
          headers_pkg=""
          libc_pkg=""

          echo "=== Package inventory ==="

          for deb in "${packages[@]}"; do

            pkg_name="$(dpkg-deb --field "$deb" Package)"
            arch="$(dpkg-deb --field "$deb" Architecture)"

            echo "Package: $pkg_name"
            echo "Arch:    $arch"

            case "$pkg_name" in

              linux-image-*)
                [[ "$arch" == "arm64" ]] || {
                  echo "ERROR: linux-image package must be arm64."
                  exit 1
                }

                [[ -z "$image_pkg" ]] || {
                  echo "ERROR: Multiple linux-image packages found."
                  exit 1
                }

                image_pkg="$deb"
                ;;

              linux-headers-*)
                [[ "$arch" == "arm64" || "$arch" == "all" ]] || {
                  echo "ERROR: Invalid linux-headers architecture."
                  exit 1
                }

                [[ -z "$headers_pkg" ]] || {
                  echo "ERROR: Multiple linux-headers packages found."
                  exit 1
                }

                headers_pkg="$deb"
                ;;

              linux-libc-dev)
                [[ "$arch" == "arm64" ]] || {
                  echo "ERROR: linux-libc-dev must be arm64."
                  exit 1
                }

                [[ -z "$libc_pkg" ]] || {
                  echo "ERROR: Multiple linux-libc-dev packages found."
                  exit 1
                }

                libc_pkg="$deb"
                ;;

              *)
                echo "ERROR: Unexpected Debian package: $pkg_name"
                exit 1
                ;;
            esac

            mv "$deb" dist/
          done

          [[ -n "$image_pkg" ]] || {
            echo "ERROR: linux-image package missing."
            exit 1
          }

          [[ -n "$headers_pkg" ]] || {
            echo "ERROR: linux-headers package missing."
            exit 1
          }

          [[ -n "$libc_pkg" ]] || {
            echo "ERROR: linux-libc-dev package missing."
            exit 1
          }

          cd dist

          image_basename="$(basename "$image_pkg")"
          headers_basename="$(basename "$headers_pkg")"

          echo "=== Package metadata ==="

          image_package="$(dpkg-deb --field "$image_basename" Package)"
          image_version="$(dpkg-deb --field "$image_basename" Version)"
          image_arch="$(dpkg-deb --field "$image_basename" Architecture)"

          echo "Image package: $image_package"
          echo "Image version: $image_version"
          echo "Image arch:    $image_arch"

          [[ "$image_package" == *"-arm64-edge" ]] || {
            echo "ERROR: Unexpected image package name."
            exit 1
          }

          [[ "$image_arch" == "arm64" ]] || {
            echo "ERROR: Image package architecture is not arm64."
            exit 1
          }

          [[ "$image_version" == *"$TAG"* ]] || {
            echo "ERROR: Package version does not contain expected TAG."
            echo 
