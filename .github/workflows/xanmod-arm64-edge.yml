name: XanMod ARM64 EDGE Build

on:
  workflow_dispatch:
  schedule:
    - cron: '37 3 * * *'

permissions:
  contents: write

concurrency:
  group: xanmod-arm64-edge
  cancel-in-progress: false

jobs:
  build:
    name: Build XanMod Kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Space
        run: |
          set -e
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo apt-get clean
          df -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Release
        id: xanmod
        shell: bash
        env:
          GITLAB_API: https://gitlab.com/api/v4/projects/xanmod%2Flinux
        run: |
          set -euo pipefail

          for page in $(seq 1 50); do
            releases="$(curl -fsSL --retry 5 "$GITLAB_API/releases?order_by=released_at&sort=desc&per_page=100&page=$page")"
            
            IFS=$'\t' read -r tag commit released_at package_url < <(
              jq -r '
                limit(1;
                  .[]
                  | select(.upcoming_release == false)
                  | select(.tag_name | test("^[0-9]+\\.[0-9]+\\.[0-9]+-xanmod[0-9]+$"))
                  | select(any(.assets.links[]?; (.url // "") | test("sourceforge\\.net/projects/xanmod/files/releases/edge/[^/]+/?$")))
                  | [
                      .tag_name,
                      .commit.id,
                      .released_at,
                      (.assets.links[] | select((.url // "") | test("sourceforge\\.net/projects/xanmod/files/releases/edge/[^/]+/?$")) | .url)
                    ]
                  | @tsv
                )
              ' <<< "$releases"
            ) || true

            [[ -n "$tag" ]] && break
            [[ "$(jq 'length' <<< "$releases")" -lt 100 ]] && break
          done

          if [[ -z "$tag" ]]; then
            exit 1
          fi

          {
            echo "tag=$tag"
            echo "commit=$commit"
            echo "released_at=$released_at"
            echo "package_url=$package_url"
          } >> "$GITHUB_OUTPUT"

      - name: Status
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.xanmod.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Dependencies
        if: steps.published.outputs.skip != 'true'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail

          sudo dpkg --add-architecture arm64
          sudo sed -i 's/^Types: deb/Types: deb\nArchitectures: amd64 i386/' /etc/apt/sources.list.d/ubuntu.sources

          cat <<EOF | sudo tee /etc/apt/sources.list.d/ubuntu-ports.sources
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: noble noble-updates noble-security
          Components: main restricted universe multiverse
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF

          sudo apt-get update

          if ! command -v clang-22 &> /dev/null; then
            wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 22
          fi

          sudo apt-get install -y --no-install-recommends \
            build-essential crossbuild-essential-arm64 \
            gcc-12 g++-12 \
            bc bison flex fakeroot kmod cpio lz4 xz-utils zstd \
            clang-22 lld-22 llvm-22 rsync \
            libelf-dev libssl-dev libdw-dev zlib1g-dev \
            libelf-dev:arm64 libssl-dev:arm64 zlib1g-dev:arm64 \
            debhelper dpkg-dev dwarves ccache pkg-config python3 \
            binutils libtinfo-dev ncurses-dev pahole

          for tool in aarch64-linux-gnu-gcc aarch64-linux-gnu-ld aarch64-linux-gnu-ar; do
            if ! which "$tool" >/dev/null 2>&1; then
              echo "ERROR: Cross-compiler tool missing: $tool"
              exit 1
            fi
          done

          for tool in clang lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-readelf llvm-strip; do
            sudo ln -sf "/usr/bin/${tool}-22" "/usr/bin/${tool}"
          done

          sudo rm -f /usr/bin/ld
          sudo ln -sf /usr/bin/ld.bfd /usr/bin/ld

          for tool in gcc ld cc; do
            if ! which "$tool" >/dev/null 2>&1; then
              echo "ERROR: Host tool missing: $tool"
              exit 1
            fi
          done

          echo "/usr/lib/ccache" >> "$GITHUB_PATH"

      - name: Cache
        if: steps.published.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-xanmod-edge-${{ steps.xanmod.outputs.tag }}-clang22
          restore-keys: |
            ${{ runner.os }}-xanmod-edge-${{ steps.xanmod.outputs.tag }}-clang22
            ${{ runner.os }}-xanmod-edge-

      - name: Source
        if: steps.published.outputs.skip != 'true'
        env:
          TAG: ${{ steps.xanmod.outputs.tag }}
          EXPECTED_COMMIT: ${{ steps.xanmod.outputs.commit }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$TAG" https://gitlab.com/xanmod/linux.git kernel
          cd kernel

          [[ "$(git rev-parse HEAD)" == "$EXPECTED_COMMIT" ]] || exit 1
          [[ -f arch/arm64/configs/defconfig ]] && [[ -f CONFIGS/x86_64/config ]] || exit 1

      - name: Configure
        if: steps.published.outputs.skip != 'true'
        env:
          TAG: ${{ steps.xanmod.outputs.tag }}
          ARCH: arm64
          LLVM: 1
          CROSS_COMPILE: aarch64-linux-gnu-
        run: |
          set -euo pipefail
          cd kernel
          rm -rf .git

          make defconfig
          cp .config .config.arm64-base

          awk '/^[[:space:]]*CONFIG_[A-Za-z0-9_]+=(y|m|-?[0-9]+|0x[0-9A-Fa-f]+|".*")$/ {
              if ($0 ~ /^[[:space:]]*CONFIG_LOCALVERSION=/) next;
              sub(/^[[:space:]]+/, "");
              print
          }' CONFIGS/x86_64/config > .xanmod-candidates

          ./scripts/kconfig/merge_config.sh -m .config .xanmod-candidates > /dev/null 2>&1
          make olddefconfig

          ./scripts/config --disable LOCALVERSION_AUTO
          for dbg in DEBUG_INFO DEBUG_INFO_BTF DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT DEBUG_INFO_DWARF4 DEBUG_INFO_DWARF5; do
            ./scripts/config -d "$dbg"
          done
          ./scripts/config -e DEBUG_INFO_NONE

          xanmod_suffix="${TAG#*-}"
          echo "-${xanmod_suffix}-arm64-edge" > localversion

          make olddefconfig
          cp .config .config.final

          release="$(make -s kernelrelease)"
          expected="${TAG}-arm64-edge"
          [[ "$release" == "$expected" ]] || { echo "Version mismatch: $release != $expected"; exit 1; }

      - name: Audit
        if: steps.published.outputs.skip != 'true'
        env:
          ARCH: arm64
          LLVM: 1
          CROSS_COMPILE: aarch64-linux-gnu-
        run: |
          set -euo pipefail
          cd kernel

          if grep -Eq '^CONFIG_X86(=|_)|^CONFIG_X86_64(=_)' .config; then
            echo "ERROR: x86 config detected in ARM64 build"
            exit 1
          fi

          for req in ARM64 64BIT MODULES NET INET PROC_FS SYSFS CGROUPS NAMESPACES BPF BPF_SYSCALL; do
            grep -q "^CONFIG_${req}=y$" .config || {
              echo "ERROR: Missing required config: CONFIG_${req}=y"
              exit 1
            }
          done

          if grep -qE '^CONFIG_(MCORE2|MZEN|X86_NATIVE_CPU|X86_64_VERSION)=' .config; then
            echo "ERROR: x86 CPU config detected in ARM64 build"
            exit 1
          fi

          make -s prepare

      - name: Build
        if: steps.published.outputs.skip != 'true'
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          KBUILD_BUILD_USER: github-actions
          KBUILD_BUILD_HOST: github-arm64-cross
          DEBFULLNAME: github-actions
          DEBEMAIL: github-actions@users.noreply.github.com
          KDEB_CHANGELOG_DIST: noble
          ARCH: arm64
          LLVM: 1
          CROSS_COMPILE: aarch64-linux-gnu-
          HOSTCC: gcc
          HOSTCXX: g++
          CC: clang
          LD: aarch64-linux-gnu-ld.bfd
          KBUILD_VERBOSE: 1
        run: |
          set -euo pipefail
          cd kernel
          ccache --zero-stats

          echo "=== Build Environment ==="
          echo "ARCH: $ARCH"
          echo "CROSS_COMPILE: $CROSS_COMPILE"
          echo "CC: $(which $CC)"
          echo "LD: $(which $LD)"
          echo "HOSTCC: $(which $HOSTCC)"
          echo "PATH: $PATH"
          echo "=== End Environment ==="

          make \
            -j"$(($(nproc) + 1))" \
            bindeb-pkg

          ccache --show-stats

      - name: Verify
        if: steps.published.outputs.skip != 'true'
        env:
          TAG: ${{ steps.xanmod.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist

          shopt -s nullglob
          packages=(*.deb)
          ((${#packages[@]} > 0)) || { echo "ERROR: No .deb packages generated"; exit 1; }

          image_pkg=""
          headers_pkg=""
          libc_pkg=""

          for deb in "${packages[@]}"; do
            arch="$(dpkg-deb --field "$deb" Architecture)"
            [[ "$arch" == "arm64" || "$arch" == "all" ]] || {
              echo "ERROR: Package $deb has wrong architecture: $arch"
              exit 1
            }

            pkg_name="$(dpkg-deb --field "$deb" Package)"
            case "$pkg_name" in
              linux-image-*-dbg) continue ;;
              linux-image-*) image_pkg="$deb" ;;
              linux-headers-*) headers_pkg="$deb" ;;
              linux-libc-dev) libc_pkg="$deb" ;;
            esac
            mv "$deb" dist/
          done

          [[ -n "$image_pkg" && -n "$headers_pkg" && -n "$libc_pkg" ]] || {
            echo "ERROR: Missing required packages (image/headers/libc)"
            exit 1
          }

          cd dist
          dpkg-deb --contents "$image_pkg" | grep -q '/boot/vmlinuz-' || {
            echo "ERROR: vmlinuz not found in image package"
            exit 1
          }
          dpkg-deb --contents "$image_pkg" | grep -q '/lib/modules/' || {
            echo "ERROR: modules not found in image package"
            exit 1
          }
          dpkg-deb --contents "$headers_pkg" | grep -q '/usr/src/linux-headers-' || {
            echo "ERROR: headers not found in headers package"
            exit 1
          }

          [[ "$(dpkg-deb --field "$image_pkg" Package)" == *"-arm64-edge" ]] || {
            echo "ERROR: Package name doesn't contain -arm64-edge suffix"
            exit 1
          }

          sha256sum *.deb > SHA256SUMS

          cat <<EOF > RELEASE.md
          ## XanMod ARM64 EDGE: $TAG

          * **Kernel Release:** \`${TAG}-arm64-edge\`
          * **Architecture:** \`arm64\`
          * **Profile:** Full-Featured
          * **Channel:** EDGE
          * **Upstream Source:** [GitLab XanMod Linux](https://gitlab.com/xanmod/linux/-/releases/$TAG)

          ### Checksums (SHA256)
          \`\`\`text
          $(cat SHA256SUMS)
          \`\`\`
          EOF

      - name: Publish
        if: steps.published.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.xanmod.outputs.tag }}
        run: |
          set -euo pipefail

          gh release create "$TAG" \
            dist/*.deb dist/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "XanMod ${TAG} ARM64 EDGE" \
            --notes-file dist/RELEASE.md

