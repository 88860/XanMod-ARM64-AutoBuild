name: XanMod ARM64 Build

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Channel to build (all / edge / main / lts)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - edge
          - main
          - lts
      enable_btf:
        description: 'Enable DEBUG_INFO_BTF (DWARF4 + BTF; uses more runner disk)'
        required: false
        default: true
        type: boolean
      sync_apt:
        description: 'Rebuild and deploy GitHub Pages APT repository from existing releases'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '37 3 * * *'

concurrency:
  group: xanmod-arm64-${{ github.workflow }}
  cancel-in-progress: false

env:
  LLVM_VER: 22
  GH_REPO: ${{ github.repository }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_builds: ${{ steps.check.outputs.has_builds }}
      matrix: ${{ steps.check.outputs.matrix }}
    steps:
      - name: Preflight
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_CHANNEL: ${{ inputs.channel || 'all' }}
        run: |
          set -euo pipefail
          if [[ "$INPUT_CHANNEL" == "all" ]]; then
            channels=(edge main lts)
          else
            channels=("$INPUT_CHANNEL")
          fi

          declare -A found_tag found_commit
          for p in $(seq 1 50); do
            res="$(curl -fsSL --retry 5 --retry-delay 2 "https://gitlab.com/api/v4/projects/xanmod%2Flinux/releases?order_by=released_at&sort=desc&per_page=100&page=$p")"
            for ch in "${channels[@]}"; do
              [[ -n "${found_tag[$ch]:-}" ]] && continue
              IFS=$'\t' read -r t c < <(jq -r --arg ch "$ch" '
                limit(1; .[]
                  | select(.upcoming_release == false
                    and (.tag_name | test("^[0-9]+\\.[0-9]+(\\.[0-9]+)?-xanmod[0-9]+$"))
                    and any(.assets.links[]?; (.url // "") | test("sourceforge\\.net/projects/xanmod/files/releases/" + $ch + "/[^/]+/?$")))
                  | [.tag_name, .commit.id] | @tsv)
              ' <<< "$res") || true
              if [[ -n "${t:-}" && -n "${c:-}" ]]; then
                found_tag[$ch]="$t"
                found_commit[$ch]="$c"
              fi
            done
            all_found=true
            for ch in "${channels[@]}"; do
              [[ -n "${found_tag[$ch]:-}" ]] || { all_found=false; break; }
            done
            $all_found && break
            [[ "$(jq 'length' <<< "$res")" -lt 100 ]] && break
          done

          include_json="[]"
          for ch in "${channels[@]}"; do
            tag="${found_tag[$ch]:-}"
            commit="${found_commit[$ch]:-}"
            [[ -n "$tag" && -n "$commit" ]] || { echo "Failed to resolve upstream release for channel: $ch" >&2; exit 1; }
            kernel_rel="${tag%%-*}-arm64-${tag#*-}"
            rel_tag="${kernel_rel}-${ch}"
            build=true
            if assets="$(gh release view "$rel_tag" --json assets --jq '.assets[].name' 2>/dev/null)"; then
              if grep -E "^linux-image-${kernel_rel//./\\.}_.*_arm64\.deb$" <<< "$assets" >/dev/null \
                && grep -E "^linux-headers-${kernel_rel//./\\.}_.*_arm64\.deb$" <<< "$assets" >/dev/null \
                && grep -E '^linux-libc-dev_.*_arm64\.deb$' <<< "$assets" >/dev/null \
                && grep -Fx 'SHA256SUMS' <<< "$assets" >/dev/null; then
                build=false
              fi
            fi
            echo "Channel ${ch}: tag=${tag}, kernel_rel=${kernel_rel}, release_tag=${rel_tag}, build_needed=${build}"
            if [[ "$build" == "true" ]]; then
              include_json="$(jq -cn \
                --argjson arr "$include_json" \
                --arg ch "$ch" \
                --arg tag "$tag" \
                --arg commit "$commit" \
                --arg rtag "$rel_tag" \
                '$arr + [{"channel": $ch, "tag": $tag, "commit": $commit, "release_tag": $rtag}]')"
            fi
          done

          has_builds="false"
          if [[ "$(jq 'length' <<< "$include_json")" -gt 0 ]]; then
            has_builds="true"
          fi
          echo "has_builds=$has_builds" >> "$GITHUB_OUTPUT"
          echo "matrix=$include_json" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.channel }})
    needs: preflight
    if: needs.preflight.outputs.has_builds == 'true'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.preflight.outputs.matrix) }}
    env:
      CHANNEL: ${{ matrix.channel }}
      TAG: ${{ matrix.tag }}
      EXPECTED_COMMIT: ${{ matrix.commit }}
      RELEASE_TAG: ${{ matrix.release_tag }}
      ENABLE_BTF: ${{ github.event_name != 'workflow_dispatch' || inputs.enable_btf == true }}
    steps:
      - name: Setup
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == "aarch64" && "$(dpkg --print-architecture)" == "arm64" ]] || exit 1
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl wget ca-certificates gnupg lsb-release software-properties-common
          curl -fsSL --retry 5 --retry-delay 2 https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          sudo bash /tmp/llvm.sh "$LLVM_VER"
          sudo apt-get purge -y "lldb-$LLVM_VER" "clangd-$LLVM_VER" || true
          sudo apt-get autoremove -y --purge
          sudo apt-get install -y --no-install-recommends build-essential bc bison flex fakeroot kmod cpio lz4 xz-utils zstd clang-$LLVM_VER lld-$LLVM_VER llvm-$LLVM_VER rsync libelf-dev libssl-dev libdw-dev zlib1g-dev debhelper dpkg-dev dwarves pkg-config python3 binutils openssl
          for t in clang clang++ ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-readelf llvm-strip llvm-link; do
            sudo ln -sf "/usr/bin/$t-$LLVM_VER" "/usr/bin/$t"
          done
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/* /tmp/llvm.sh
          df -h

      - name: Config & Build
        env:
          LLVM: 1
          KDEB_COMPRESS: xz
          KBUILD_BUILD_USER: github-actions
          KBUILD_BUILD_HOST: github-arm64-native
          DEBFULLNAME: github-actions
          DEBEMAIL: github-actions@users.noreply.github.com
        run: |
          set -euo pipefail
          MAKE_ARGS=(
            ARCH=arm64
            LLVM=1
          )

          git clone --depth=1 --branch "$TAG" https://gitlab.com/xanmod/linux.git kernel
          cd kernel
          [[ "$(git rev-parse HEAD^{commit})" == "$EXPECTED_COMMIT" ]] || exit 1
          commit_short="$(git rev-parse --short=7 HEAD)"
          commit_date="$(git show -s --date=format:'%Y%m%d' --format=%cd)"
          rm -rf .git

          if [[ -f "CONFIGS/x86_64/config" ]]; then
            xanmod_conf="CONFIGS/x86_64/config"
          else
            xanmod_conf=$(find CONFIGS -type f -name "config" | grep -iE 'x86_64|x86-64-v' | head -n 1 || true)
          fi
          [[ -f "$xanmod_conf" ]] || exit 1

          make "${MAKE_ARGS[@]}" defconfig

          find . \( -path './arch/*' -a ! -path './arch/arm64/*' \) -prune -o -name 'Kconfig*' -type f -print > kconfig.files

          python3 - kconfig.files "$xanmod_conf" > xanmod.arm64.fragment <<'PYEOF'
          import re, sys

          kconfig_list_file, xanmod_conf_file = sys.argv[1], sys.argv[2]
          arm_syms = set()
          choice_groups = []

          with open(kconfig_list_file) as fl:
              kfiles = [line.strip() for line in fl if line.strip()]

          for kf in kfiles:
              in_choice = False
              cur_choice = set()
              with open(kf, errors="replace") as f:
                  for raw in f:
                      m_sym = re.match(r"^\s*(?:config|menuconfig)\s+([A-Za-z0-9_]+)", raw)
                      if m_sym:
                          sym = "CONFIG_" + m_sym.group(1)
                          arm_syms.add(sym)
                          if in_choice:
                              cur_choice.add(sym)
                          continue
                      if re.match(r"^\s*choice\b", raw):
                          in_choice = True
                          cur_choice = set()
                      elif in_choice and re.match(r"^\s*endchoice\b", raw):
                          if cur_choice:
                              choice_groups.append(cur_choice)
                          in_choice = False
                          cur_choice = set()

          xm_lines = open(xanmod_conf_file, errors="replace").read().splitlines()
          xm_set = {}
          xm_unset = set()
          for line in xm_lines:
              if line.startswith("CONFIG_") and "=" in line:
                  k, v = line.split("=", 1)
                  xm_set[k] = v
              elif line.startswith("# CONFIG_") and line.endswith(" is not set"):
                  xm_unset.add(line[2:-len(" is not set")])

          choice_unsets = set()
          for grp in choice_groups:
              if any(sym in arm_syms and xm_set.get(sym) == "y" for sym in grp):
                  for sym in grp:
                      if sym in xm_unset and sym in arm_syms and not sym.startswith("CONFIG_DEBUG_INFO"):
                          choice_unsets.add(sym)

          safe_unsets = {
              "CONFIG_DEBUG_PREEMPT",
              "CONFIG_PREEMPT_TRACER",
              "CONFIG_PREEMPTIRQ_DELAY_TEST",
              "CONFIG_RCU_LAZY_DEFAULT_OFF",
              "CONFIG_RCU_NOCB_CPU_DEFAULT_ALL",
              "CONFIG_INIT_ON_FREE_DEFAULT_ON",
              "CONFIG_WERROR",
              "CONFIG_OBJTOOL_WERROR",
          }

          for line in xm_lines:
              if line.startswith("CONFIG_") and "=" in line:
                  k = line.split("=", 1)[0]
                  if k == "CONFIG_NR_CPUS":
                      continue
                  if k in arm_syms:
                      print(line)
              elif line.startswith("# CONFIG_") and line.endswith(" is not set"):
                  k = line[2:-len(" is not set")]
                  if k in choice_unsets or (k in safe_unsets and k in arm_syms):
                      print(line)
          PYEOF

          ./scripts/kconfig/merge_config.sh -m -y .config xanmod.arm64.fragment

          rm -f localversion*
          printf '%s\n' "-${TAG#*-}" > localversion
          ./scripts/config --set-str LOCALVERSION "-arm64"
          ./scripts/config --disable LOCALVERSION_AUTO

          if [[ "$ENABLE_BTF" == "true" ]]; then
            ./scripts/config -d DEBUG_INFO_NONE -d DEBUG_INFO_DWARF5 -d DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT -d DEBUG_INFO_SPLIT -d DEBUG_INFO_REDUCED -d DEBUG_INFO_COMPRESSED_ZLIB -d DEBUG_INFO_COMPRESSED_ZSTD || true
            ./scripts/config -e DEBUG_INFO -e DEBUG_INFO_DWARF4 -e DEBUG_INFO_COMPRESSED_NONE -e DEBUG_INFO_BTF -e DEBUG_INFO_BTF_MODULES || true
          else
            for dbg in DEBUG_INFO DEBUG_INFO_BTF DEBUG_INFO_BTF_MODULES DEBUG_INFO_DWARF_TOOLCHAIN_DEFAULT DEBUG_INFO_DWARF4 DEBUG_INFO_DWARF5; do
              ./scripts/config -d "$dbg" || true
            done
            ./scripts/config -e DEBUG_INFO_NONE || true
          fi

          make "${MAKE_ARGS[@]}" olddefconfig
          grep -q '^CONFIG_CC_IS_CLANG=y$' .config || exit 1
          if [[ "$ENABLE_BTF" == "true" ]]; then
            grep -Fxq 'CONFIG_DEBUG_INFO_BTF=y' .config || { echo "CONFIG_DEBUG_INFO_BTF=y failed to enable" >&2; exit 1; }
          fi
          make "${MAKE_ARGS[@]}" syncconfig

          {
            echo "### XanMod ARM64 ${CHANNEL^^} (${TAG})"
            echo ""
            echo "| Optimization | Fragment | Final \`.config\` |"
            echo "| :--- | :--- | :--- |"
            for opt in \
              CONFIG_PREEMPT_LAZY=y \
              CONFIG_SCHED_CLASS_EXT=y \
              CONFIG_CPU_FREQ_DEFAULT_GOV_PERFORMANCE=y \
              CONFIG_IOMMU_DEFAULT_DMA_LAZY=y \
              CONFIG_RCU_LAZY=y \
              CONFIG_TCP_CONG_BBR=y \
              'CONFIG_DEFAULT_TCP_CONG="bbr"' \
              CONFIG_NET_SCH_FQ=y \
              'CONFIG_DEFAULT_NET_SCH="fq"' \
              CONFIG_LRU_GEN_ENABLED=y \
              CONFIG_TRANSPARENT_HUGEPAGE_ALWAYS=y \
              CONFIG_ZSWAP_DEFAULT_ON=y \
              CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y \
              CONFIG_HZ_250=y \
              CONFIG_DEBUG_INFO_BTF=y \
              CONFIG_DEBUG_INFO_BTF_MODULES=y; do
              in_frag="absent"
              in_final="no"
              grep -Fxq "$opt" xanmod.arm64.fragment && in_frag="present" || true
              grep -Fxq "$opt" .config && in_final="yes" || true
              echo "| \`$opt\` | $in_frag | $in_final |"
              if [[ "$in_frag" == "present" && "$in_final" != "yes" && "$ENABLE_BTF" == "true" ]]; then
                echo "::warning::XanMod option $opt was requested in fragment but did not survive olddefconfig"
              elif [[ "$in_frag" == "present" && "$in_final" != "yes" && "$opt" != CONFIG_DEBUG_INFO_BTF* ]]; then
                echo "::warning::XanMod option $opt was requested in fragment but did not survive olddefconfig"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

          cp .config .config.final
          expected_rel="${TAG%%-*}-arm64-${TAG#*-}"
          kernel_rel="$(make -s "${MAKE_ARGS[@]}" kernelrelease)"
          [[ "$kernel_rel" == "$expected_rel" ]] || exit 1
          pkg_ver="${kernel_rel}-0~${commit_date}.g${commit_short}"
          echo "KERNEL_RELEASE=${kernel_rel}" >> "$GITHUB_ENV"
          echo "KDEB_PKGVERSION=${pkg_ver}" >> "$GITHUB_ENV"

          make "${MAKE_ARGS[@]}" KDEB_PKGVERSION="${pkg_ver}" KDEB_COMPRESS=xz -j"$(nproc)" bindeb-pkg

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          dbg_pkgs=(*dbg*.deb *dbgsym*.deb)
          ((${#dbg_pkgs[@]} == 0)) || exit 1
          packages=(*.deb)
          ((${#packages[@]} > 0)) || exit 1

          img="" hdr="" libc=""
          for deb in "${packages[@]}"; do
            case "$(dpkg-deb --field "$deb" Package)" in
              linux-image-*) [[ -z "$img" ]] && img="$(basename "$deb")" ;;
              linux-headers-*) [[ -z "$hdr" ]] && hdr="$(basename "$deb")" ;;
              linux-libc-dev) [[ -z "$libc" ]] && libc="$(basename "$deb")" ;;
            esac
            mv "$deb" dist/
          done
          [[ -n "$img" && -n "$hdr" && -n "$libc" ]] || exit 1
          cd dist

          [[ "$(dpkg-deb --field "$img" Package)" == "linux-image-${KERNEL_RELEASE}" ]] || exit 1
          [[ "$(dpkg-deb --field "$hdr" Package)" == "linux-headers-${KERNEL_RELEASE}" ]] || exit 1
          [[ "$(dpkg-deb --field "$img" Version)" == "$KDEB_PKGVERSION" ]] || exit 1

          dpkg-deb --contents "$img" | grep "/boot/vmlinuz-${KERNEL_RELEASE}" >/dev/null || exit 1
          dpkg-deb --contents "$img" | grep "/lib/modules/${KERNEL_RELEASE}/" >/dev/null || exit 1
          dpkg-deb --contents "$hdr" | grep "/usr/src/linux-headers-${KERNEL_RELEASE}" >/dev/null || exit 1

          mkdir verify-image
          dpkg-deb --extract "$img" verify-image
          [[ -f "verify-image/boot/config-${KERNEL_RELEASE}" ]] || exit 1
          cmp -s "verify-image/boot/config-${KERNEL_RELEASE}" ../kernel/.config.final || exit 1
          rm -rf verify-image

          case "$CHANNEL" in
            main) meta_pkg="linux-xanmod-arm64" ;;
            edge) meta_pkg="linux-xanmod-edge-arm64" ;;
            lts)  meta_pkg="linux-xanmod-lts-arm64" ;;
            *)    exit 1 ;;
          esac
          meta_ver="${TAG}-0"
          meta_dir="meta-${meta_pkg}"
          mkdir -p "${meta_dir}/DEBIAN"
          sed 's/^          //' <<EOF > "${meta_dir}/DEBIAN/control"
          Package: ${meta_pkg}
          Source: linux-upstream
          Version: ${meta_ver}
          Architecture: arm64
          Maintainer: github-actions <github-actions@users.noreply.github.com>
          Section: kernel
          Priority: optional
          Depends: linux-image-${KERNEL_RELEASE}, linux-headers-${KERNEL_RELEASE}
          Provides: linux-image-xanmod
          Description: XanMod Linux kernel and headers (${CHANNEL^^}) for ARM64
           Metapackage for XanMod ${CHANNEL^^} Linux kernel image and headers packages.
          EOF
          chmod 0755 "${meta_dir}/DEBIAN"
          meta_deb="${meta_pkg}_${meta_ver}_arm64.deb"
          dpkg-deb --root-owner-group --build "$meta_dir" "$meta_deb"
          rm -rf "$meta_dir"
          [[ "$(dpkg-deb --field "$meta_deb" Package)" == "$meta_pkg" ]] || exit 1

          sha256sum *.deb > SHA256SUMS
          sed 's/^          //' <<EOF > RELEASE.md
          ## XanMod ARM64 ${CHANNEL^^}: $TAG
          * **Architecture:** \`arm64\`
          * **Channel:** ${CHANNEL^^}
          * **Kernel Release:** \`${KERNEL_RELEASE}\`
          * **Package Version:** \`${KDEB_PKGVERSION}\`
          * **Metapackage:** \`${meta_pkg}\` (\`${meta_ver}\`)
          * **Upstream:** [GitLab XanMod Linux](https://gitlab.com/xanmod/linux/-/releases/$TAG)
          * **Compiler:** Clang ${LLVM_VER}
          * **Build:** GitHub Actions Native ARM64
          EOF

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" *.deb SHA256SUMS --clobber
            gh release edit "$RELEASE_TAG" --title "XanMod ${TAG} ARM64 ${CHANNEL^^}" --notes-file RELEASE.md
          else
            gh release create "$RELEASE_TAG" *.deb SHA256SUMS --title "XanMod ${TAG} ARM64 ${CHANNEL^^}" --notes-file RELEASE.md
          fi

          gh release list --limit 50 --json tagName -q '.[].tagName' | grep -E -- "-arm64(-[^-]+)?-${CHANNEL}$" | grep -Fxv "$RELEASE_TAG" | while read -r old_tag; do
            gh release delete "$old_tag" --cleanup-tag -y || true
          done || true

  publish-apt:
    name: Publish APT (GitHub Pages)
    needs: [preflight, build]
    if: always() && needs.preflight.result == 'success' && needs.build.result != 'cancelled' && (needs.preflight.outputs.has_builds == 'true' || (github.event_name == 'workflow_dispatch' && inputs.sync_apt == true))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check GPG signing secret
        id: gpg_check
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          if [[ -z "${APT_GPG_PRIVATE_KEY// }" ]]; then
            echo "::warning::APT_GPG_PRIVATE_KEY secret is not configured; skipping GitHub Pages APT deployment."
            echo "has_key=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Pages
        id: pages
        if: steps.gpg_check.outputs.has_key == 'true'
        uses: actions/configure-pages@v5

      - name: Build Signed APT Repository
        if: steps.gpg_check.outputs.has_key == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apt-utils gnupg xz-utils

          export GNUPGHOME
          GNUPGHOME="$(mktemp -d)"
          chmod 0700 "$GNUPGHOME"
          trap 'rm -rf "$GNUPGHOME"' EXIT

          key_file="$(mktemp)"
          printf '%s\n' "$APT_GPG_PRIVATE_KEY" > "$key_file"
          if grep -q 'BEGIN PGP PRIVATE KEY BLOCK' "$key_file"; then
            gpg --batch --import "$key_file"
          else
            tr -d '[:space:]' < "$key_file" | base64 -d | gpg --batch --import
          fi
          rm -f "$key_file"

          gpg_fpr="$(gpg --batch --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')"
          [[ -n "$gpg_fpr" ]] || { echo "No secret GPG key found in APT_GPG_PRIVATE_KEY" >&2; exit 1; }

          rm -rf apt-site stage-debs
          mkdir -p apt-site/pool/main apt-site/dists/stable/main/binary-arm64 stage-debs

          releases_json="$(gh release list --limit 100 --json tagName,isDraft,isPrerelease)"
          channel_summary=""

          for ch in edge main lts; do
            rtag="$(jq -r --arg ch "$ch" '[.[] | select(.isDraft == false and .isPrerelease == false and (.tagName | test("-arm64(-[^-]+)?-" + $ch + "$")))][0].tagName // ""' <<< "$releases_json")"
            [[ -n "$rtag" ]] || continue

            ch_dir="stage-debs/${ch}"
            mkdir -p "$ch_dir"
            gh release download "$rtag" --dir "$ch_dir" \
              --pattern 'linux-image-*_arm64.deb' \
              --pattern 'linux-headers-*_arm64.deb' \
              --pattern 'linux-xanmod*-arm64_*_arm64.deb' \
              --pattern 'SHA256SUMS' || true

            if [[ -f "${ch_dir}/SHA256SUMS" ]]; then
              (cd "$ch_dir" && sha256sum --ignore-missing -c SHA256SUMS)
            fi

            shopt -s nullglob
            imgs=("${ch_dir}"/linux-image-*_arm64.deb)
            hdrs=("${ch_dir}"/linux-headers-*_arm64.deb)
            metas=("${ch_dir}"/linux-xanmod*-arm64_*_arm64.deb)
            shopt -u nullglob
            ((${#imgs[@]} > 0 && ${#hdrs[@]} > 0)) || continue

            img_pkg="$(dpkg-deb --field "${imgs[0]}" Package)"
            hdr_pkg="$(dpkg-deb --field "${hdrs[0]}" Package)"
            krel="${img_pkg#linux-image-}"
            case "$ch" in
              main) meta_pkg="linux-xanmod-arm64" ;;
              edge) meta_pkg="linux-xanmod-edge-arm64" ;;
              lts)  meta_pkg="linux-xanmod-lts-arm64" ;;
            esac

            if ((${#metas[@]} == 0)); then
              tag_base="${rtag%-${ch}}"
              if [[ "$tag_base" == *-arm64 ]]; then
                up_ver="${tag_base%-arm64}"
              else
                up_ver="${tag_base%%-*}-${tag_base#*-arm64-}"
              fi
              meta_ver="${up_ver}-0"
              meta_dir="${ch_dir}/meta-${meta_pkg}"
              mkdir -p "${meta_dir}/DEBIAN"
              cat <<EOF > "${meta_dir}/DEBIAN/control"
          Package: ${meta_pkg}
          Source: linux-upstream
          Version: ${meta_ver}
          Architecture: arm64
          Maintainer: github-actions <github-actions@users.noreply.github.com>
          Section: kernel
          Priority: optional
          Depends: ${img_pkg}, ${hdr_pkg}
          Provides: linux-image-xanmod
          Description: XanMod Linux kernel and headers (${ch^^}) for ARM64
           Metapackage for XanMod ${ch^^} Linux kernel image and headers packages.
          EOF
              chmod 0755 "${meta_dir}/DEBIAN"
              dpkg-deb --root-owner-group --build "$meta_dir" "${ch_dir}/${meta_pkg}_${meta_ver}_arm64.deb"
              rm -rf "$meta_dir"
              metas=("${ch_dir}/${meta_pkg}_${meta_ver}_arm64.deb")
            fi

            cp -f "${imgs[0]}" apt-site/pool/main/
            cp -f "${hdrs[0]}" apt-site/pool/main/
            cp -f "${metas[0]}" apt-site/pool/main/
            meta_ver_actual="$(dpkg-deb --field "${metas[0]}" Version)"
            channel_summary="${channel_summary}<li><code>${meta_pkg}</code> (<strong>${ch^^}</strong>): <code>${meta_ver_actual}</code> &rarr; <code>${krel}</code></li>"
          done

          shopt -s nullglob
          pool_debs=(apt-site/pool/main/*.deb)
          shopt -u nullglob
          ((${#pool_debs[@]} > 0)) || { echo "No ARM64 .deb packages found across releases" >&2; exit 1; }

          gpg --batch --armor --export "$gpg_fpr" > apt-site/archive.key
          gpg --batch --export "$gpg_fpr" > apt-site/xanmod-arm64.gpg

          (
            cd apt-site
            apt-ftparchive packages pool/main > dists/stable/main/binary-arm64/Packages
            gzip -kf -9 dists/stable/main/binary-arm64/Packages
            xz -kf -9 dists/stable/main/binary-arm64/Packages
          )

          cat <<'EOF' > apt-site/dists/stable/main/binary-arm64/Release
          Archive: stable
          Component: main
          Origin: XanMod-ARM64-AutoBuild
          Label: XanMod ARM64 Kernel Repository
          Architecture: arm64
          EOF
          sed -i 's/^          //' apt-site/dists/stable/main/binary-arm64/Release

          cat <<'EOF' > apt-release.conf
          APT::FTPArchive::Release {
            Origin "XanMod-ARM64-AutoBuild";
            Label "XanMod ARM64 Kernel Repository";
            Suite "stable";
            Codename "stable";
            Architectures "arm64";
            Components "main";
            Description "XanMod ARM64 APT Repository (MAIN / EDGE / LTS)";
          };
          EOF

          apt-ftparchive -c apt-release.conf release apt-site/dists/stable > apt-site/dists/stable/Release
          rm -f apt-release.conf

          gpg --batch --yes --digest-algo SHA256 -u "$gpg_fpr" --armor --detach-sign -o apt-site/dists/stable/Release.gpg apt-site/dists/stable/Release
          gpg --batch --yes --digest-algo SHA256 -u "$gpg_fpr" --clearsign -o apt-site/dists/stable/InRelease apt-site/dists/stable/Release
          gpgv --keyring apt-site/xanmod-arm64.gpg apt-site/dists/stable/InRelease

          base_url="${PAGES_URL%/}"
          cat <<EOF > apt-site/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head><meta charset="utf-8"><title>XanMod ARM64 APT Repository</title>
          <style>body{font-family:system-ui,sans-serif;max-width:820px;margin:2rem auto;padding:0 1rem;line-height:1.6}pre{background:#f4f4f6;padding:1rem;border-radius:6px;overflow-x:auto}code{font-family:monospace}</style>
          </head>
          <body>
          <h1>XanMod ARM64 APT Repository</h1>
          <p>Automated ARM64 (<code>aarch64</code>) XanMod kernel repository for Debian and Ubuntu.</p>
          <h2>Configure APT</h2>
          <pre>sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL ${base_url}/xanmod-arm64.gpg | sudo tee /etc/apt/keyrings/xanmod-arm64.gpg >/dev/null
          sudo chmod 0644 /etc/apt/keyrings/xanmod-arm64.gpg
          echo "deb [signed-by=/etc/apt/keyrings/xanmod-arm64.gpg arch=arm64] ${base_url} stable main" | sudo tee /etc/apt/sources.list.d/xanmod-arm64.list
          sudo apt update &amp;&amp; sudo apt install -y linux-xanmod-arm64</pre>
          <h2>Published Packages</h2>
          <ul>${channel_summary}</ul>
          </body>
          </html>
          EOF
          sed -i 's/^          //' apt-site/index.html

      - name: Upload Pages artifact
        if: steps.gpg_check.outputs.has_key == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: apt-site

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.gpg_check.outputs.has_key == 'true'
        uses: actions/deploy-pages@v4
