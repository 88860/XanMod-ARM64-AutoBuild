name: Build XanMod ARM64 LTS

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: write

concurrency:
  group: xanmod-arm64-lts
  cancel-in-progress: false

env:
  XANMOD_REPO: https://gitlab.com/xanmod/linux.git
  ORACLE_CONFIG: https://raw.githubusercontent.com/oracle/kconfigs/gh-pages/out/Oracle%20Linux%2010%20%28UEK%208%29%20aarch64/config
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            libelf-dev libssl-dev libncurses-dev \
            fakeroot dpkg-dev ccache curl jq git \
            xz-utils zstd rsync kmod python3

      - name: Cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: xanmod-arm64-${{ runner.os }}-${{ github.sha }}
          restore-keys: xanmod-arm64-${{ runner.os }}-

      - name: Detect LTS
        id: lts
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 https://www.kernel.org/releases.json -o releases.json
          SERIES=$(
            jq -r '.releases[] | select(.moniker=="longterm") | .version' releases.json |
            sed -E 's/^([0-9]+\.[0-9]+)\..*/\1/' |
            sort -Vu |
            tail -1
          )
          test -n "$SERIES"
          echo "series=$SERIES" >> "$GITHUB_OUTPUT"

      - name: Detect XanMod
        id: xanmod
        run: |
          set -euo pipefail
          S="${{ steps.lts.outputs.series }}"
          TAG=$(
            git ls-remote --tags --refs "$XANMOD_REPO" |
            awk -F/ '{print $3}' |
            grep -E "^${S//./\\.}\.[0-9]+-xanmod[0-9]+$" |
            sort -V |
            tail -1
          )
          test -n "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Clone XanMod
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ steps.xanmod.outputs.tag }}" "$XANMOD_REPO" linux
          cd linux
          test "$(make kernelversion | cut -d. -f1-2)" = "${{ steps.lts.outputs.series }}"

      - name: Fetch Oracle 4K config
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 "$ORACLE_CONFIG" -o oracle.config
          test -s oracle.config
          grep -q '^CONFIG_ARM64=y$' oracle.config
          grep -q '^CONFIG_64BIT=y$' oracle.config
          ! grep -q 'CONFIG_ARM64_64K_PAGES=y' oracle.config

      - name: Prepare config
        working-directory: linux
        run: |
          set -euo pipefail
          cp ../oracle.config .config
          make ARCH=arm64 olddefconfig
          grep -q '^CONFIG_ARM64=y$' .config
          grep -q '^CONFIG_64BIT=y$' .config

      - name: Apply XanMod ARM64 compatible config
        working-directory: linux
        run: |
          set -euo pipefail
          test -f CONFIGS/x86_64/config

          git grep -h -E '^[[:space:]]*config[[:space:]]+[A-Za-z0-9_]+' \
            -- ':!Documentation' ':!samples' ':!tools' |
            sed -E 's/^[[:space:]]*config[[:space:]]+//' |
            awk '{print $1}' |
            sort -u > symbols

          : > fragment

          while IFS= read -r line; do
            [[ "$line" =~ ^CONFIG_ ]] || continue
            symbol="${line%%=*}"
            name="${symbol#CONFIG_}"

            case "$symbol" in
              CONFIG_X86_*|CONFIG_I386_*|CONFIG_X86_64*|CONFIG_CPU_*)
                continue ;;
              CONFIG_MCORE*|CONFIG_MNATIVE|CONFIG_MK*|CONFIG_MZEN*|CONFIG_MATOM*)
                continue ;;
              CONFIG_M486*|CONFIG_M586*|CONFIG_M686*)
                continue ;;
              CONFIG_ARM_*|CONFIG_ARM64_*)
                continue ;;
            esac

            grep -qx "$name" symbols || continue
            echo "$line" >> fragment
          done < CONFIGS/x86_64/config

          sort -u fragment -o fragment
          cat fragment >> .config
          make ARCH=arm64 olddefconfig

      - name: Audit
        working-directory: linux
        run: |
          set -euo pipefail
          make ARCH=arm64 olddefconfig
          grep -q '^CONFIG_ARM64=y$' .config
          grep -q '^CONFIG_64BIT=y$' .config
          grep -q '^CONFIG_ARM64_64K_PAGES=y$' .config && exit 1 || true
          echo "Kernel: $(make kernelversion)"
          echo "Page size: 4K"
          grep '^CONFIG_TCP_CONG_BBR=' .config || true
          grep '^CONFIG_DEFAULT_TCP_CONG=' .config || true
          grep '^CONFIG_NET_SCH_FQ=' .config || true

      - name: Build
        working-directory: linux
        run: |
          set -euo pipefail
          make ARCH=arm64 CROSS_COMPILE="$CROSS_COMPILE" -j"$(nproc)"
          make ARCH=arm64 CROSS_COMPILE="$CROSS_COMPILE" bindeb-pkg -j"$(nproc)" LOCALVERSION=-xanmod-arm64

      - name: Package
        run: |
          set -euo pipefail
          ls linux/*.deb
          sha256sum linux/*.deb > SHA256SUMS.txt
          cp linux/.config config-arm64
          {
            echo "XANMOD_TAG=${{ steps.xanmod.outputs.tag }}"
            echo "XANMOD_COMMIT=$(cd linux && git rev-parse HEAD)"
            echo "KERNEL_VERSION=$(cd linux && make kernelversion)"
            echo "ARCH=arm64"
            echo "PAGE_SIZE=4K"
            echo "BASE_CONFIG=Oracle Linux 10 UEK8 ARM64"
            echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > BUILD-INFO.txt

      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xanmod-arm64-lts-${{ steps.xanmod.outputs.tag }}
          path: |
            linux/*.deb
            SHA256SUMS.txt
            config-arm64
            BUILD-INFO.txt
          if-no-files-found: error

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.xanmod.outputs.tag }}-arm64
          name: XanMod ARM64 LTS ${{ steps.xanmod.outputs.tag }}
          generate_release_notes: true
          files: |
            linux/*.deb
            SHA256SUMS.txt
            config-arm64
            BUILD-INFO.txt
