name: XanMod ARM64 LTS

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: xanmod-arm64-lts
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360

    steps:
      - name: Prepare
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            cpio \
            dpkg-dev \
            dwarves \
            fakeroot \
            flex \
            libdw-dev \
            libelf-dev \
            libssl-dev \
            libzstd-dev \
            lld \
            llvm \
            clang \
            openssl \
            perl \
            pkg-config \
            python3 \
            rsync \
            xz-utils \
            zstd
          sudo apt-get clean
          rm -rf ~/.cache/*
          command -v clang
          command -v ld.lld
          command -v llvm-ar
          command -v llvm-nm
          command -v llvm-objcopy
          command -v llvm-objdump
          command -v llvm-readelf
          command -v llvm-strip
          command -v ccache
          command -v pahole
          command -v bc
          command -v bison
          command -v flex
          command -v fakeroot
          command -v dpkg-deb
          command -v dpkg-gencontrol
          command -v jq
          command -v gh
          clang --version
          pahole --version
          ccache --version
          df -h

      - name: Detect XanMod official LTS release
        id: xanmod
        shell: bash
        run: |
          set -euo pipefail

          api="https://gitlab.com/api/v4/projects/xanmod%2Flinux/releases"
          page=1
          releases=""

          while :; do
            data="$(
              curl \
                --fail \
                --silent \
                --show-error \
                --location \
                --get "$api" \
                --data-urlencode "per_page=100" \
                --data-urlencode "page=$page"
            )"

            count="$(jq 'length' <<<"$data")"

            [ "$count" -gt 0 ] || break

            releases="${releases}${data}"$'\n'

            [ "$count" -lt 100 ] && break

            page=$((page + 1))
          done

          printf '%s\n' "$releases" > xanmod-releases.jsonl

          tag="$(
            jq -s -r '
              [
                .[][]
                | select(
                    any(
                      .assets.links[]?;
                      (.url | contains("/releases/lts/"))
                    )
                  )
                | .tag_name
              ]
              | unique
              | sort
              | last
            ' xanmod-releases.jsonl
          )"

          test -n "$tag"
          test "$tag" != "null"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check GitHub Release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.xanmod.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Clone exact XanMod release
        if: steps.existing.outputs.exists != 'true'
        env:
          TAG: ${{ steps.xanmod.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          git ls-remote \
            --exit-code \
            --tags \
            https://gitlab.com/xanmod/linux.git \
            "refs/tags/$TAG"

          git clone \
            --depth=1 \
            --branch "$TAG" \
            https://gitlab.com/xanmod/linux.git \
            linux

          cd linux

          test -f CONFIGS/x86_64/config
          test -f arch/x86/configs/x86_64_defconfig
          test -f arch/arm64/Kconfig
          test -f scripts/config
          test -f scripts/diffconfig
          test -f scripts/kconfig/merge_config.sh
          test -f Documentation/process/changes.rst
          test -f .gitlab-ci.yml
          test -f Makefile

          git rev-parse HEAD
          git describe --tags --exact-match HEAD

          git show -s --format=%ct HEAD > ../source-epoch
          git show -s --format=%cI HEAD > ../source-date

          cd ..
          rm -rf linux/.git

      - name: Generate ARM64 configuration
        if: steps.existing.outputs.exists != 'true'
        env:
          TAG: ${{ steps.xanmod.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p x86-build arm64-build audit

          make \
            -C linux \
            O="$GITHUB_WORKSPACE/x86-build" \
            ARCH=x86 \
            LLVM=1 \
            x86_64_defconfig

          cp \
            x86-build/.config \
            audit/x86_64-defconfig.config

          cp \
            linux/CONFIGS/x86_64/config \
            audit/xanmod-x86-v3.config

          linux/scripts/diffconfig \
            audit/x86_64-defconfig.config \
            audit/xanmod-x86-v3.config \
            > audit/xanmod-x86-v3-delta.config

          test -s audit/xanmod-x86-v3-delta.config

          make \
            -C linux \
            O="$GITHUB_WORKSPACE/arm64-build" \
            ARCH=arm64 \
            LLVM=1 \
            defconfig

          cp \
            arm64-build/.config \
            audit/arm64-defconfig.config

          KCONFIG_CONFIG="$GITHUB_WORKSPACE/arm64-build/.config" \
            linux/scripts/kconfig/merge_config.sh \
            -m \
            "$GITHUB_WORKSPACE/arm64-build/.config" \
            "$GITHUB_WORKSPACE/audit/xanmod-x86-v3-delta.config"

          KCONFIG_WARN_UNKNOWN_SYMBOLS=1 \
          KCONFIG_WARN_CHANGED_INPUT=1 \
          KCONFIG_CONFIG="$GITHUB_WORKSPACE/arm64-build/.config" \
            make \
            -C linux \
            O="$GITHUB_WORKSPACE/arm64-build" \
            ARCH=arm64 \
            LLVM=1 \
            olddefconfig

          cp \
            arm64-build/.config \
            audit/arm64-final.config

          linux/scripts/diffconfig \
            audit/arm64-defconfig.config \
            audit/arm64-final.config \
            > audit/arm64-final-diff.config

          linux/scripts/diffconfig \
            audit/xanmod-x86-v3-delta.config \
            audit/arm64-final.config \
            > audit/kconfig-resolution.config

          printf '%s\n' \
            "XANMOD_TAG=$TAG" \
            "SOURCE_COMMIT=$(git -C linux rev-parse HEAD 2>/dev/null || true)" \
            "ARCH=arm64" \
            "LLVM=1" \
            > audit/build-info.txt

          cp \
            arm64-build/.config \
            linux/.config

          linux/scripts/config \
            --file linux/.config \
            --set-str LOCALVERSION "-xanmod-arm64"

          make \
            -C linux \
            ARCH=arm64 \
            LLVM=1 \
            olddefconfig

          cp linux/.config audit/final-build.config

          test -s linux/.config

      - name: Configure ccache
        if: steps.existing.outputs.exists != 'true'
        id: ccache
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.cache/ccache"

          ccache --set-config=cache_dir="$HOME/.cache/ccache"
          ccache --set-config=max_size=4G
          ccache --set-config=compression=true

          compiler_hash="$(
            {
              clang --version
              ld.lld --version
              llvm-ar --version
            } | sha256sum | cut -d' ' -f1
          )"

          config_hash="$(
            sha256sum linux/.config |
            cut -d' ' -f1
          )"

          echo "compiler_hash=$compiler_hash" >> "$GITHUB_OUTPUT"
          echo "config_hash=$config_hash" >> "$GITHUB_OUTPUT"

          echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "CCACHE_COMPILERCHECK=content" >> "$GITHUB_ENV"

      - name: Restore ccache
        if: steps.existing.outputs.exists != 'true'
        uses: actions/cache@v5
        with:
          path: ~/.cache/ccache
          key: xanmod-arm64-${{ steps.ccache.outputs.compiler_hash }}-${{ steps.ccache.outputs.config_hash }}
          restore-keys: |
            xanmod-arm64-${{ steps.ccache.outputs.compiler_hash }}-

      - name: Build kernel
        if: steps.existing.outputs.exists != 'true'
        env:
          KBUILD_BUILD_TIMESTAMP: ${{ steps.xanmod.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          export KBUILD_BUILD_TIMESTAMP="$(cat source-date)"
          export SOURCE_DATE_EPOCH="$(cat source-epoch)"
          export CC="ccache clang"

          make \
            -C linux \
            O="$GITHUB_WORKSPACE/arm64-build" \
            ARCH=arm64 \
            LLVM=1 \
            KBUILD_BUILD_TIMESTAMP="$KBUILD_BUILD_TIMESTAMP" \
            LOCALVERSION=-xanmod-arm64 \
            -j"$(nproc)" \
            bindeb-pkg

          ccache --show-stats

      - name: Validate build
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail

          test -s arm64-build/arch/arm64/boot/Image

          find "$GITHUB_WORKSPACE" \
            -maxdepth 1 \
            -type f \
            -name '*.deb' \
            -print \
            | grep -q .

          for package in "$GITHUB_WORKSPACE"/*.deb; do
            dpkg-deb --info "$package" >/dev/null
            dpkg-deb --contents "$package" >/dev/null
            dpkg-deb --field "$package" Architecture
          done

          test -s audit/final-build.config
          test -s audit/kconfig-resolution.config

          tar \
            -C audit \
            -cJf \
            xanmod-arm64-config-audit.tar.xz \
            .

      - name: Upload workflow artifacts
        if: steps.existing.outputs.exists != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: xanmod-arm64-${{ steps.xanmod.outputs.tag }}
          path: |
            *.deb
            xanmod-arm64-config-audit.tar.xz
          if-no-files-found: error
          compression-level: 0

      - name: Publish GitHub Release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.xanmod.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create \
            "$TAG" \
            *.deb \
            xanmod-arm64-config-audit.tar.xz \
            --title "XanMod ARM64 $TAG" \
            --notes "XanMod official LTS ARM64 build
          Release: $TAG
          Architecture: arm64
          Toolchain: LLVM
          Configuration: ARM64 Kconfig + olddefconfig"
