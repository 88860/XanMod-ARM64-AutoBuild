name: XanMod ARM64 Build

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

concurrency:
  group: xanmod-arm64-lts
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Get latest release
        id: xanmod
        shell: bash
        env:
          GITLAB_API: https://gitlab.com/api/v4/projects/xanmod%2Flinux
        run: |
          set -euo pipefail
          tag=""
          for page in $(seq 1 50); do
            releases="$(curl -fsSL --retry 5 --retry-all-errors "$GITLAB_API/releases?order_by=released_at&sort=desc&per_page=100&page=$page")"
            tag="$(jq -r '.[] | select(.upcoming_release == false) | select(any(.assets.links[]?; (.url // "") | contains("/releases/lts/"))) | .tag_name' <<<"$releases" | head -n1)"
            [[ -n "$tag" ]] && break
            [[ "$(jq 'length' <<<"$releases")" -lt 100 ]] && break
          done
          [[ -n "$tag" ]] || exit 1
          release="$(curl -fsSL --retry 5 --retry-all-errors "$GITLAB_API/releases/$tag")"
          {
            echo "tag=$tag"
            echo "commit=$(jq -r '.commit.id' <<<"$release")"
            echo "released_at=$(jq -r '.released_at' <<<"$release")"
          } >> "$GITHUB_OUTPUT"

      - name: Check status
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.xanmod.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then echo "skip=true" >> "$GITHUB_OUTPUT"; else echo "skip=false" >> "$GITHUB_OUTPUT"; fi

      - name: Install dependencies
        if: steps.published.outputs.skip != 'true'
        run: |
          set -euo pipefail
          sudo dpkg --add-architecture arm64
          sudo sed -i 's/^Types: deb/Types: deb\nArchitectures: amd64 i386/' /etc/apt/sources.list.d/ubuntu.sources
          cat <<EOF | sudo tee /etc/apt/sources.list.d/ubuntu-ports.sources
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: noble noble-updates noble-security
          Components: main restricted universe multiverse
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache clang cpio debhelper dpkg-dev \
            dwarves fakeroot flex kmod libdw-dev libelf-dev libssl-dev lld \
            llvm lz4 openssl pkg-config python3 rsync xz-utils zstd \
            crossbuild-essential-arm64 \
            libssl-dev:arm64 libelf-dev:arm64 zlib1g-dev:arm64

      - name: Cache ccache
        if: steps.published.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-cross-arm64-xanmod-${{ steps.xanmod.outputs.tag }}-clang-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cross-arm64-xanmod-

      - name: Checkout kernel source
        if: steps.published.outputs.skip != 'true'
        env:
          TAG: ${{ steps.xanmod.outputs.tag }}
          EXPECTED_COMMIT: ${{ steps.xanmod.outputs.commit }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$TAG" https://gitlab.com/xanmod/linux.git kernel
          cd kernel
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"

      - name: Configure Kconfig
        if: steps.published.outputs.skip != 'true'
        id: config
        run: |
          set -euo pipefail
          cd kernel
          export ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1
          
          ./scripts/kconfig/merge_config.sh -O . arch/arm64/configs/defconfig CONFIGS/x86_64/config
          
          ./scripts/config --disable SOUND \
                           --disable WLAN \
                           --disable WIRELESS \
                           --disable BT \
                           --disable MEDIA_SUPPORT
                           
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 olddefconfig
          
          if [[ -n "$(grep '^CONFIG_' .config | cut -d= -f1 | sort | uniq -d || true)" ]]; then exit 1; fi
          test -s .config
          grep -q '^CONFIG_MODULES=y$' .config
          echo "config_hash=$(sha256sum .config | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Build packages
        if: steps.published.outputs.skip != 'true'
        env:
          KBUILD_BUILD_USER: github-actions
          KBUILD_BUILD_HOST: github-arm64-cross
          DEBFULLNAME: github-actions
          DEBEMAIL: github-actions@users.noreply.github.com
          KDEB_CHANGELOG_DIST: noble
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          set -euo pipefail
          cd kernel
          export ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CCACHE_DIR="$CCACHE_DIR"
          ccache --zero-stats
          make ARCH=arm64 LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- \
            CC="ccache clang --target=aarch64-linux-gnu" HOSTCC="ccache clang" \
            -j"$(( $(nproc) + 1 ))" bindeb-pkg
          ccache --show-stats

      - name: Verify packages
        if: steps.published.outputs.skip != 'true'
        env:
          TAG: ${{ steps.xanmod.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          shopt -s nullglob
          packages=(*.deb)
          ((${#packages[@]} > 0)) || exit 1
          
          for deb in "${packages[@]}"; do
            [[ "$(dpkg-deb --field "$deb" Architecture)" == "arm64" ]] || exit 1
            case "$(dpkg-deb --field "$deb" Package)" in
              linux-image-*) image_pkg="$deb" ;;
              linux-headers-*) headers_pkg="$deb" ;;
              linux-libc-dev) libc_pkg="$deb" ;;
            esac
          done
          
          dpkg-deb --contents "$image_pkg" | grep '/boot/vmlinuz-' >/dev/null
          dpkg-deb --contents "$image_pkg" | grep '/lib/modules/' >/dev/null
          dpkg-deb --contents "$headers_pkg" | grep '/usr/src/linux-headers-' >/dev/null
          
          cp "${packages[@]}" dist/
          sha256sum dist/*.deb > dist/SHA256SUMS
          {
            echo "XanMod LTS: $TAG"
            echo "Source: https://gitlab.com/xanmod/linux"
            echo "GitLab release: https://gitlab.com/xanmod/linux/-/releases/$TAG"
            echo ""
            cat dist/SHA256SUMS
          } > dist/RELEASE.md

      - name: Publish release
        if: steps.published.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.xanmod.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" dist/*.deb dist/SHA256SUMS --target "$GITHUB_SHA" --title "XanMod $TAG ARM64" --notes-file dist/RELEASE.md
