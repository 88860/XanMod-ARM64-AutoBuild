name: Build XanMod ARM64 LTS

on:
  workflow_dispatch:

  schedule:
    - cron: "30 3 * * 0"

permissions:
  contents: write

env:
  XANMOD_REPO: https://gitlab.com/xanmod/linux.git
  KERNEL_RELEASES: https://www.kernel.org/releases.json
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # Build dependencies
      # ============================================================

      - name: Install dependencies
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libdw-dev \
            libncurses-dev \
            debhelper \
            debhelper-compat \
            fakeroot \
            dpkg-dev \
            ccache \
            git \
            curl \
            rsync \
            xz-utils \
            kmod \
            python3 \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu

          echo
          echo "=== Build tool versions ==="

          gcc --version | head -n1
          aarch64-linux-gnu-gcc --version | head -n1
          dpkg-buildpackage --version | head -n1
          dpkg-checkbuilddeps --version | head -n1
          make --version | head -n1


      # ============================================================
      # ccache
      # ============================================================

      - name: Setup ccache
        run: |
          set -euo pipefail

          echo "PATH=/usr/lib/ccache:$PATH" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

          ccache --version


      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-xanmod-arm64-${{ github.ref_name }}-${{ hashFiles('.github/workflows/**') }}
          restore-keys: |
            ${{ runner.os }}-xanmod-arm64-${{ github.ref_name }}-
            ${{ runner.os }}-xanmod-arm64-


      # ============================================================
      # Detect latest upstream LTS series
      # ============================================================

      - name: Detect latest LTS
        id: lts
        run: |
          set -euo pipefail

          SERIES="$(
            curl -fsSL \
              --retry 5 \
              --retry-all-errors \
              --retry-delay 2 \
              "$KERNEL_RELEASES" |
            python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)

          versions = []

          for item in data.get("releases", []):
              if item.get("moniker") != "longterm":
                  continue

              version = item.get("version", "")

              try:
                  key = tuple(int(x) for x in version.split("."))
              except ValueError:
                  continue

              versions.append((key, version))

          if not versions:
              raise SystemExit("No upstream LTS kernel found")

          versions.sort(reverse=True)

          # Example:
          # 6.18.45 -> 6.18
          print(versions[0][1].rsplit(".", 1)[0])
          '
          )"

          test -n "$SERIES"

          echo "series=$SERIES" >> "$GITHUB_OUTPUT"

          echo
          echo "Detected upstream LTS series:"
          echo "$SERIES"


      # ============================================================
      # Detect XanMod tag
      # ============================================================

      - name: Detect latest XanMod LTS tag
        id: xanmod
        run: |
          set -euo pipefail

          SERIES="${{ steps.lts.outputs.series }}"

          PREFIX="${SERIES//./\\.}"

          echo "Searching XanMod tags for series: $SERIES"

          TAG="$(
            git ls-remote --tags --refs "$XANMOD_REPO" |
            sed 's#.*refs/tags/##' |
            grep -E "^${PREFIX}\.[0-9]+-xanmod[0-9]+$" |
            sort -V |
            tail -n1 || true
          )"

          if [ -z "$TAG" ]; then
            echo
            echo "ERROR: No XanMod stable LTS tag found for $SERIES"
            echo
            echo "Available matching tags:"
            git ls-remote --tags --refs "$XANMOD_REPO" |
              sed 's#.*refs/tags/##' |
              grep -E "^${PREFIX}\." |
              sort -V |
              tail -n20 || true

            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          echo
          echo "Selected XanMod tag:"
          echo "$TAG"


      # ============================================================
      # Clone XanMod
      # ============================================================

      - name: Clone XanMod
        run: |
          set -euo pipefail

          TAG="${{ steps.xanmod.outputs.tag }}"

          git clone \
            --depth=1 \
            --branch "$TAG" \
            "$XANMOD_REPO" \
            linux

          test -d linux/CONFIGS

          echo
          echo "=== XanMod CONFIGS tree ==="

          find linux/CONFIGS \
            -maxdepth 3 \
            -type f \
            -print \
            | sort


      # ============================================================
      # Locate actual x86_64 configuration
      #
      # IMPORTANT:
      #
      # CONFIGS/x86_64 is a directory in XanMod.
      # Never assume it is itself a config file.
      # ============================================================

      - name: Locate XanMod x86_64 configuration
        id: config
        working-directory: linux
        run: |
          set -euo pipefail

          ROOT="CONFIGS/x86_64"

          if [ ! -d "$ROOT" ]; then
            echo "ERROR: XanMod x86_64 configuration directory not found:"
            echo "$ROOT"
            echo
            echo "Available CONFIGS:"
            find CONFIGS \
              -maxdepth 3 \
              -print \
              | sort

            exit 1
          fi

          echo "Searching real files under:"
          echo "$ROOT"

          mapfile -t FILES < <(
            find "$ROOT" \
              -type f \
              \( \
                -name 'config' \
                -o \
                -name '*.config' \
                -o \
                -name 'CONFIG' \
                -o \
                -name '*.conf' \
              \) \
              -print \
              | sort
          )

          if [ "${#FILES[@]}" -eq 0 ]; then
            echo
            echo "No obvious configuration file found."
            echo
            echo "All files under CONFIGS/x86_64:"
            find "$ROOT" \
              -type f \
              -print \
              | sort

            exit 1
          fi

          echo
          echo "Configuration candidates:"
          printf '%s\n' "${FILES[@]}"

          # Prefer the conventional "config" file.
          CFG=""

          for candidate in "${FILES[@]}"; do
            if [ "$(basename "$candidate")" = "config" ]; then
              CFG="$candidate"
              break
            fi
          done

          # Otherwise select the first valid candidate.
          if [ -z "$CFG" ]; then
            CFG="${FILES[0]}"
          fi

          test -f "$CFG"
          test -s "$CFG"

          echo
          echo "Selected XanMod configuration:"
          echo "$CFG"

          echo "config=$CFG" >> "$GITHUB_OUTPUT"


      # ============================================================
      # Prepare ARM64 base configuration
      # ============================================================

      - name: Prepare ARM64 base configuration
        working-directory: linux
        run: |
          set -euo pipefail

          make \
            ARCH="$ARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            defconfig

          cp .config ../arm64-base.config

          echo
          echo "ARM64 defconfig generated successfully."


      # ============================================================
      # Generate complete ARM64 Kconfig symbol universe
      #
      # This is NOT the final configuration.
      #
      # It is only used to determine whether a XanMod symbol exists
      # and is meaningful in ARM64 Kconfig.
      # ============================================================

      - name: Generate ARM64 Kconfig symbol universe
        working-directory: linux
        run: |
          set -euo pipefail

          cp ../arm64-base.config .config

          make \
            ARCH="$ARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            allmodconfig >/dev/null

          cp .config ../arm64-symbols.config

          echo
          echo "ARM64 Kconfig symbol universe generated."


      # ============================================================
      # Extract ARM64-compatible XanMod settings
      #
      # IMPORTANT:
      #
      # We DO NOT reject a symbol merely because its name contains
      # X86 / Intel / AMD / etc.
      #
      # Actual ARM64 Kconfig presence is what determines whether
      # the symbol can be considered.
      #
      # Explicit architecture-only blockers are still rejected
      # to prevent accidental activation of x86 architecture roots.
      # ============================================================

      - name: Extract ARM64-compatible XanMod settings
        working-directory: linux
        run: |
          set -euo pipefail

          XANMOD_CONFIG="${{ steps.config.outputs.config }}"

          test -f "$XANMOD_CONFIG"
          test -s "$XANMOD_CONFIG"

          python3 <<PY
          import re
          from pathlib import Path

          XANMOD = Path("$XANMOD_CONFIG")
          ARM = Path("../arm64-symbols.config")
          OUT = Path("../xanmod-arm64-candidates.fragment")

          SET = re.compile(r"^(CONFIG_[A-Za-z0-9_]+)=(.*)$")
          UNSET = re.compile(r"^# (CONFIG_[A-Za-z0-9_]+) is not set$")

          def parse(path):
              result = {}

              for line in path.read_text(
                  encoding="utf-8",
                  errors="replace"
              ).splitlines():

                  m = SET.match(line)

                  if m:
                      result[m.group(1)] = m.group(2)
                      continue

                  m = UNSET.match(line)

                  if m:
                      result[m.group(1)] = "n"

              return result

          xanmod = parse(XANMOD)
          arm = parse(ARM)

          # These are architecture root / hard x86-only symbols.
          #
          # Do NOT use a generic "contains X86" rule.
          #
          # Some symbols whose names contain architecture/vendor terms
          # can still be generic or shared by ARM64.
          blocked = {
              "CONFIG_X86",
              "CONFIG_X86_64",
              "CONFIG_X86_32",
              "CONFIG_IA32",
              "CONFIG_X86_5LEVEL",
              "CONFIG_X86_INTEL_MEMORY_PROTECTION_KEYS",
              "CONFIG_X86_SGX",
              "CONFIG_X86_USER_SHADOW_STACK",
          }

          candidates = {}

          for sym, value in xanmod.items():

              # Explicit architecture-root blocker.
              if sym in blocked:
                  continue

              # The symbol must actually exist in ARM64 Kconfig.
              if sym not in arm:
                  continue

              candidates[sym] = value

          with OUT.open(
              "w",
              encoding="utf-8"
          ) as f:

              for sym in sorted(candidates):

                  value = candidates[sym]

                  if value == "n":
                      f.write(
                          f"# {sym} is not set\n"
                      )
                  else:
                      f.write(
                          f"{sym}={value}\n"
                      )

          print(f"XanMod symbols: {len(xanmod)}")
          print(f"ARM64 symbols: {len(arm)}")
          print(f"ARM64-compatible candidates: {len(candidates)}")

          if not candidates:
              raise SystemExit(
                  "No ARM64-compatible XanMod configuration candidates"
              )
          PY

          test -s ../xanmod-arm64-candidates.fragment


      # ============================================================
      # Validate every candidate through ARM64 Kconfig
      #
      # A candidate is accepted only if Kconfig preserves exactly
      # the requested value after olddefconfig.
      # ============================================================

      - name: Verify XanMod settings through ARM64 Kconfig
        working-directory: linux
        run: |
          set -euo pipefail

          cp ../arm64-base.config .config

          ./scripts/kconfig/merge_config.sh \
            -m \
            .config \
            ../xanmod-arm64-candidates.fragment

          make \
            ARCH="$ARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            olddefconfig

          cp .config ../xanmod-arm64-tested.config

          python3 <<'PY'
          import re
          from pathlib import Path

          CANDIDATES = Path("../xanmod-arm64-candidates.fragment")
          TESTED = Path("../xanmod-arm64-tested.config")
          OUT = Path("../xanmod-arm64.fragment")

          SET = re.compile(r"^(CONFIG_[A-Za-z0-9_]+)=(.*)$")
          UNSET = re.compile(r"^# (CONFIG_[A-Za-z0-9_]+) is not set$")

          def parse(path):
              result = {}

              for line in path.read_text(
                  encoding="utf-8",
                  errors="replace"
              ).splitlines():

                  m = SET.match(line)

                  if m:
                      result[m.group(1)] = m.group(2)
                      continue

                  m = UNSET.match(line)

                  if m:
                      result[m.group(1)] = "n"

              return result

          candidates = parse(CANDIDATES)
          tested = parse(TESTED)

          verified = {}
          rejected = {}

          for sym, value in candidates.items():

              if sym not in tested:
                  rejected[sym] = "missing after Kconfig"
                  continue

              if tested[sym] != value:
                  rejected[sym] = (
                      f"requested={value}, "
                      f"Kconfig_result={tested[sym]}"
                  )
                  continue

              verified[sym] = value

          with OUT.open(
              "w",
              encoding="utf-8"
          ) as f:

              for sym in sorted(verified):

                  value = verified[sym]

                  if value == "n":
                      f.write(
                          f"# {sym} is not set\n"
                      )
                  else:
                      f.write(
                          f"{sym}={value}\n"
                      )

          print(f"Candidates: {len(candidates)}")
          print(f"Verified: {len(verified)}")
          print(f"Rejected: {len(rejected)}")

          if rejected:
              print()
              print("Rejected settings:")

              for sym in sorted(rejected):
                  print(
                      f"{sym}: {rejected[sym]}"
                  )

          if not verified:
              raise SystemExit(
                  "No XanMod settings survived ARM64 Kconfig validation"
              )
          PY

          test -s ../xanmod-arm64.fragment


      # ============================================================
      # Generate final ARM64 configuration
      # ============================================================

      - name: Generate final ARM64 configuration
        working-directory: linux
        run: |
          set -euo pipefail

          cp ../arm64-base.config .config

          ./scripts/kconfig/merge_config.sh \
            -m \
            .config \
            ../xanmod-arm64.fragment

          make \
            ARCH="$ARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            olddefconfig

          mkdir -p ../configs

          cp \
            .config \
            ../configs/xanmod-arm64.config

          test -s ../configs/xanmod-arm64.config


      # ============================================================
      # Final configuration validation
      # ============================================================

      - name: Validate final ARM64 configuration
        run: |
          set -euo pipefail

          CFG="configs/xanmod-arm64.config"

          test -s "$CFG"

          echo "Checking ARM64 architecture..."

          grep -q '^CONFIG_ARM64=y$' "$CFG"
          grep -q '^CONFIG_64BIT=y$' "$CFG"

          echo "Checking forbidden x86 architecture roots..."

          if grep -q '^CONFIG_X86=y$' "$CFG"; then
            echo "ERROR: CONFIG_X86 enabled"
            exit 1
          fi

          if grep -q '^CONFIG_X86_64=y$' "$CFG"; then
            echo "ERROR: CONFIG_X86_64 enabled"
            exit 1
          fi

          if grep -q '^CONFIG_X86_32=y$' "$CFG"; then
            echo "ERROR: CONFIG_X86_32 enabled"
            exit 1
          fi

          if grep -q '^CONFIG_IA32=y$' "$CFG"; then
            echo "ERROR: CONFIG_IA32 enabled"
            exit 1
          fi

          echo
          echo "Final ARM64 configuration validated successfully."


      # ============================================================
      # Verify cross compiler
      # ============================================================

      - name: Verify cross compiler
        run: |
          set -euo pipefail

          command -v aarch64-linux-gnu-gcc
          command -v aarch64-linux-gnu-ld
          command -v aarch64-linux-gnu-as

          aarch64-linux-gnu-gcc --version | head -n1
          aarch64-linux-gnu-ld --version | head -n1


      # ============================================================
      # Build kernel
      # ============================================================

      - name: Build kernel
        working-directory: linux
        run: |
          set -euo pipefail

          export ARCH="$ARCH"
          export CROSS_COMPILE="$CROSS_COMPILE"

          # ccache is used only for the cross compiler.
          export CC="ccache ${CROSS_COMPILE}gcc"

          echo "CC=$CC"
          echo "ARCH=$ARCH"
          echo "CROSS_COMPILE=$CROSS_COMPILE"

          ccache -z

          make \
            ARCH="$ARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            -j"$(nproc)"

          echo
          echo "Kernel compilation completed."

          ccache -s


      # ============================================================
      # Verify Debian packaging dependencies
      #
      # This catches the exact class of failure encountered previously
      # before bindeb-pkg starts.
      # ============================================================

      - name: Verify Debian packaging dependencies
        working-directory: linux
        run: |
          set -euo pipefail

          echo "Checking Debian packaging dependencies..."

          if ! dpkg-checkbuilddeps; then
            echo
            echo "ERROR: Debian packaging dependencies are not satisfied."
            echo
            echo "Installed relevant packages:"
            dpkg-query \
              -W \
              -f='${Package}\t${Version}\n' \
              debhelper \
              debhelper-compat \
              libdw-dev \
              libssl-dev \
              libelf-dev \
              dpkg-dev \
              fakeroot \
              2>/dev/null || true

            echo
            echo "Debian control file:"
            sed -n '/^Build-Depends:/,/^[^ ]/p' debian/control || true

            exit 1
          fi

          echo
          echo "Debian packaging dependencies satisfied."


      # ============================================================
      # Build Debian packages
      # ============================================================

      - name: Build Debian packages
        working-directory: linux
        run: |
          set -euo pipefail

          make \
            ARCH="$ARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            bindeb-pkg \
            -j"$(nproc)"

          echo
          echo "Debian package build completed."

          ccache -s


      # ============================================================
      # Collect release files
      # ============================================================

      - name: Collect release files
        run: |
          set -euo pipefail

          rm -rf release
          mkdir -p release

          echo "Searching generated Debian packages..."

          find . \
            -maxdepth 2 \
            -type f \
            -name '*.deb' \
            -print

          mapfile -t DEBS < <(
            find . \
              -maxdepth 2 \
              -type f \
              -name '*.deb' \
              -print \
              | sort
          )

          if [ "${#DEBS[@]}" -eq 0 ]; then
            echo "ERROR: No Debian packages generated."
            exit 1
          fi

          for deb in "${DEBS[@]}"; do
            cp "$deb" release/
          done

          cp \
            configs/xanmod-arm64.config \
            release/

          test -s release/xanmod-arm64.config

          sha256sum \
            release/*.deb \
            > release/SHA256SUMS.txt

          echo
          echo "=== Release files ==="

          ls -lh release

          echo
          echo "=== SHA256 ==="

          cat release/SHA256SUMS.txt


      # ============================================================
      # Upload GitHub Actions artifacts
      # ============================================================

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xanmod-arm64-${{ steps.xanmod.outputs.tag }}
          path: release/*
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # Publish GitHub Release
      # ============================================================

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="${{ steps.xanmod.outputs.tag }}-arm64"

          echo "Publishing release:"
          echo "$TAG"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Existing release found. Removing old release..."

            gh release delete \
              "$TAG" \
              --yes \
              --cleanup-tag
          fi

          gh release create \
            "$TAG" \
            release/* \
            --title "XanMod ARM64 ${{ steps.xanmod.outputs.tag }}" \
            --generate-notes

          echo
          echo "GitHub Release published successfully."


      # ============================================================
      # Commit final configuration
      # ============================================================

      - name: Commit configuration
        run: |
          set -euo pipefail

          git config \
            user.name \
            "github-actions[bot]"

          git config \
            user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            configs/xanmod-arm64.config

          if git diff --cached --quiet; then
            echo "No configuration changes."
            exit 0
          fi

          git commit \
            -m "Update XanMod ARM64 config ${{ steps.xanmod.outputs.tag }}"

          git push
