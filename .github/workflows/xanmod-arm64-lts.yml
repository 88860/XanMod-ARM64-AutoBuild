name: XanMod ARM64 lts Build

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

concurrency:
  group: xanmod-arm64-lts
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Release
        id: xanmod
        shell: bash
        env:
          GITLAB_API: https://gitlab.com/api/v4/projects/xanmod%2Flinux
        run: |
          set -euo pipefail

          tag=""

          for page in $(seq 1 50); do
            releases="$(
              curl -fsSL \
                --retry 5 \
                --retry-all-errors \
                "$GITLAB_API/releases?order_by=released_at&sort=desc&per_page=100&page=$page"
            )"

            tag="$(
              jq -r '
                .[]
                | select(.upcoming_release == false)
                | select(
                    any(
                      .assets.links[]?;
                      (.url // "") | contains("/releases/lts/")
                    )
                  )
                | .tag_name
              ' <<<"$releases" | head -n1
            )"

            [[ -n "$tag" ]] && break

            [[ "$(jq 'length' <<<"$releases")" -lt 100 ]] && break
          done

          [[ -n "$tag" ]] || exit 1

          release="$(
            curl -fsSL \
              --retry 5 \
              --retry-all-errors \
              "$GITLAB_API/releases/$tag"
          )"

          {
            echo "tag=$tag"
            echo "commit=$(jq -r '.commit.id' <<<"$release")"
            echo "released_at=$(jq -r '.released_at' <<<"$release")"
          } >> "$GITHUB_OUTPUT"

      - name: Status
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.xanmod.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Dependencies
        if: steps.published.outputs.skip != 'true'
        run: |
          set -euo pipefail

          sudo dpkg --add-architecture arm64

          sudo sed -i \
            's/^Types: deb/Types: deb\nArchitectures: amd64 i386/' \
            /etc/apt/sources.list.d/ubuntu.sources

          cat <<EOF | sudo tee /etc/apt/sources.list.d/ubuntu-ports.sources
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: noble noble-updates noble-security
          Components: main restricted universe multiverse
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache clang cpio debhelper dpkg-dev \
            dwarves fakeroot flex kmod libdw-dev libelf-dev libssl-dev lld \
            llvm lz4 openssl pkg-config python3 rsync xz-utils zstd \
            crossbuild-essential-arm64 \
            libssl-dev:arm64 libelf-dev:arm64 zlib1g-dev:arm64

      - name: Cache
        if: steps.published.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-cross-arm64-xanmod-${{ steps.xanmod.outputs.tag }}-clang-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cross-arm64-xanmod-

      - name: Source
        if: steps.published.outputs.skip != 'true'
        env:
          TAG: ${{ steps.xanmod.outputs.tag }}
          EXPECTED_COMMIT: ${{ steps.xanmod.outputs.commit }}
        run: |
          set -euo pipefail

          git clone \
            --depth 1 \
            --branch "$TAG" \
            https://gitlab.com/xanmod/linux.git \
            kernel

          cd kernel

          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"

      - name: Configure
        if: steps.published.outputs.skip != 'true'
        id: config
        env:
          TAG: ${{ steps.xanmod.outputs.tag }}
        run: |
          set -euo pipefail

          cd kernel

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LLVM=1

          xanmod_config="CONFIGS/x86_64/config"
          candidate_config=".xanmod-arm64-candidates"
          before_config=".config.before-vps"
          final_config=".config"

          test -f "$xanmod_config"

          rm -f \
            "$candidate_config" \
            "$before_config"

          make \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 \
            defconfig

          awk '
            /^[[:space:]]*CONFIG_[A-Za-z0-9_]+=(y|m|-?[0-9]+|0x[0-9A-Fa-f]+|".*")$/ {
              print
            }
          ' "$xanmod_config" > "$candidate_config"

          test -s "$candidate_config"

          ./scripts/kconfig/merge_config.sh \
            -m \
            .config \
            "$candidate_config"

          make \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 \
            olddefconfig

          cp .config "$before_config"

          ./scripts/config \
            --disable SOUND \
            --disable WLAN \
            --disable WIRELESS \
            --disable BT \
            --disable MEDIA_SUPPORT \
            --disable FIREWIRE \
            --disable NFC \
            --disable IRDA \
            --disable GAMEPORT \
            --disable JOYSTICK \
            --disable TV

          ./scripts/config \
            --disable CONFIG_SND \
            --disable CONFIG_SND_HWDEP \
            --disable CONFIG_SND_RAWMIDI \
            --disable CONFIG_SND_USB \
            --disable CONFIG_SND_FIREWIRE \
            --disable CONFIG_DVB_CORE \
            --disable CONFIG_RC_CORE

          ./scripts/config \
            --disable LOCALVERSION_AUTO \
            --set-str LOCALVERSION ""

          printf '%s\n' '-xanmod1-arm64-lts' > localversion

          make \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 \
            olddefconfig

          test -s "$final_config"

          make \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 \
            -s prepare

          release="$(
            make \
              ARCH=arm64 \
              CROSS_COMPILE=aarch64-linux-gnu- \
              LLVM=1 \
              -s kernelrelease
          )"

          expected="${TAG}-arm64-lts"

          test "$release" = "$expected"

          cp .config .config.final

          echo "config_hash=$(sha256sum .config.final | cut -d' ' -f1)" \
            >> "$GITHUB_OUTPUT"

          echo "kernel_release=$release" \
            >> "$GITHUB_OUTPUT"

          echo "candidate_count=$(
            grep -c '^CONFIG_' "$candidate_config" || true
          )" >> "$GITHUB_OUTPUT"

          echo "final_count=$(
            grep -c '^CONFIG_' .config.final || true
          )" >> "$GITHUB_OUTPUT"

      - name: Audit
        if: steps.published.outputs.skip != 'true'
        env:
          TAG: ${{ steps.xanmod.outputs.tag }}
          EXPECTED_RELEASE: ${{ steps.xanmod.outputs.tag }}-arm64-lts
        run: |
          set -euo pipefail

          cd kernel

          config=".config.final"
          candidate=".xanmod-arm64-candidates"

          test -s "$config"
          test -s "$candidate"

          make \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 \
            olddefconfig

          cmp -s .config "$config"

          test "$(grep -c '^CONFIG_ARM64=y$' "$config")" -eq 1
          test "$(grep -c '^CONFIG_64BIT=y$' "$config")" -eq 1
          test "$(grep -c '^CONFIG_MODULES=y$' "$config")" -eq 1

          test "$(grep -c '^CONFIG_X86=y$' "$config" || true)" -eq 0
          test "$(grep -c '^CONFIG_X86_64=y$' "$config" || true)" -eq 0

          if grep -Eq '^CONFIG_X86(=|_)|^CONFIG_X86_64(=|_)' "$config"; then
            echo "ARM64 audit failed: x86 configuration detected"
            grep -E '^CONFIG_X86(=|_)|^CONFIG_X86_64(=|_)' "$config"
            exit 1
          fi

          if grep -q '^CONFIG_LOCALVERSION_AUTO=y$' "$config"; then
            echo "ARM64 audit failed: LOCALVERSION_AUTO is enabled"
            exit 1
          fi

          localversion="$(
            sed -n 's/^CONFIG_LOCALVERSION="\(.*\)"$/\1/p' "$config" || true
          )"

          test -z "$localversion"

          test -f localversion
          test "$(cat localversion)" = "-xanmod1-arm64-lts"

          release="$(
            make \
              ARCH=arm64 \
              CROSS_COMPILE=aarch64-linux-gnu- \
              LLVM=1 \
              -s kernelrelease
          )"

          test "$release" = "$EXPECTED_RELEASE"

          if grep -Eq 'x64v[0-9]|x86-64|x86_64' <<<"$release"; then
            echo "ARM64 audit failed: invalid architecture suffix"
            echo "$release"
            exit 1
          fi

          duplicates="$(
            grep '^CONFIG_' "$config" |
              sed 's/=.*//' |
              sort |
              uniq -d
          )"

          if [[ -n "$duplicates" ]]; then
            echo "ARM64 audit failed: duplicate configuration symbols"
            echo "$duplicates"
            exit 1
          fi

          malformed="$(
            grep -vE \
              '^(CONFIG_[A-Za-z0-9_]+=(y|m|n|-?[0-9]+|0x[0-9A-Fa-f]+|"[^"]*")|# CONFIG_[A-Za-z0-9_]+ is not set)$' \
              "$config" || true
          )"

          if [[ -n "$malformed" ]]; then
            echo "ARM64 audit failed: malformed configuration"
            echo "$malformed"
            exit 1
          fi

          if grep -qE '^CONFIG_(SOUND|WLAN|WIRELESS|BT|MEDIA_SUPPORT|FIREWIRE|NFC|IRDA|GAMEPORT|JOYSTICK|TV)=' "$config"; then
            echo "ARM64 audit failed: VPS-disabled subsystem is enabled"
            grep -E '^CONFIG_(SOUND|WLAN|WIRELESS|BT|MEDIA_SUPPORT|FIREWIRE|NFC|IRDA|GAMEPORT|JOYSTICK|TV)=' "$config"
            exit 1
          fi

          if grep -qE '^CONFIG_(SND|DVB_CORE|RC_CORE)=' "$config"; then
            echo "ARM64 audit failed: VPS-disabled media subsystem is enabled"
            grep -E '^CONFIG_(SND|DVB_CORE|RC_CORE)=' "$config"
            exit 1
          fi

          if ! grep -q '^CONFIG_VIRTIO=y$' "$config" &&
             ! grep -q '^CONFIG_VIRTIO=m$' "$config"; then
            echo "ARM64 audit failed: VirtIO support is missing"
            exit 1
          fi

          if ! grep -q '^CONFIG_VIRTIO_NET=y$' "$config" &&
             ! grep -q '^CONFIG_VIRTIO_NET=m$' "$config"; then
            echo "ARM64 audit failed: VirtIO network support is missing"
            exit 1
          fi

          if ! grep -q '^CONFIG_NET=y$' "$config"; then
            echo "ARM64 audit failed: network stack is disabled"
            exit 1
          fi

          if ! grep -q '^CONFIG_INET=y$' "$config"; then
            echo "ARM64 audit failed: IPv4 support is disabled"
            exit 1
          fi

          if ! grep -q '^CONFIG_PROC_FS=y$' "$config"; then
            echo "ARM64 audit failed: procfs is disabled"
            exit 1
          fi

          if ! grep -q '^CONFIG_SYSFS=y$' "$config"; then
            echo "ARM64 audit failed: sysfs is disabled"
            exit 1
          fi

          if ! grep -q '^CONFIG_CGROUPS=y$' "$config"; then
            echo "ARM64 audit failed: cgroups are disabled"
            exit 1
          fi

          if ! grep -q '^CONFIG_NAMESPACES=y$' "$config"; then
            echo "ARM64 audit failed: namespaces are disabled"
            exit 1
          fi

          if ! grep -q '^CONFIG_BPF=y$' "$config"; then
            echo "ARM64 audit failed: BPF is disabled"
            exit 1
          fi

          if ! grep -q '^CONFIG_BPF_SYSCALL=y$' "$config"; then
            echo "ARM64 audit failed: BPF syscall is disabled"
            exit 1
          fi

          if grep -q '^CONFIG_LOCALVERSION=' "$config"; then
            value="$(
              sed -n 's/^CONFIG_LOCALVERSION="\(.*\)"$/\1/p' "$config"
            )"

            test -z "$value"
          fi

          if grep -qE '^CONFIG_(MCORE2|MZEN|X86_NATIVE_CPU|X86_64_VERSION)=' "$config"; then
            echo "ARM64 audit failed: invalid CPU-specific configuration"
            grep -E '^CONFIG_(MCORE2|MZEN|X86_NATIVE_CPU|X86_64_VERSION)=' "$config"
            exit 1
          fi

          echo "Release: $release"
          echo "Candidates: $(grep -c '^CONFIG_' "$candidate" || true)"
          echo "Final: $(grep -c '^CONFIG_' "$config" || true)"
          echo "Config: $(sha256sum "$config" | cut -d' ' -f1)"
          echo "Audit: PASS"

      - name: Build
        if: steps.published.outputs.skip != 'true'
        env:
          KBUILD_BUILD_USER: github-actions
          KBUILD_BUILD_HOST: github-arm64-cross
          DEBFULLNAME: github-actions
          DEBEMAIL: github-actions@users.noreply.github.com
          KDEB_CHANGELOG_DIST: noble
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          set -euo pipefail

          cd kernel

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CCACHE_DIR="$CCACHE_DIR"

          ccache --zero-stats

          make \
            ARCH=arm64 \
            LLVM=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC="ccache clang --target=aarch64-linux-gnu" \
            HOSTCC="ccache clang" \
            -j"$(( $(nproc) + 1 ))" \
            bindeb-pkg

          ccache --show-stats

      - name: Verify
        if: steps.published.outputs.skip != 'true'
        env:
          TAG: ${{ steps.xanmod.outputs.tag }}
        run: |
          set -euo pipefail

          mkdir -p dist

          shopt -s nullglob

          packages=(*.deb)

          ((${#packages[@]} > 0)) || exit 1

          for deb in "${packages[@]}"; do
            [[ "$(dpkg-deb --field "$deb" Architecture)" == "arm64" ]] || exit 1

            case "$(dpkg-deb --field "$deb" Package)" in
              linux-image-*)
                image_pkg="$deb"
                ;;
              linux-headers-*)
                headers_pkg="$deb"
                ;;
              linux-libc-dev)
                libc_pkg="$deb"
                ;;
            esac
          done

          dpkg-deb --contents "$image_pkg" |
            grep '/boot/vmlinuz-' >/dev/null

          dpkg-deb --contents "$image_pkg" |
            grep '/lib/modules/' >/dev/null

          dpkg-deb --contents "$headers_pkg" |
            grep '/usr/src/linux-headers-' >/dev/null

          cp "${packages[@]}" dist/

          sha256sum dist/*.deb > dist/SHA256SUMS

          {
            echo "XanMod LTS ARM64: $TAG"
            echo "Kernel release: ${TAG}-arm64-lts"
            echo "Architecture: arm64"
            echo "Profile: VPS"
            echo "Source: https://gitlab.com/xanmod/linux"
            echo "GitLab release: https://gitlab.com/xanmod/linux/-/releases/$TAG"
            echo ""
            cat dist/SHA256SUMS
          } > dist/RELEASE.md

      - name: Publish
        if: steps.published.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.xanmod.outputs.tag }}
        run: |
          set -euo pipefail

          gh release create \
            "$TAG" \
            dist/*.deb \
            dist/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "XanMod ${TAG} ARM64 LTS" \
            --notes-file dist/RELEASE.md
