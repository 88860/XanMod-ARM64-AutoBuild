".github/workflows/xanmod-arm64-lts.yml"

name: Auto Build XanMod ARM64 LTS

on:
  workflow_dispatch:
  schedule:
    # 每周一 04:00 UTC 自动检查
    - cron: "0 4 * * 1"

permissions:
  contents: write

concurrency:
  group: xanmod-arm64-lts
  cancel-in-progress: false

env:
  XANMOD_REPO: https://gitlab.com/xanmod/linux.git
  UEK_REPO: https://github.com/oracle/linux-uek.git

  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 0. Checkout
      # ============================================================

      - name: Checkout build repository
        uses: actions/checkout@v4


      # ============================================================
      # 1. Dependencies
      # ============================================================

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libelf-dev \
            libssl-dev \
            libncurses-dev \
            fakeroot \
            dpkg-dev \
            ccache \
            curl \
            jq \
            git \
            xz-utils \
            rsync \
            kmod \
            python3 \
            python3-pip


      # ============================================================
      # 2. ccache
      # ============================================================

      - name: Configure ccache
        shell: bash
        run: |
          set -euo pipefail

          echo "PATH=/usr/lib/ccache:$PATH" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: arm64-xanmod-lts-ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            arm64-xanmod-lts-ccache-${{ runner.os }}-


      # ============================================================
      # 3. Detect Linux Longterm series
      #
      # NEVER parse kernel.org HTML.
      # Use the official releases.json.
      # ============================================================

      - name: Detect latest Linux Longterm series
        id: lts
        shell: bash
        run: |
          set -euo pipefail

          echo "Fetching kernel.org releases.json..."

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 5 \
            --retry-delay 2 \
            https://www.kernel.org/releases.json \
            -o kernel-releases.json

          LTS_SERIES="$(
            jq -r '
              .releases[]
              | select(.moniker == "longterm")
              | .version
            ' kernel-releases.json |
            sed -E 's/^([0-9]+\.[0-9]+)\..*$/\1/' |
            sort -V |
            uniq |
            tail -n1
          )"

          if [[ -z "$LTS_SERIES" ]]; then
            echo "ERROR: Failed to detect Linux Longterm series."
            cat kernel-releases.json
            exit 1
          fi

          echo "Linux Longterm series: $LTS_SERIES"

          echo "series=$LTS_SERIES" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 4. Detect latest XanMod release for that LTS series
      #
      # Exclude:
      #   -rt-xanmod
      #
      # We want the normal XanMod kernel.
      # ============================================================

      - name: Detect latest XanMod LTS tag
        id: xanmod
        shell: bash
        run: |
          set -euo pipefail

          SERIES="${{ steps.lts.outputs.series }}"

          echo "Searching XanMod for Linux ${SERIES}..."

          TAG="$(
            git ls-remote \
              --tags \
              --refs \
              "$XANMOD_REPO" |
            awk -F/ '{print $3}' |
            grep -E "^${SERIES//./\\.}\.[0-9]+-xanmod[0-9]+$" |
            grep -v -- '-rt-xanmod' |
            sort -V |
            tail -n1
          )"

          if [[ -z "$TAG" ]]; then
            echo "ERROR: No normal XanMod tag found for ${SERIES}."
            exit 1
          fi

          echo "Selected XanMod tag: $TAG"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 5. Clone XanMod
      # ============================================================

      - name: Clone XanMod
        shell: bash
        run: |
          set -euo pipefail

          git clone \
            --depth 1 \
            --branch "${{ steps.xanmod.outputs.tag }}" \
            "$XANMOD_REPO" \
            linux

          cd linux

          echo
          echo "XanMod commit:"
          git rev-parse HEAD

          echo
          echo "Kernel version:"
          make kernelversion


      # ============================================================
      # 6. Verify XanMod version
      # ============================================================

      - name: Verify XanMod kernel version
        working-directory: linux
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED="${{ steps.lts.outputs.series }}"

          ACTUAL="$(
            make kernelversion |
            sed -E 's/^([0-9]+\.[0-9]+)\..*/\1/'
          )"

          echo "Expected series: $EXPECTED"
          echo "Actual series:   $ACTUAL"

          if [[ "$EXPECTED" != "$ACTUAL" ]]; then
            echo
            echo "ERROR: XanMod kernel series mismatch."
            exit 1
          fi

          echo "Kernel series verification: PASS"


      # ============================================================
      # 7. Clone Oracle UEK
      #
      # UEK is used as ARM64 configuration reference.
      # We do NOT build UEK.
      # ============================================================

      - name: Clone Oracle UEK
        shell: bash
        run: |
          set -euo pipefail

          git clone \
            --depth 1 \
            --branch uek8/u2 \
            "$UEK_REPO" \
            linux-uek

          cd linux-uek

          echo "Oracle UEK commit:"
          git rev-parse HEAD


      # ============================================================
      # 8. Locate Oracle ARM64 configuration
      #
      # Do not hard-code one guessed path.
      #
      # Oracle may store configuration in different locations
      # between UEK branches.
      # ============================================================

      - name: Locate Oracle ARM64 configuration
        id: uek
        shell: bash
        run: |
          set -euo pipefail

          cd linux-uek

          echo "Searching Oracle UEK for ARM64 kernel configs..."

          : > "$GITHUB_WORKSPACE/uek-config-candidates.txt"

          # Search common configuration locations first.
          find . \
            -type f \
            \( \
              -path './arch/arm64/configs/*' \
              -o \
              -path './uek-rpm/*' \
              -o \
              -path './configs/*' \
              -o \
              -path './redhat/*' \
            \) \
            -print |
          sort > "$GITHUB_WORKSPACE/uek-config-candidates.txt"

          echo
          echo "Candidate files:"
          cat "$GITHUB_WORKSPACE/uek-config-candidates.txt" || true

          # Look for a real full kernel config.
          #
          # A usable full config must contain:
          #   CONFIG_ARM64=y
          #
          CONFIG_FILE=""

          while IFS= read -r file; do

            [[ -f "$file" ]] || continue

            if grep -q '^CONFIG_ARM64=y$' "$file" 2>/dev/null; then
              CONFIG_FILE="$file"
              break
            fi

          done < "$GITHUB_WORKSPACE/uek-config-candidates.txt"

          if [[ -z "$CONFIG_FILE" ]]; then
            echo
            echo "ERROR: Could not locate an Oracle ARM64 full config."
            echo
            echo "The workflow will NOT silently fall back to arm64 defconfig."
            echo "This is intentional."
            exit 1
          fi

          echo
          echo "Selected Oracle ARM64 config:"
          echo "$CONFIG_FILE"

          cp "$CONFIG_FILE" "$GITHUB_WORKSPACE/oracle-arm64.config"

          echo "path=$CONFIG_FILE" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 9. Prepare Oracle ARM64 configuration
      #
      # Oracle config is the BASE.
      #
      # We do not use:
      #
      #   make arm64 defconfig
      #
      # ============================================================

      - name: Prepare Oracle ARM64 base configuration
        working-directory: linux
        shell: bash
        run: |
          set -euo pipefail

          cp \
            "$GITHUB_WORKSPACE/oracle-arm64.config" \
            .config

          echo
          echo "Initial Oracle ARM64 configuration:"
          grep -E \
            '^(CONFIG_ARM64|CONFIG_TCP_CONG_BBR|CONFIG_DEFAULT_TCP_CONG|CONFIG_NET_SCH_FQ)=' \
            .config || true

          echo
          echo "Resolving configuration against current XanMod Kconfig..."

          make \
            ARCH=arm64 \
            olddefconfig


      # ============================================================
      # 10. Read XanMod x86_64 configuration
      #
      # XanMod keeps its x86_64 config at:
      #
      #   CONFIGS/x86_64
      #
      # The file is used ONLY as optimization reference.
      # ============================================================

      - name: Verify XanMod x86_64 configuration
        working-directory: linux
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f CONFIGS/x86_64 ]]; then
            echo "ERROR: XanMod CONFIGS/x86_64 not found."
            exit 1
          fi

          echo "XanMod x86_64 config found."

          echo
          echo "Config size:"
          wc -l CONFIGS/x86_64

          echo
          echo "Network-related XanMod options:"
          grep -E \
            '^CONFIG_(TCP_CONG_BBR|DEFAULT_TCP_CONG|NET_SCH_FQ)=' \
            CONFIGS/x86_64 || true


      # ============================================================
      # 11. Convert compatible XanMod x86 options into ARM64
      #
      # Rules:
      #
      #   1. x86 architecture options are ignored.
      #   2. x86 CPU tuning options are ignored.
      #   3. Only symbols existing in current XanMod Kconfig
      #      are considered.
      #   4. ARM64 Kconfig remains the final dependency authority.
      # ============================================================

      - name: Generate ARM64 XanMod optimization fragment
        working-directory: linux
        shell: bash
        run: |
          set -euo pipefail

          : > xanmod-arm64.fragment

          echo "Generating compatible optimization fragment..."

          # Extract Kconfig symbols from the current source tree.
          git grep -h -E \
            '^[[:space:]]*(menu)?config[[:space:]]+[A-Za-z0-9_]+' \
            -- \
            ':(exclude)Documentation/**' \
            ':(exclude)samples/**' \
            ':(exclude)tools/**' \
          2>/dev/null |
          awk '
            {
              print $NF
            }
          ' |
          sort -u > available-symbols.txt

          symbol_exists() {
            grep -qx "$1" available-symbols.txt
          }

          while IFS= read -r line; do

            # Ignore comments and empty lines.
            [[ -z "$line" ]] && continue
            [[ "$line" == \#* ]] && continue

            SYMBOL=""

            case "$line" in

              CONFIG_*=y)
                SYMBOL="${line%%=*}"
                ;;

              CONFIG_*=m)
                SYMBOL="${line%%=*}"
                ;;

              CONFIG_*=*)
                SYMBOL="${line%%=*}"
                ;;

              esac

            [[ -z "$SYMBOL" ]] && continue

            NAME="${SYMBOL#CONFIG_}"

            # ------------------------------------------------------
            # Explicit x86 architecture exclusions.
            # ------------------------------------------------------

            case "$SYMBOL" in
              CONFIG_X86_*|CONFIG_I386_*|CONFIG_X86_64*)
                continue
                ;;
            esac

            # ------------------------------------------------------
            # Explicit x86 CPU / ISA tuning exclusions.
            # ------------------------------------------------------

            case "$SYMBOL" in
              CONFIG_MCORE*|
              CONFIG_MNATIVE|
              CONFIG_MK8*|
              CONFIG_MK10*|
              CONFIG_MK6*|
              CONFIG_MK7*|
              CONFIG_MK8*|
              CONFIG_MK9*|
              CONFIG_MZEN*|
              CONFIG_MATOM*|
              CONFIG_MGEODE*|
              CONFIG_MWINCHIP*|
              CONFIG_MELAN*|
              CONFIG_MCYRIX*|
              CONFIG_M486*|
              CONFIG_M586*|
              CONFIG_M686*)
                continue
                ;;
            esac

            # ------------------------------------------------------
            # Do not import explicit CPU architecture selection.
            # ------------------------------------------------------

            case "$SYMBOL" in
              CONFIG_CPU_*|
              CONFIG_CPU_FREQ_DEFAULT_GOV_*|
              CONFIG_ARM64_*|
              CONFIG_ARM_*)
                continue
                ;;
            esac

            # ------------------------------------------------------
            # Symbol must actually exist in this XanMod tree.
            # ------------------------------------------------------

            if ! symbol_exists "$NAME"; then
              continue
            fi

            printf '%s\n' "$line" >> xanmod-arm64.fragment

          done < CONFIGS/x86_64

          sort -u xanmod-arm64.fragment -o xanmod-arm64.fragment

          echo
          echo "Generated compatible XanMod fragment:"
          wc -l xanmod-arm64.fragment

          echo
          echo "Important network options:"
          grep -E \
            '^CONFIG_(TCP_CONG_BBR|DEFAULT_TCP_CONG|NET_SCH_FQ)=' \
            xanmod-arm64.fragment || true


      # ============================================================
      # 12. Merge XanMod compatible optimization
      # ============================================================

      - name: Merge XanMod ARM64 optimizations
        working-directory: linux
        shell: bash
        run: |
          set -euo pipefail

          if [[ -s xanmod-arm64.fragment ]]; then
            cat xanmod-arm64.fragment >> .config
          fi

          make \
            ARCH=arm64 \
            olddefconfig


      # ============================================================
      # 13. Mandatory BBRv3 configuration
      #
      # This is NOT optional.
      #
      # BBR must be built into the kernel.
      # It must be the default TCP congestion controller.
      # ============================================================

      - name: Force mandatory BBRv3 configuration
        working-directory: linux
        shell: bash
        run: |
          set -euo pipefail

          echo "Forcing mandatory BBR configuration..."

          scripts/config \
            --enable CONFIG_TCP_CONG_BBR

          scripts/config \
            --set-str CONFIG_DEFAULT_TCP_CONG bbr

          make \
            ARCH=arm64 \
            olddefconfig

          echo
          echo "Final BBR configuration:"
          grep -E \
            '^CONFIG_(TCP_CONG_BBR|DEFAULT_TCP_CONG)=' \
            .config


      # ============================================================
      # 14. Final configuration audit
      # ============================================================

      - name: Audit final ARM64 configuration
        working-directory: linux
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "================================================"
          echo "FINAL ARM64 CONFIGURATION AUDIT"
          echo "================================================"

          echo
          echo "[Architecture]"
          grep '^CONFIG_ARM64=y$' .config

          echo
          echo "[BBR]"
          grep '^CONFIG_TCP_CONG_BBR=y$' .config
          grep '^CONFIG_DEFAULT_TCP_CONG="bbr"$' .config

          echo
          echo "[FQ]"
          grep '^CONFIG_NET_SCH_FQ=' .config || \
            echo "CONFIG_NET_SCH_FQ not explicitly set"

          echo
          echo "[Scheduler / timing]"
          grep -E \
            '^CONFIG_(PREEMPT|HZ)=' \
            .config || true

          echo
          echo "Mandatory checks..."

          grep -q '^CONFIG_ARM64=y$' .config || {
            echo "ERROR: ARM64 is not enabled."
            exit 1
          }

          grep -q '^CONFIG_TCP_CONG_BBR=y$' .config || {
            echo "ERROR: BBR is not built-in."
            exit 1
          }

          grep -q '^CONFIG_DEFAULT_TCP_CONG="bbr"$' .config || {
            echo "ERROR: BBR is not the default TCP congestion control."
            exit 1
          }

          echo
          echo "Configuration audit: PASS"


      # ============================================================
      # 15. BBRv3 SOURCE AUDIT
      #
      # Kconfig alone cannot prove the implementation is BBRv3.
      #
      # XanMod historically introduced BBRv3 through its
      # net-tcp_bbr v3 patches.
      #
      # We therefore inspect tcp_bbr.c for XanMod BBRv3 markers.
      # ============================================================

      - name: Audit BBR implementation
        working-directory: linux
        shell: bash
        run: |
          set -euo pipefail

          BBR_SOURCE="net/ipv4/tcp_bbr.c"

          if [[ ! -f "$BBR_SOURCE" ]]; then
            echo "ERROR: $BBR_SOURCE not found."
            exit 1
          fi

          echo "Inspecting BBR implementation..."

          # BBRv3 has a substantially different implementation.
          # Look for known v3-specific symbols/markers first.

          if grep -Eq \
            'BBR3|BBR_V3|bbr3|full_bw_reached|inflight_hi|inflight_lo' \
            "$BBR_SOURCE"; then

            echo "BBRv3 source markers detected."

          else

            echo
            echo "WARNING: Could not positively identify BBRv3 from source markers."
            echo
            echo "This is a hard safety failure for this experimental build."
            echo "The workflow will NOT publish a release."
            echo
            echo "Relevant BBR source:"
            grep -n -E \
              'BBR|bbr_' \
              "$BBR_SOURCE" |
              head -100 || true

            exit 1

          fi

          echo "BBR implementation audit: PASS"


      # ============================================================
      # 16. Build kernel
      # ============================================================

      - name: Build ARM64 kernel
        working-directory: linux
        shell: bash
        run: |
          set -euo pipefail

          make \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            -j"$(nproc)"


      # ============================================================
 # 17. Build Debian packages
      # ============================================================

      - name: Build Debian packages
        working-directory: linux
        shell: bash
        run: |
          set -euo pipefail

          make \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            bindeb-pkg \
            -j"$(nproc)" \
            LOCALVERSION=-xanmod-arm64


      # ============================================================
      # 18. Verify package output
      # ============================================================

      - name: Verify Debian packages
        shell: bash
        run: |
          set -euo pipefail

          echo "Generated packages:"

          find linux \
            -maxdepth 1 \
            -type f \
            -name '*.deb' \
            -print

          COUNT="$(
            find linux \
              -maxdepth 1 \
              -type f \
              -name '*.deb' |
            wc -l
          )"

          if [[ "$COUNT" -eq 0 ]]; then
            echo "ERROR: No Debian packages generated."
            exit 1
          fi

          sha256sum linux/*.deb > SHA256SUMS.txt


      # ============================================================
      # 19. Save reproducibility information
      # ============================================================

      - name: Save build information
        working-directory: linux
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "XANMOD_TAG=${{ steps.xanmod.outputs.tag }}"
            echo "XANMOD_COMMIT=$(git rev-parse HEAD)"
            echo "KERNEL_VERSION=$(make kernelversion)"
            echo "LINUX_LTS_SERIES=${{ steps.lts.outputs.series }}"
            echo "UEK_BRANCH=uek8/u2"
            echo "UEK_COMMIT=$(cd ../linux-uek && git rev-parse HEAD)"
            echo "UEK_CONFIG=${{ steps.uek.outputs.path }}"
            echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > ../BUILD-INFO.txt

          cp .config ../config-arm64


      # ============================================================
      # 20. Upload CI artifact
      # ============================================================

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xanmod-arm64-lts-${{ steps.xanmod.outputs.tag }}
          path: |
            linux/*.deb
            SHA256SUMS.txt
            config-arm64
            BUILD-INFO.txt
          if-no-files-found: error


      # ============================================================
      # 21. Release
      #
      # Release happens ONLY if every previous audit passes.
      # ============================================================

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.xanmod.outputs.tag }}-arm64
          name: XanMod ARM64 LTS ${{ steps.xanmod.outputs.tag }}
          prerelease: false
          generate_release_notes: true
          files: |
            linux/*.deb
            SHA256SUMS.txt
            config-arm64
            BUILD-INFO.txt

### 这版和之前最大的区别
