name: Build XanMod ARM64 LTS

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: write

concurrency:
  group: xanmod-arm64-lts
  cancel-in-progress: false

env:
  XANMOD_REPO: https://gitlab.com/xanmod/linux.git
  ORACLE_KCONFIGS: https://raw.githubusercontent.com/oracle/kconfigs/gh-pages
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            libelf-dev libssl-dev libncurses-dev \
            fakeroot dpkg-dev ccache curl jq git \
            xz-utils zstd rsync kmod python3

      - name: Cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: xanmod-arm64-lts-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            xanmod-arm64-lts-${{ runner.os }}-

      - name: Detect Linux LTS
        id: lts
        run: |
          set -euo pipefail

          curl -fsSL --retry 5 \
            https://www.kernel.org/releases.json \
            -o releases.json

          SERIES="$(
            jq -r '
              .releases[]
              | select(.moniker == "longterm")
              | .version
            ' releases.json |
            sed -E 's/^([0-9]+\.[0-9]+)\..*/\1/' |
            sort -Vu |
            tail -1
          )"

          test -n "$SERIES"
          echo "series=$SERIES" >> "$GITHUB_OUTPUT"

      - name: Detect XanMod LTS
        id: xanmod
        run: |
          set -euo pipefail

          SERIES="${{ steps.lts.outputs.series }}"

          TAG="$(
            git ls-remote --tags --refs "$XANMOD_REPO" |
            awk -F/ '{print $3}' |
            grep -E "^${SERIES//./\\.}\.[0-9]+-xanmod[0-9]+$" |
            sort -V |
            tail -1
          )"

          test -n "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Clone XanMod
        run: |
          set -euo pipefail

          git clone \
            --depth 1 \
            --branch "${{ steps.xanmod.outputs.tag }}" \
            "$XANMOD_REPO" \
            linux

          cd linux

          VERSION="$(make kernelversion | cut -d. -f1-2)"
          test "$VERSION" = "${{ steps.lts.outputs.series }}"

      - name: Fetch Oracle ARM64 4K config
        run: |
          set -euo pipefail

          mkdir -p oracle

          curl -fsSL --retry 5 \
            "$ORACLE_KCONFIGS/ol10uek8/aarch64/config" \
            -o oracle/config

          test -s oracle/config
          grep -q '^CONFIG_ARM64=y$' oracle/config

      - name: Prepare Oracle ARM64 4K base
        working-directory: linux
        run: |
          set -euo pipefail

          cp ../oracle/config .config
          make ARCH=arm64 olddefconfig

          grep -q '^CONFIG_ARM64=y$' .config
          grep -q '^CONFIG_64BIT=y$' .config

      - name: Apply XanMod compatible optimization
        working-directory: linux
        run: |
          set -euo pipefail

          test -f CONFIGS/x86_64/config

          git grep -h -E \
            '^[[:space:]]*config[[:space:]]+[A-Za-z0-9_]+' \
            -- ':!Documentation' ':!samples' ':!tools' |
            sed -E 's/^[[:space:]]*config[[:space:]]+//' |
            awk '{print $1}' |
            sort -u > ksymbols

          : > xanmod-arm64.fragment

          while IFS= read -r line; do
            [[ "$line" =~ ^CONFIG_ ]] || continue

            symbol="${line%%=*}"
            name="${symbol#CONFIG_}"

            case "$symbol" in
              CONFIG_X86_*|CONFIG_I386_*|CONFIG_X86_64*)
                continue ;;
              CONFIG_MCORE*|CONFIG_MNATIVE|CONFIG_MK8*|CONFIG_MK9*)
                continue ;;
              CONFIG_MK10*|CONFIG_MZEN*|CONFIG_MATOM*)
                continue ;;
              CONFIG_M486*|CONFIG_M586*|CONFIG_M686*)
                continue ;;
              CONFIG_CPU_*|CONFIG_ARM64_*|CONFIG_ARM_*)
                continue ;;
            esac

            grep -qx "$name" ksymbols || continue
            echo "$line" >> xanmod-arm64.fragment

          done < CONFIGS/x86_64/config

          sort -u xanmod-arm64.fragment -o xanmod-arm64.fragment
          cat xanmod-arm64.fragment >> .config

          make ARCH=arm64 olddefconfig

      - name: Configuration audit
        working-directory: linux
        run: |
          set -euo pipefail

          make ARCH=arm64 olddefconfig

          grep -q '^CONFIG_ARM64=y$' .config
          grep -q '^CONFIG_64BIT=y$' .config

          echo "Kernel:"
          make kernelversion

          echo
          echo "BBR:"
          grep '^CONFIG_TCP_CONG_BBR=' .config || true
          grep '^CONFIG_DEFAULT_TCP_CONG=' .config || true

          echo
          echo "FQ:"
          grep '^CONFIG_NET_SCH_FQ=' .config || true

      - name: Build kernel
        working-directory: linux
        run: |
          set -euo pipefail

          make \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            -j"$(nproc)"

      - name: Build Debian packages
        working-directory: linux
        run: |
          set -euo pipefail

          make \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            bindeb-pkg \
            -j"$(nproc)" \
            LOCALVERSION=-xanmod-arm64

      - name: Package
        run: |
          set -euo pipefail

          test -n "$(find linux -maxdepth 1 -name '*.deb' -print -quit)"

          sha256sum linux/*.deb > SHA256SUMS.txt
          cp linux/.config config-arm64

          {
            echo "XANMOD_TAG=${{ steps.xanmod.outputs.tag }}"
            echo "XANMOD_COMMIT=$(cd linux && git rev-parse HEAD)"
            echo "KERNEL_VERSION=$(cd linux && make kernelversion)"
            echo "ARCH=arm64"
            echo "PAGE_SIZE=4K"
            echo "ORACLE_BASE=Oracle Linux 10 UEK8 ARM64"
            echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > BUILD-INFO.txt

      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xanmod-arm64-lts-${{ steps.xanmod.outputs.tag }}
          path: |
            linux/*.deb
            SHA256SUMS.txt
            config-arm64
            BUILD-INFO.txt
          if-no-files-found: error

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.xanmod.outputs.tag }}-arm64
          name: XanMod ARM64 LTS ${{ steps.xanmod.outputs.tag }}
          generate_release_notes: true
          files: |
            linux/*.deb
            SHA256SUMS.txt
            config-arm64
            BUILD-INFO.txt
