name: Build XanMod ARM64 LTS

on:
  workflow_dispatch:
  schedule:
    - cron: "30 */6 * * *"

permissions:
  contents: write

env:
  XANMOD_REPO: https://gitlab.com/xanmod/linux.git
  XANMOD_LTS: "6.18"

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
      tag: ${{ steps.check.outputs.tag }}

    steps:
      - name: Check XanMod LTS
        id: check
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y git python3

          TAG="$(
            python3 - <<'PY'
          import subprocess
          import re

          repo = "https://gitlab.com/xanmod/linux.git"
          series = "6.18"

          data = subprocess.check_output(
              ["git", "ls-remote", "--tags", "--refs", repo],
              text=True
          )

          pattern = re.compile(
              rf"^{re.escape(series)}\.[0-9]+-xanmod[0-9]+$"
          )

          tags = []

          for line in data.splitlines():
              tag = line.rsplit("/", 1)[-1]

              if pattern.fullmatch(tag):
                  tags.append(tag)

          if not tags:
              raise SystemExit(
                  f"No XanMod {series} LTS tags found"
              )

          def key(tag):
              m = re.fullmatch(
                  rf"{re.escape(series)}\.([0-9]+)-xanmod([0-9]+)",
                  tag
              )
              return int(m.group(1)), int(m.group(2))

          print(max(tags, key=key))
          PY
          )"

          test -n "$TAG"

          echo "XanMod LTS: $TAG"

          if git ls-remote --tags --refs \
            "https://github.com/${GITHUB_REPOSITORY}.git" \
            "refs/tags/${TAG}-arm64" |
            grep -q .; then

            echo "Already released: ${TAG}-arm64"
            echo "build=false" >> "$GITHUB_OUTPUT"

          else

            echo "New build required: ${TAG}"
            echo "build=true" >> "$GITHUB_OUTPUT"

          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libncurses-dev \
            gcc-aarch64-linux-gnu \
            fakeroot \
            dpkg-dev \
            ccache \
            git \
            curl \
            rsync \
            xz-utils \
            kmod \
            python3

          gcc-aarch64-linux-gnu-gcc --version
          make --version
          python3 --version

      - name: Setup ccache
        run: |
          set -euo pipefail

          echo "PATH=/usr/lib/ccache:$PATH" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-xanmod-arm64-${{ needs.check.outputs.tag }}
          restore-keys: |
            ${{ runner.os }}-xanmod-arm64-

      - name: Clone XanMod
        run: |
          set -euo pipefail

          git clone \
            --depth=1 \
            --branch "${{ needs.check.outputs.tag }}" \
            "$XANMOD_REPO" \
            linux

      - name: Verify XanMod configuration
        working-directory: linux
        run: |
          set -euo pipefail

          URL="${XANMOD_REPO%/}/-/raw/${{ needs.check.outputs.tag }}/CONFIGS/x86_64"

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 5 \
            --retry-delay 2 \
            "$URL" \
            -o /tmp/xanmod-x86_64.config

          test -s /tmp/xanmod-x86_64.config

          head -n 5 /tmp/xanmod-x86_64.config

      - name: Build ARM64 configuration
        working-directory: linux
        run: |
          set -euo pipefail

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          make defconfig

          cp .config /tmp/arm64-defconfig

          make allmodconfig >/dev/null

          cp .config /tmp/arm64-symbols

          cp /tmp/arm64-defconfig .config

          python3 <<'PY'
          import re
          from pathlib import Path

          XANMOD = Path("/tmp/xanmod-x86_64.config")
          ARM64 = Path("/tmp/arm64-symbols")
          OUT = Path("/tmp/xanmod-arm64.fragment")

          SET = re.compile(
              r"^(CONFIG_[A-Za-z0-9_]+)=(.*)$"
          )

          UNSET = re.compile(
              r"^# (CONFIG_[A-Za-z0-9_]+) is not set$"
          )

          def parse(path):
              result = {}

              for line in path.read_text().splitlines():

                  m = SET.match(line)

                  if m:
                      result[m.group(1)] = m.group(2)
                      continue

                  m = UNSET.match(line)

                  if m:
                      result[m.group(1)] = "n"

              return result

          xanmod = parse(XANMOD)
          arm64 = parse(ARM64)

          changes = {}
          skipped = []

          for symbol, value in xanmod.items():

              if symbol not in arm64:
                  skipped.append(symbol)
                  continue

              if arm64[symbol] != value:
                  changes[symbol] = value

          with OUT.open("w") as f:

              for symbol in sorted(changes):

                  value = changes[symbol]

                  if value == "n":
                      f.write(
                          f"# {symbol} is not set\n"
                      )
                  else:
                      f.write(
                          f"{symbol}={value}\n"
                      )

          print(f"XanMod symbols: {len(xanmod)}")
          print(f"ARM64 symbols: {len(arm64)}")
          print(f"Compatible: {len(xanmod) - len(skipped)}")
          print(f"Changed: {len(changes)}")
          print(f"Skipped: {len(skipped)}")

          if skipped:
              print("\nSkipped symbols:")

              for symbol in skipped:
                  print(symbol)

          if not changes:
              raise SystemExit(
                  "No compatible XanMod changes found"
              )
          PY

          test -s /tmp/xanmod-arm64.fragment

          ./scripts/kconfig/merge_config.sh \
            -m \
            .config \
            /tmp/xanmod-arm64.fragment

          make olddefconfig

          mkdir -p ../configs

          cp .config ../configs/xanmod-arm64.config

      - name: Validate configuration
        run: |
          set -euo pipefail

          CFG="configs/xanmod-arm64.config"

          test -s "$CFG"

          grep -q '^CONFIG_ARM64=y$' "$CFG"
          grep -q '^CONFIG_64BIT=y$' "$CFG"

          if grep -q '^CONFIG_X86=y$' "$CFG"; then
            echo "ERROR: CONFIG_X86 enabled"
            exit 1
          fi

          if grep -q '^CONFIG_X86_64=y$' "$CFG"; then
            echo "ERROR: CONFIG_X86_64 enabled"
            exit 1
          fi

          if grep -q '^CONFIG_X86_32=y$' "$CFG"; then
            echo "ERROR: CONFIG_X86_32 enabled"
            exit 1
          fi

      - name: Build kernel
        working-directory: linux
        run: |
          set -euo pipefail

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC="ccache gcc"

          ccache -z

          make -j"$(nproc)"

          make bindeb-pkg -j"$(nproc)"

          ccache -s

      - name: Verify packages
        run: |
          set -euo pipefail

          shopt -s nullglob

          packages=(./*.deb)

          if [ "${#packages[@]}" -eq 0 ]; then
            echo "ERROR: No Debian packages generated"
            exit 1
          fi

          for pkg in "${packages[@]}"; do
            dpkg-deb --info "$pkg" >/dev/null
          done

      - name: Generate checksums
        run: |
          set -euo pipefail

          sha256sum ./*.deb > SHA256SUMS.txt

          cat SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xanmod-arm64-${{ needs.check.outputs.tag }}
          path: |
            ./*.deb
            SHA256SUMS.txt
            configs/xanmod-arm64.config

      - name: Commit configuration
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add configs/xanmod-arm64.config

          if git diff --cached --quiet; then
            echo "No configuration changes."
          else
            git commit \
              -m "Update XanMod ARM64 config ${{ needs.check.outputs.tag }}"

            git push
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.tag }}-arm64
          name: XanMod ARM64 ${{ needs.check.outputs.tag }}
          generate_release_notes: true
          files: |
            ./*.deb
            SHA256SUMS.txt
            configs/xanmod-arm64.config
