name: Auto Build XanMod ARM64 LTS

on:
  workflow_dispatch:
  schedule:
    # 每周一 04:00 UTC 检查一次
    - cron: "0 4 * * 1"

permissions:
  contents: write

concurrency:
  group: xanmod-arm64-lts
  cancel-in-progress: false

env:
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-
  XANMOD_REPO: https://gitlab.com/xanmod/linux.git
  UEK_REPO: https://github.com/oracle/linux-uek.git

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libelf-dev \
            libssl-dev \
            libncurses-dev \
            fakeroot \
            dpkg-dev \
            ccache \
            curl \
            jq \
            git \
            xz-utils \
            rsync \
            kmod \
            python3 \
            python3-pip

      - name: Enable ccache
        run: |
          echo "PATH=/usr/lib/ccache:$PATH" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-arm64-xanmod-lts-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-arm64-xanmod-lts-

      # ------------------------------------------------------------
      # 1. Determine the current Linux Longterm series
      # ------------------------------------------------------------
      - name: Detect current Linux LTS series
        id: lts
        shell: bash
        run: |
          set -euo pipefail

          echo "Querying kernel.org..."

          PAGE="$(curl -fsSL https://www.kernel.org/)"

          LTS_SERIES="$(
            printf '%s\n' "$PAGE" |
            grep -oE 'longterm:[[:space:]]+[0-9]+\.[0-9]+' |
            sed -E 's/.*([0-9]+\.[0-9]+)$/\1/' |
            sort -V |
            tail -n1
          )"

          if [[ -z "${LTS_SERIES}" ]]; then
            echo "ERROR: Cannot determine Linux LTS series"
            exit 1
          fi

          echo "Detected Linux LTS series: ${LTS_SERIES}"
          echo "series=${LTS_SERIES}" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # 2. Find the newest XanMod release belonging to that LTS series
      # ------------------------------------------------------------
      - name: Detect latest XanMod LTS tag
        id: xanmod
        shell: bash
        run: |
          set -euo pipefail

          SERIES="${{ steps.lts.outputs.series }}"

          echo "Looking for XanMod ${SERIES} releases..."

          TAG="$(
            git ls-remote --tags --refs "$XANMOD_REPO" |
            awk -F/ '{print $3}' |
            grep -E "^${SERIES//./\\.}\.[0-9]+-xanmod[0-9]+$" |
            sort -V |
            tail -n1
          )"

          if [[ -z "${TAG}" ]]; then
            echo "ERROR: No XanMod tag found for Linux LTS ${SERIES}"
            exit 1
          fi

          echo "Selected XanMod tag: ${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # 3. Clone exact XanMod source
      # ------------------------------------------------------------
      - name: Clone XanMod
        run: |
          set -euo pipefail

          git clone \
            --depth 1 \
            --branch "${{ steps.xanmod.outputs.tag }}" \
            "$XANMOD_REPO" \
            linux

          cd linux

          echo "XanMod commit:"
          git rev-parse HEAD

          echo "Kernel version:"
          make kernelversion

      # ------------------------------------------------------------
      # 4. Clone Oracle UEK reference
      # ------------------------------------------------------------
      - name: Clone Oracle UEK
        run: |
          set -euo pipefail

          git clone \
            --depth 1 \
            --branch uek8/u2 \
            "$UEK_REPO" \
            linux-uek

      # ------------------------------------------------------------
      # 5. Locate Oracle ARM64 configuration
      # ------------------------------------------------------------
      - name: Locate Oracle ARM64 config
        id: uekconfig
        shell: bash
        run: |
          set -euo pipefail

          cd linux-uek

          echo "Searching Oracle UEK for ARM64 configuration..."

          CONFIG="$(
            find . \
              -type f \
              \( \
                -name '*aarch64*' \
                -o \
                -name '*arm64*' \
                -o \
                -path '*/arm64/configs/*' \
              \) \
              -print |
            grep -Ei \
              'config|defconfig|uek' |
            head -n1 || true
          )"

          if [[ -z "${CONFIG}" ]]; then
            echo "ERROR: Could not locate Oracle ARM64 configuration."
            echo
            echo "Available candidate files:"
            find . \
              -type f \
              \( -path '*/arm64/configs/*' -o -iname '*config*' \) \
              | head -100
            exit 1
          fi

          echo "Oracle ARM64 config candidate: ${CONFIG}"

          cp "$CONFIG" "$GITHUB_WORKSPACE/oracle-arm64.config"

          echo "path=$CONFIG" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # 6. Import Oracle ARM64 config into current XanMod Kconfig
      # ------------------------------------------------------------
      - name: Build Oracle ARM64 base configuration
        working-directory: linux
        shell: bash
        run: |
          set -euo pipefail

          cp "$GITHUB_WORKSPACE/oracle-arm64.config" .config

          # Force architecture.
          scripts/config --set-str ARCH arm64 2>/dev/null || true

          # Let the CURRENT XanMod Kconfig resolve symbols,
          # dependencies and removed/renamed options.
          make ARCH=arm64 olddefconfig

      # ------------------------------------------------------------
      # 7. Import compatible XanMod x86_64 optimizations
      # ------------------------------------------------------------
      - name: Import compatible XanMod optimizations
        working-directory: linux
        shell: bash
        run: |
          set -euo pipefail

          X86_CONFIG="CONFIGS/x86_64"

          if [[ ! -f "$X86_CONFIG" ]]; then
            echo "WARNING: XanMod x86_64 config not found."
            exit 0
          fi

          echo "Extracting ARM64-compatible XanMod configuration..."

          : > xanmod-arm64.fragment

          while IFS= read -r line; do
            case "$line" in
              CONFIG_*=y)
                SYMBOL="${line%%=*}"

                # Never import explicit x86 architecture settings.
                if [[ "$SYMBOL" == CONFIG_X86_* ]]; then
                  continue
                fi

                if grep -RqsE "^config ${SYMBOL#CONFIG_}$|^menuconfig ${SYMBOL#CONFIG_}$" \
                    arch/arm64 Kconfig* \
                    --include='Kconfig' \
                    --include='Kconfig.*'; then
                  printf '%s\n' "$line" >> xanmod-arm64.fragment
                fi
                ;;

              CONFIG_*=m)
                SYMBOL="${line%%=*}"

                if [[ "$SYMBOL" == CONFIG_X86_* ]]; then
                  continue
                fi

                if grep -RqsE "^config ${SYMBOL#CONFIG_}$|^menuconfig ${SYMBOL#CONFIG_}$" \
                    arch/arm64 Kconfig* \
                    --include='Kconfig' \
                    --include='Kconfig.*'; then
                  printf '%s\n' "$line" >> xanmod-arm64.fragment
                fi
                ;;

              CONFIG_*=\"*\")
                SYMBOL="${line%%=*}"

                if [[ "$SYMBOL" == CONFIG_X86_* ]]; then
                  continue
                fi

                if grep -RqsE "^config ${SYMBOL#CONFIG_}$|^menuconfig ${SYMBOL#CONFIG_}$" \
                    arch/arm64 Kconfig* \
                    --include='Kconfig' \
                    --include='Kconfig.*'; then
                  printf '%s\n' "$line" >> xanmod-arm64.fragment
                fi
                ;;
            esac
          done < "$X86_CONFIG"

          echo "Imported symbols:"
          wc -l xanmod-arm64.fragment

          # Merge fragment into the current configuration.
          cat xanmod-arm64.fragment >> .config

          make ARCH=arm64 olddefconfig

      # ------------------------------------------------------------
      # 8. Mandatory networking configuration
      # ------------------------------------------------------------
      - name: Force BBRv3
        working-directory: linux
        shell: bash
        run: |
          set -euo pipefail

          echo "Forcing mandatory BBR configuration..."

          scripts/config --enable CONFIG_TCP_CONG_BBR
          scripts/config --set-str CONFIG_DEFAULT_TCP_CONG bbr

          # Keep FQ as XanMod's configuration choice.
          # We intentionally do NOT force CONFIG_NET_SCH_FQ here.

          make ARCH=arm64 olddefconfig

      # ------------------------------------------------------------
      # 9. Final configuration audit
      # ------------------------------------------------------------
      - name: Audit final ARM64 configuration
        working-directory: linux
        shell: bash
        run: |
          set -euo pipefail

          echo "========== Kernel Configuration Audit =========="

          grep -E \
            '^(CONFIG_TCP_CONG_BBR|CONFIG_DEFAULT_TCP_CONG|CONFIG_NET_SCH_FQ|CONFIG_PREEMPT|CONFIG_HZ)=' \
            .config || true

          echo
          echo "BBR check..."

          grep -q '^CONFIG_TCP_CONG_BBR=y$' .config || {
            echo "ERROR: CONFIG_TCP_CONG_BBR is not built-in."
            exit 1
          }

          grep -q '^CONFIG_DEFAULT_TCP_CONG="bbr"$' .config || {
            echo "ERROR: Default TCP congestion control is not BBR."
            exit 1
          }

          echo "BBR configuration: PASS"

          echo
          echo "Architecture:"
          grep '^CONFIG_ARM64=y$' .config || {
            echo "ERROR: ARM64 configuration missing."
            exit 1
          }

          echo "ARM64 configuration: PASS"

      # ------------------------------------------------------------
      # 10. Build kernel
      # ------------------------------------------------------------
      - name: Build ARM64 kernel
        working-directory: linux
        run: |
          set -euo pipefail

          make \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            -j"$(nproc)"

      # ------------------------------------------------------------
      # 11. Build Debian packages
      # ------------------------------------------------------------
      - name: Build Debian packages
        working-directory: linux
        run: |
          set -euo pipefail

          make \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            bindeb-pkg \
            -j"$(nproc)" \
            LOCALVERSION=-xanmod-arm64

      # ------------------------------------------------------------
      # 12. Verify generated package
      # ------------------------------------------------------------
      - name: Verify packages
        shell: bash
        run: |
          set -euo pipefail

          echo "Generated packages:"
          find . -maxdepth 1 -type f -name '*.deb' -print

          test "$(find . -maxdepth 1 -type f -name '*.deb' | wc -l)" -gt 0

          sha256sum linux/*.deb > SHA256SUMS.txt

      # ------------------------------------------------------------
      # 13. Save final config for debugging/reproducibility
      # ------------------------------------------------------------
      - name: Save build information
        working-directory: linux
        run: |
          set -euo pipefail

          {
            echo "XANMOD_TAG=${{ steps.xanmod.outputs.tag }}"
            echo "XANMOD_COMMIT=$(git rev-parse HEAD)"
            echo "KERNEL_VERSION=$(make kernelversion)"
            echo "UEK_CONFIG=${{ steps.uekconfig.outputs.path }}"
            echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > ../BUILD-INFO.txt

          cp .config ../config-arm64

      # ------------------------------------------------------------
      # 14. Upload CI artifacts
      # ------------------------------------------------------------
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xanmod-arm64-lts-${{ steps.xanmod.outputs.tag }}
          path: |
            linux/*.deb
            SHA256SUMS.txt
            config-arm64
            BUILD-INFO.txt
          if-no-files-found: error

      # ------------------------------------------------------------
      # 15. Create GitHub Release
      # ------------------------------------------------------------
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.xanmod.outputs.tag }}-arm64
          name: XanMod ARM64 LTS ${{ steps.xanmod.outputs.tag }}
          prerelease: false
          generate_release_notes: true
          files: |
            linux/*.deb
            SHA256SUMS.txt
            config-arm64
            BUILD-INFO.txt
