name: Build XanMod ARM64 LTS

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 0"

permissions:
  contents: write

env:
  XANMOD_REPO: https://gitlab.com/xanmod/linux.git
  KERNEL_RELEASES: https://www.kernel.org/releases.json
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libncurses-dev \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            fakeroot \
            dpkg-dev \
            ccache \
            git \
            curl \
            rsync \
            xz-utils \
            kmod \
            python3

          command -v aarch64-linux-gnu-gcc

      - name: Setup ccache
        run: |
          set -euo pipefail
          echo "PATH=/usr/lib/ccache:$PATH" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-xanmod-arm64-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-xanmod-arm64-

      - name: Detect latest LTS
        id: lts
        run: |
          set -euo pipefail

          SERIES="$(
            curl -fsSL --retry 5 --retry-delay 2 "$KERNEL_RELEASES" |
            python3 -c '
          import json,sys

          d=json.load(sys.stdin)

          versions=[]

          for r in d["releases"]:
              if r.get("moniker") != "longterm":
                  continue

              v=r["version"]

              try:
                  p=tuple(map(int,v.split(".")))
              except ValueError:
                  continue

              versions.append((p,v))

          if not versions:
              raise SystemExit("No Linux LTS release found")

          versions.sort(reverse=True)

          print(".".join(versions[0][1].split(".")[:2]))
          '
          )"

          test -n "$SERIES"

          echo "series=$SERIES" >> "$GITHUB_OUTPUT"
          echo "Linux LTS series: $SERIES"

      - name: Detect latest XanMod LTS tag
        id: xanmod
        run: |
          set -euo pipefail

          SERIES="${{ steps.lts.outputs.series }}"

          TAG="$(
            git ls-remote --tags --refs "$XANMOD_REPO" |
            awk -F/ '{print $NF}' |
            grep -E "^${SERIES//./\\.}\.[0-9]+-xanmod[0-9]+$" |
            sort -V |
            tail -n1
          )"

          test -n "$TAG"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "XanMod tag: $TAG"

      - name: Clone XanMod
        run: |
          set -euo pipefail

          git clone \
            --depth=1 \
            --branch "${{ steps.xanmod.outputs.tag }}" \
            "$XANMOD_REPO" \
            linux

      - name: Build ARM64 configuration
        working-directory: linux
        run: |
          set -euo pipefail

          export ARCH="$ARCH"
          export CROSS_COMPILE="$CROSS_COMPILE"

          make defconfig

          cp .config ../configs-arm64-default.config

          curl -fsSL \
            --retry 5 \
            --retry-delay 2 \
            "${XANMOD_REPO%/}/-/raw/${{ steps.xanmod.outputs.tag }}/CONFIGS/x86_64" \
            -o ../xanmod-x86_64.config

          test -s ../xanmod-x86_64.config

          cp .config ../arm64-base.config

          ./scripts/kconfig/merge_config.sh \
            -m \
            .config \
            ../xanmod-x86_64.config \
            >/tmp/xanmod-probe.log 2>&1 || true

          cp .config ../xanmod-probe.config

          cp ../arm64-base.config .config

          python3 <<'PY'
          import re
          from pathlib import Path

          XANMOD = Path("../xanmod-x86_64.config")
          ARM = Path("../arm64-base.config")
          OUT = Path("../xanmod-arm64.fragment")

          SET = re.compile(r"^(CONFIG_[A-Za-z0-9_]+)=(.*)$")
          UNSET = re.compile(r"^# (CONFIG_[A-Za-z0-9_]+) is not set$")

          def parse(path):
              result = {}

              for line in path.read_text().splitlines():
                  m = SET.match(line)

                  if m:
                      result[m.group(1)] = m.group(2)
                      continue

                  m = UNSET.match(line)

                  if m:
                      result[m.group(1)] = "n"

              return result

          xanmod = parse(XANMOD)
          arm = parse(ARM)

          changes = {}
          skipped = []

          blocked = {
              "CONFIG_X86",
              "CONFIG_X86_64",
              "CONFIG_X86_32",
              "CONFIG_IA32",
              "CONFIG_X86_5LEVEL",
              "CONFIG_X86_INTEL_MEMORY_PROTECTION_KEYS",
              "CONFIG_X86_SGX",
              "CONFIG_X86_USER_SHADOW_STACK",
          }

          for sym, value in xanmod.items():

              if sym in blocked:
                  skipped.append(sym)
                  continue

              if sym not in arm:
                  skipped.append(sym)
                  continue

              if arm[sym] == value:
                  continue

              changes[sym] = value

          with OUT.open("w") as f:
              for sym in sorted(changes):
                  value = changes[sym]

                  if value == "n":
                      f.write(f"# {sym} is not set\n")
                  else:
                      f.write(f"{sym}={value}\n")

          print(f"XanMod symbols: {len(xanmod)}")
          print(f"ARM64 symbols: {len(arm)}")
          print(f"Compatible symbols: {len(xanmod) - len(skipped)}")
          print(f"Changed symbols: {len(changes)}")
          print(f"Skipped symbols: {len(skipped)}")

          if skipped:
              print("\nSkipped:")
              for sym in sorted(skipped):
                  print(sym)

          if not changes:
              raise SystemExit("No compatible XanMod configuration changes found")
          PY

          test -s ../xanmod-arm64.fragment

          cp ../arm64-base.config .config

          ./scripts/kconfig/merge_config.sh \
            -m \
            .config \
            ../xanmod-arm64.fragment

          make olddefconfig

          mkdir -p ../configs

          cp .config \
            ../configs/xanmod-arm64.config

      - name: Validate ARM64 configuration
        working-directory: linux
        run: |
          set -euo pipefail

          CFG="../configs/xanmod-arm64.config"

          test -s "$CFG"

          grep -q '^CONFIG_ARM64=y$' "$CFG"
          grep -q '^CONFIG_64BIT=y$' "$CFG"

          if grep -q '^CONFIG_X86=y$' "$CFG"; then
            echo "ERROR: CONFIG_X86 enabled"
            exit 1
          fi

          if grep -q '^CONFIG_X86_64=y$' "$CFG"; then
            echo "ERROR: CONFIG_X86_64 enabled"
            exit 1
          fi

          if grep -q '^CONFIG_IA32=y$' "$CFG"; then
            echo "ERROR: CONFIG_IA32 enabled"
            exit 1
          fi

          echo "ARM64 configuration validated."

      - name: Build kernel
        working-directory: linux
        run: |
          set -euo pipefail

          export ARCH="$ARCH"
          export CROSS_COMPILE="$CROSS_COMPILE"
          export CC="ccache aarch64-linux-gnu-gcc"

          ccache -z

          make -j"$(nproc)"

          make bindeb-pkg -j"$(nproc)"

          ccache -s

      - name: Collect packages
        run: |
          set -euo pipefail

          mkdir -p release

          find . -maxdepth 1 -type f -name "*.deb" \
            -exec cp {} release/ \;

          test -n "$(find release -type f -name '*.deb' -print -quit)"

          cd release

          sha256sum ./*.deb > SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xanmod-arm64-${{ steps.xanmod.outputs.tag }}
          path: |
            release/*.deb
            release/SHA256SUMS.txt
            configs/xanmod-arm64.config

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.xanmod.outputs.tag }}-arm64
          name: XanMod ARM64 ${{ steps.xanmod.outputs.tag }}
          generate_release_notes: true
          files: |
            release/*.deb
            release/SHA256SUMS.txt
            configs/xanmod-arm64.config

      - name: Commit configuration
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add configs/xanmod-arm64.config

          if git diff --cached --quiet; then
            echo "No configuration changes."
            exit 0
          fi

          git commit \
            -m "Update XanMod ARM64 config ${{ steps.xanmod.outputs.tag }}"

          git push
