name: XanMod ARM64 LTS

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: xanmod-arm64-lts
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360

    steps:
      - name: Install build requirements
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          packages=(
            bc
            binutils
            bison
            build-essential
            ca-certificates
            ccache
            cpio
            curl
            dpkg-dev
            dwarves
            fakeroot
            flex
            git
            jq
            kmod
            libdw-dev
            libelf-dev
            libssl-dev
            libzstd-dev
            lld
            llvm
            clang
            openssl
            perl
            pkg-config
            python3
            rsync
            tar
            xz-utils
            zstd
          )

          sudo apt-get install -y "${packages[@]}"
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

          required_commands=(
            bc
            bison
            clang
            ccache
            dpkg-deb
            fakeroot
            flex
            git
            jq
            ld.lld
            llvm-ar
            llvm-nm
            llvm-objcopy
            llvm-objdump
            llvm-readelf
            make
            pahole
            perl
            python3
            rsync
            tar
            xz
            zstd
          )

          for command in "${required_commands[@]}"; do
            command -v "$command"
          done

          make --version
          clang --version
          ld.lld --version
          pahole --version
          ccache --version

      - name: Detect XanMod official LTS release
        id: xanmod
        shell: bash
        run: |
          set -euo pipefail

          api="https://gitlab.com/api/v4/projects/xanmod%2Flinux/releases"
          page=1
          tmp="$(mktemp)"

          while :; do
            data="$(
              curl \
                --fail \
                --silent \
                --show-error \
                --location \
                --get "$api" \
                --data-urlencode "per_page=100" \
                --data-urlencode "page=$page"
            )"

            count="$(jq 'length' <<<"$data")"

            if [ "$count" -eq 0 ]; then
              break
            fi

            printf '%s\n' "$data" >> "$tmp"

            if [ "$count" -lt 100 ]; then
              break
            fi

            page=$((page + 1))
          done

          tag="$(
            jq -s -r '
              .[][]
              | select(
                  (
                    any(.assets.links[]?.url;
                      contains("/releases/lts/")
                    )
                  )
                  or
                  (
                    (.description // "")
                    | contains("/releases/lts/")
                  )
                )
              | .tag_name
            ' "$tmp" \
            | sort -V \
            | tail -n1
          )"

          rm -f "$tmp"

          test -n "$tag"
          test "$tag" != "null"

          release="$(
            curl \
              --fail \
              --silent \
              --show-error \
              --location \
              "https://gitlab.com/api/v4/projects/xanmod%2Flinux/releases/$tag"
          )"

          jq -e --arg tag "$tag" '
            .tag_name == $tag
            and (
              any(.assets.links[]?.url;
                contains("/releases/lts/")
              )
              or
              (
                (.description // "")
                | contains("/releases/lts/")
              )
            )
          ' <<<"$release" >/dev/null

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check GitHub Release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.xanmod.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch XanMod only from GitLab
        if: steps.existing.outputs.exists != 'true'
        env:
          TAG: ${{ steps.xanmod.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          git ls-remote \
            --exit-code \
            --refs \
            https://gitlab.com/xanmod/linux.git \
            "refs/tags/$TAG"

          git clone \
            --depth=1 \
            --branch "$TAG" \
            https://gitlab.com/xanmod/linux.git \
            linux

          cd linux

          test "$(git remote get-url origin)" = \
            "https://gitlab.com/xanmod/linux.git"

          git rev-parse HEAD > ../source-commit
          git show -s --format=%cI HEAD > ../source-date
          git show -s --format=%ct HEAD > ../source-epoch

          required_files=(
            ".gitlab-ci.yml"
            "CONFIGS/x86_64/config"
            "Documentation/process/changes.rst"
            "Kconfig"
            "Makefile"
            "arch/arm64/Kconfig"
            "arch/x86/configs/x86_64_defconfig"
            "scripts/config"
            "scripts/diffconfig"
            "scripts/kconfig/merge_config.sh"
          )

          for file in "${required_files[@]}"; do
            test -f "$file"
          done

          test "$(cat localversion)" = "-xanmod1"

      - name: Generate XanMod x86-v3 delta
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p x86-build audit

          make \
            -C linux \
            O="$GITHUB_WORKSPACE/x86-build" \
            ARCH=x86 \
            LLVM=1 \
            x86_64_defconfig

          cp \
            x86-build/.config \
            audit/x86-64-defconfig.config

          cp \
            linux/CONFIGS/x86_64/config \
            audit/xanmod-x86-v3.config

          linux/scripts/diffconfig \
            -m \
            audit/x86-64-defconfig.config \
            audit/xanmod-x86-v3.config \
            > audit/xanmod-x86-v3.fragment

          test -s audit/xanmod-x86-v3.fragment

      - name: Generate ARM64 configuration
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p arm64-build

          make \
            -C linux \
            O="$GITHUB_WORKSPACE/arm64-build" \
            ARCH=arm64 \
            LLVM=1 \
            defconfig

          cp \
            arm64-build/.config \
            audit/arm64-defconfig.config

          KCONFIG_CONFIG="$GITHUB_WORKSPACE/arm64-build/.config" \
            linux/scripts/kconfig/merge_config.sh \
            -m \
            "$GITHUB_WORKSPACE/arm64-build/.config" \
            "$GITHUB_WORKSPACE/audit/xanmod-x86-v3.fragment"

          KCONFIG_WARN_UNKNOWN_SYMBOLS=1 \
          KCONFIG_WARN_CHANGED_INPUT=1 \
          KCONFIG_CONFIG="$GITHUB_WORKSPACE/arm64-build/.config" \
            make \
            -C linux \
            O="$GITHUB_WORKSPACE/arm64-build" \
            ARCH=arm64 \
            LLVM=1 \
            olddefconfig \
            2>&1 | tee audit/kconfig.log

          cp \
            arm64-build/.config \
            audit/arm64-after-olddefconfig.config

          linux/scripts/diffconfig \
            audit/arm64-defconfig.config \
            audit/arm64-after-olddefconfig.config \
            > audit/arm64-final-delta.config

          linux/scripts/diffconfig \
            audit/xanmod-x86-v3.fragment \
            audit/arm64-after-olddefconfig.config \
            > audit/x86-v3-to-arm64-resolution.config

          linux/scripts/config \
            --file arm64-build/.config \
            --set-str LOCALVERSION "-arm64"

          KCONFIG_WARN_UNKNOWN_SYMBOLS=1 \
          KCONFIG_WARN_CHANGED_INPUT=1 \
          KCONFIG_CONFIG="$GITHUB_WORKSPACE/arm64-build/.config" \
            make \
            -C linux \
            O="$GITHUB_WORKSPACE/arm64-build" \
            ARCH=arm64 \
            LLVM=1 \
            olddefconfig \
            2>&1 | tee -a audit/kconfig.log

          cp \
            arm64-build/.config \
            audit/final.config

          test -s audit/final.config

      - name: Configure ccache
        if: steps.existing.outputs.exists != 'true'
        id: ccache
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.cache/ccache"

          ccache --set-config=cache_dir="$HOME/.cache/ccache"
          ccache --set-config=max_size=2G
          ccache --set-config=compression=true

          compiler_hash="$(
            {
              clang --version
              ld.lld --version
              llvm-ar --version
            } | sha256sum | cut -d' ' -f1
          )"

          echo "compiler_hash=$compiler_hash" >> "$GITHUB_OUTPUT"
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "CCACHE_COMPILERCHECK=content" >> "$GITHUB_ENV"

      - name: Restore ccache
        if: steps.existing.outputs.exists != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: xanmod-arm64-${{ steps.ccache.outputs.compiler_hash }}-${{ github.run_id }}
          restore-keys: |
            xanmod-arm64-${{ steps.ccache.outputs.compiler_hash }}-

      - name: Build and package
        if: steps.existing.outputs.exists != 'true'
        env:
          TAG: ${{ steps.xanmod.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          export KBUILD_BUILD_TIMESTAMP="$(cat source-date)"
          export SOURCE_DATE_EPOCH="$(cat source-epoch)"
          export CC="ccache clang"

          make \
            -C linux \
            O="$GITHUB_WORKSPACE/arm64-build" \
            ARCH=arm64 \
            LLVM=1 \
            KBUILD_BUILD_TIMESTAMP="$KBUILD_BUILD_TIMESTAMP" \
            -j"$(nproc)" \
            bindeb-pkg

          ccache --show-stats

      - name: Validate packages
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail

          test -s arm64-build/arch/arm64/boot/Image

          mkdir -p artifacts

          find "$GITHUB_WORKSPACE" \
            -maxdepth 2 \
            -type f \
            -name '*.deb' \
            -exec cp -f {} artifacts/ \;

          compgen -G "artifacts/*.deb" >/dev/null

          image_package=0

          for package in artifacts/*.deb; do
            dpkg-deb --info "$package" >/dev/null
            dpkg-deb --contents "$package" >/dev/null

            name="$(dpkg-deb -f "$package" Package)"
            arch="$(dpkg-deb -f "$package" Architecture)"

            printf '%s %s %s\n' \
              "$name" \
              "$arch" \
              "$(basename "$package")"

            case "$name" in
              linux-image-*)
                [ "$arch" = "arm64" ]
                image_package=1
                ;;
            esac
          done

          test "$image_package" -eq 1

          tar \
            -C audit \
            -cJf \
            artifacts/xanmod-arm64-config-audit.tar.xz \
            .

          sha256sum artifacts/* > artifacts/SHA256SUMS

      - name: Upload artifacts
        if: steps.existing.outputs.exists != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: xanmod-arm64-${{ steps.xanmod.outputs.tag }}
          path: artifacts/*
          if-no-files-found: error
          compression-level: 0

      - name: Publish GitHub Release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.xanmod.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create \
            "$TAG" \
            artifacts/* \
            --title "XanMod ARM64 $TAG" \
            --notes "XanMod official LTS ARM64 build
          Source: XanMod GitLab
          Architecture: arm64
          Toolchain: LLVM
          Configuration: ARM64 Kconfig + olddefconfig"
