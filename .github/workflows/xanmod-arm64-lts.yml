name: Build XanMod ARM64 LTS

on:
  workflow_dispatch:
  schedule:
    - cron: "30 */6 * * *"

permissions:
  contents: write

env:
  XANMOD_REPO: https://gitlab.com/xanmod/linux.git

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
      tag: ${{ steps.check.outputs.tag }}

    steps:
      - name: Check latest XanMod
        id: check
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y curl python3 git

          SERIES="$(
            curl -fsSL --retry 5 --retry-delay 2 \
              https://www.kernel.org/releases.json |
            python3 -c '
          import json,sys
          d=json.load(sys.stdin)
          v=[x["version"] for x in d["releases"] if x.get("moniker")=="longterm"]
          v.sort(key=lambda x:tuple(map(int,x.split("."))),reverse=True)
          print(v[0].rsplit(".",1)[0])
          '
          )"

          test -n "$SERIES"

          ESCAPED="${SERIES//./\\.}"

          TAG="$(
            git ls-remote --tags --refs "$XANMOD_REPO" |
            sed 's#.*refs/tags/##' |
            grep -E "^${ESCAPED}-[0-9]+-xanmod[0-9]+$" |
            sort -V |
            tail -n1
          )"

          test -n "$TAG"

          echo "Latest LTS series: $SERIES"
          echo "Latest XanMod tag: $TAG"

          if git ls-remote --tags --refs \
            "https://github.com/${GITHUB_REPOSITORY}.git" \
            "refs/tags/${TAG}-arm64" |
            grep -q .; then
            echo "Already released: ${TAG}-arm64"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version detected"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libncurses-dev \
            gcc-aarch64-linux-gnu \
            fakeroot \
            dpkg-dev \
            ccache \
            git \
            curl \
            rsync \
            xz-utils \
            kmod \
            python3

      - name: Setup ccache
        run: |
          echo "PATH=/usr/lib/ccache:$PATH" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-xanmod-arm64-${{ needs.check.outputs.tag }}
          restore-keys: |
            ${{ runner.os }}-xanmod-arm64-

      - name: Clone XanMod
        run: |
          set -euo pipefail

          git clone \
            --depth=1 \
            --branch "${{ needs.check.outputs.tag }}" \
            "$XANMOD_REPO" \
            linux

      - name: Build ARM64 configuration
        working-directory: linux
        run: |
          set -euo pipefail

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          make defconfig
          cp .config /tmp/arm64-defconfig

          curl -fsSL --retry 5 --retry-delay 2 \
            "${XANMOD_REPO%/}/-/raw/${{ needs.check.outputs.tag }}/CONFIGS/x86_64" \
            -o /tmp/xanmod-x86_64.config

          test -s /tmp/xanmod-x86_64.config

          make allmodconfig >/dev/null
          cp .config /tmp/arm64-symbols

          python3 <<'PY'
          import re
          from pathlib import Path

          SRC = Path("/tmp/xanmod-x86_64.config")
          ARM = Path("/tmp/arm64-symbols")
          OUT = Path("/tmp/xanmod-arm64.fragment")

          SET = re.compile(r"^(CONFIG_[A-Za-z0-9_]+)=(.*)$")
          UNSET = re.compile(r"^# (CONFIG_[A-Za-z0-9_]+) is not set$")

          def parse(path):
              result = {}

              for line in path.read_text().splitlines():
                  m = SET.match(line)

                  if m:
                      result[m.group(1)] = m.group(2)
                      continue

                  m = UNSET.match(line)

                  if m:
                      result[m.group(1)] = "n"

              return result

          xanmod = parse(SRC)
          arm = parse(ARM)

          changes = {}
          skipped = []

          for sym, value in xanmod.items():

              if sym not in arm:
                  skipped.append(sym)
                  continue

              if arm[sym] != value:
                  changes[sym] = value

          with OUT.open("w") as f:
              for sym in sorted(changes):
                  value = changes[sym]

                  if value == "n":
                      f.write(f"# {sym} is not set\n")
                  else:
                      f.write(f"{sym}={value}\n")

          print(f"XanMod symbols: {len(xanmod)}")
          print(f"ARM64 symbols: {len(arm)}")
          print(f"Compatible symbols: {len(xanmod)-len(skipped)}")
          print(f"Changed symbols: {len(changes)}")
          print(f"Skipped symbols: {len(skipped)}")

          if skipped:
              print("\nSkipped:")
              for sym in skipped:
                  print(sym)

          if not changes:
              raise SystemExit(
                  "No compatible XanMod ARM64 configuration changes found"
              )
          PY

          test -s /tmp/xanmod-arm64.fragment

          cp /tmp/arm64-defconfig .config

          ./scripts/kconfig/merge_config.sh \
            -m \
            .config \
            /tmp/xanmod-arm64.fragment

          make olddefconfig

          mkdir -p ../configs
          cp .config ../configs/xanmod-arm64.config

      - name: Validate configuration
        run: |
          set -euo pipefail

          CFG="configs/xanmod-arm64.config"

          test -s "$CFG"

          grep -q '^CONFIG_ARM64=y$' "$CFG"
          grep -q '^CONFIG_64BIT=y$' "$CFG"

          if grep -q '^CONFIG_X86=y$' "$CFG"; then
            echo "ERROR: CONFIG_X86 enabled"
            exit 1
          fi

          if grep -q '^CONFIG_X86_64=y$' "$CFG"; then
            echo "ERROR: CONFIG_X86_64 enabled"
            exit 1
          fi

      - name: Build kernel
        working-directory: linux
        run: |
          set -euo pipefail

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC="ccache gcc"

          ccache -z

          make -j"$(nproc)"
          make bindeb-pkg -j"$(nproc)"

          ccache -s

      - name: Generate checksums
        run: |
          set -euo pipefail

          sha256sum ./*.deb > SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xanmod-arm64-${{ needs.check.outputs.tag }}
          path: |
            ./*.deb
            SHA256SUMS.txt
            configs/xanmod-arm64.config

      - name: Commit configuration
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add configs/xanmod-arm64.config

          if git diff --cached --quiet; then
            echo "No configuration changes."
            exit 0
          fi

          git commit \
            -m "Update XanMod ARM64 config ${{ needs.check.outputs.tag }}"

          git push

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.tag }}-arm64
          name: XanMod ARM64 ${{ needs.check.outputs.tag }}
          generate_release_notes: true
          files: |
            ./*.deb
            SHA256SUMS.txt
            configs/xanmod-arm64.config
