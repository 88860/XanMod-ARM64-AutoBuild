name: Build XanMod ARM64 LTS

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 0"

permissions:
  contents: write

env:
  XANMOD_REPO: https://gitlab.com/xanmod/linux.git
  KERNEL_RELEASES: https://www.kernel.org/releases.json
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libncurses-dev \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            fakeroot \
            dpkg-dev \
            ccache \
            git \
            curl \
            rsync \
            xz-utils \
            kmod \
            python3

      - name: Setup ccache
        run: |
          echo "PATH=/usr/lib/ccache:$PATH" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-xanmod-arm64-${{ github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-xanmod-arm64-

      - name: Detect latest LTS
        id: lts
        run: |
          set -euo pipefail

          SERIES="$(
            curl -fsSL \
              --retry 5 \
              --retry-delay 2 \
              "$KERNEL_RELEASES" |
            python3 -c '
          import json,sys

          d=json.load(sys.stdin)
          v=[]

          for x in d["releases"]:
              if x.get("moniker") != "longterm":
                  continue

              s=x["version"]

              try:
                  k=tuple(map(int,s.split(".")))
                  v.append((k,s))
              except ValueError:
                  pass

          if not v:
              raise SystemExit("No LTS kernel found")

          v.sort(reverse=True)
          print(v[0][1].rsplit(".",1)[0])
          '
          )"

          test -n "$SERIES"

          echo "series=$SERIES" >> "$GITHUB_OUTPUT"
          echo "LTS series: $SERIES"

      - name: Detect latest XanMod LTS tag
        id: xanmod
        run: |
          set -euo pipefail

          SERIES="${{ steps.lts.outputs.series }}"
          PREFIX="${SERIES//./\\.}"

          TAG="$(
            git ls-remote --tags --refs "$XANMOD_REPO" |
            sed 's#.*refs/tags/##' |
            grep -E "^${PREFIX}\.[0-9]+-xanmod[0-9]+$" |
            sort -V |
            tail -n1
          )"

          if [ -z "$TAG" ]; then
            echo "No XanMod LTS tag found for $SERIES"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "XanMod tag: $TAG"

      - name: Clone XanMod
        run: |
          set -euo pipefail

          git clone \
            --depth=1 \
            --branch "${{ steps.xanmod.outputs.tag }}" \
            "$XANMOD_REPO" \
            linux

          test -d linux/CONFIGS/x86_64

          echo "XanMod x86_64 configuration directory:"
          find linux/CONFIGS/x86_64 \
            -maxdepth 2 \
            -type f \
            -print

      - name: Locate XanMod x86_64 config
        id: config
        working-directory: linux
        run: |
          set -euo pipefail

          DIR="CONFIGS/x86_64"

          if [ -f "$DIR/config" ]; then
            CFG="$DIR/config"
          else
            CFG="$(
              find "$DIR" \
                -maxdepth 1 \
                -type f \
                -print \
                | sort \
                | head -n1
            )"
          fi

          if [ -z "$CFG" ] || [ ! -f "$CFG" ]; then
            echo "ERROR: No XanMod x86_64 configuration file found"
            find "$DIR" -maxdepth 2 -print
            exit 1
          fi

          test -s "$CFG"

          echo "config=$CFG" >> "$GITHUB_OUTPUT"
          echo "Selected XanMod configuration: $CFG"

      - name: Build ARM64 configuration
        working-directory: linux
        run: |
          set -euo pipefail

          XANMOD_CONFIG="${{ steps.config.outputs.config }}"

          make \
            ARCH="$ARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            defconfig

          cp .config ../arm64-base.config

          make \
            ARCH="$ARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            allmodconfig >/dev/null

          cp .config ../arm64-symbols.config

          python3 <<PY
          import re
          from pathlib import Path

          XANMOD = Path("$XANMOD_CONFIG")
          ARM = Path("../arm64-symbols.config")
          OUT = Path("../xanmod-arm64-candidates.fragment")

          SET = re.compile(r"^(CONFIG_[A-Za-z0-9_]+)=(.*)$")
          UNSET = re.compile(r"^# (CONFIG_[A-Za-z0-9_]+) is not set$")

          def parse(path):
              result = {}

              for line in path.read_text().splitlines():
                  m = SET.match(line)

                  if m:
                      result[m.group(1)] = m.group(2)
                      continue

                  m = UNSET.match(line)

                  if m:
                      result[m.group(1)] = "n"

              return result

          xanmod = parse(XANMOD)
          arm = parse(ARM)

          blocked = {
              "CONFIG_X86",
              "CONFIG_X86_64",
              "CONFIG_X86_32",
              "CONFIG_IA32",
              "CONFIG_X86_5LEVEL",
              "CONFIG_X86_INTEL_MEMORY_PROTECTION_KEYS",
              "CONFIG_X86_SGX",
              "CONFIG_X86_USER_SHADOW_STACK",
          }

          candidates = {}

          for sym, value in xanmod.items():

              if sym in blocked:
                  continue

              if sym not in arm:
                  continue

              candidates[sym] = value

          with OUT.open("w") as f:
              for sym in sorted(candidates):
                  value = candidates[sym]

                  if value == "n":
                      f.write(f"# {sym} is not set\n")
                  else:
                      f.write(f"{sym}={value}\n")

          print(f"XanMod symbols: {len(xanmod)}")
          print(f"ARM64 symbols: {len(arm)}")
          print(f"Candidates: {len(candidates)}")

          if not candidates:
              raise SystemExit(
                  "No ARM64-compatible XanMod configuration candidates"
              )
          PY

          test -s ../xanmod-arm64-candidates.fragment

      - name: Verify XanMod configuration through ARM64 Kconfig
        working-directory: linux
        run: |
          set -euo pipefail

          cp ../arm64-base.config .config

          ./scripts/kconfig/merge_config.sh \
            -m \
            .config \
            ../xanmod-arm64-candidates.fragment

          make \
            ARCH="$ARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            olddefconfig

          cp .config ../xanmod-arm64-tested.config

          python3 <<'PY'
          import re
          from pathlib import Path

          XANMOD = Path("../xanmod-arm64-candidates.fragment")
          TESTED = Path("../xanmod-arm64-tested.config")
          OUT = Path("../xanmod-arm64.fragment")

          SET = re.compile(r"^(CONFIG_[A-Za-z0-9_]+)=(.*)$")
          UNSET = re.compile(r"^# (CONFIG_[A-Za-z0-9_]+) is not set$")

          def parse(path):
              result = {}

              for line in path.read_text().splitlines():
                  m = SET.match(line)

                  if m:
                      result[m.group(1)] = m.group(2)
                      continue

                  m = UNSET.match(line)

                  if m:
                      result[m.group(1)] = "n"

              return result

          candidates = parse(XANMOD)
          tested = parse(TESTED)

          verified = {}
          rejected = {}

          for sym, value in candidates.items():

              if sym not in tested:
                  rejected[sym] = "missing"
                  continue

              if tested[sym] != value:
                  rejected[sym] = (
                      f"{value} -> {tested[sym]}"
                  )
                  continue

              verified[sym] = value

          with OUT.open("w") as f:
              for sym in sorted(verified):
                  value = verified[sym]

                  if value == "n":
                      f.write(f"# {sym} is not set\n")
                  else:
                      f.write(f"{sym}={value}\n")

          print(f"Candidates: {len(candidates)}")
          print(f"Verified: {len(verified)}")
          print(f"Rejected: {len(rejected)}")

          if rejected:
              print("\nRejected symbols:")

              for sym in sorted(rejected):
                  print(f"{sym}: {rejected[sym]}")

          if not verified:
              raise SystemExit(
                  "No XanMod settings survived ARM64 Kconfig validation"
              )
          PY

          test -s ../xanmod-arm64.fragment

      - name: Generate final ARM64 config
        working-directory: linux
        run: |
          set -euo pipefail

          cp ../arm64-base.config .config

          ./scripts/kconfig/merge_config.sh \
            -m \
            .config \
            ../xanmod-arm64.fragment

          make \
            ARCH="$ARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            olddefconfig

          mkdir -p ../configs

          cp .config \
            ../configs/xanmod-arm64.config

      - name: Validate final configuration
        run: |
          set -euo pipefail

          CFG="configs/xanmod-arm64.config"

          test -s "$CFG"

          grep -q '^CONFIG_ARM64=y$' "$CFG"
          grep -q '^CONFIG_64BIT=y$' "$CFG"

          if grep -q '^CONFIG_X86=y$' "$CFG"; then
            echo "ERROR: CONFIG_X86 enabled"
            exit 1
          fi

          if grep -q '^CONFIG_X86_64=y$' "$CFG"; then
            echo "ERROR: CONFIG_X86_64 enabled"
            exit 1
          fi

          if grep -q '^CONFIG_X86_32=y$' "$CFG"; then
            echo "ERROR: CONFIG_X86_32 enabled"
            exit 1
          fi

          if grep -q '^CONFIG_IA32=y$' "$CFG"; then
            echo "ERROR: CONFIG_IA32 enabled"
            exit 1
          fi

          echo "Final ARM64 configuration validated."

      - name: Build kernel
        working-directory: linux
        run: |
          set -euo pipefail

          export ARCH="$ARCH"
          export CROSS_COMPILE="$CROSS_COMPILE"
          export CC="ccache ${CROSS_COMPILE}gcc"

          command -v aarch64-linux-gnu-gcc
          aarch64-linux-gnu-gcc --version

          ccache -z

          make -j"$(nproc)"

          make \
            bindeb-pkg \
            -j"$(nproc)"

          ccache -s

      - name: Collect release files
        run: |
          set -euo pipefail

          mkdir -p release

          find . \
            -maxdepth 1 \
            -type f \
            -name '*.deb' \
            -exec cp {} release/ \;

          test -n "$(find release -type f -name '*.deb')"

          cp configs/xanmod-arm64.config release/

          sha256sum \
            release/*.deb \
            > release/SHA256SUMS.txt

          ls -lh release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xanmod-arm64-${{ steps.xanmod.outputs.tag }}
          path: release/*

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="${{ steps.xanmod.outputs.tag }}-arm64"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes
          fi

          gh release create "$TAG" \
            release/* \
            --title "XanMod ARM64 ${{ steps.xanmod.outputs.tag }}" \
            --generate-notes

      - name: Commit configuration
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add configs/xanmod-arm64.config

          if git diff --cached --quiet; then
            echo "No configuration changes."
            exit 0
          fi

          git commit \
            -m "Update XanMod ARM64 config ${{ steps.xanmod.outputs.tag }}"

          git push
