name: Auto Build XanMod ARM64 Kernel (Stable Mainline)

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential flex bison bc git curl wget \
            libncurses5-dev libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            fakeroot dpkg-dev ccache jq \
            xz-utils rsync kmod python3

      - name: Setup ccache
        run: |
          echo 'export PATH="/usr/lib/ccache:$PATH"' >> $GITHUB_ENV

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Detect latest XanMod tag
        id: tag
        run: |
          TAG=$(curl -s https://api.github.com/repos/xanmod/linux/releases/latest | jq -r .tag_name)
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Clone XanMod Kernel
        run: |
          git clone https://github.com/xanmod/linux
          cd linux
          git checkout ${{ steps.tag.outputs.tag }}

      - name: Build ARM64 Kernel
        run: |
          cd linux
          make ARCH=arm64 defconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc)
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- bindeb-pkg -j$(nproc)

      - name: Generate SHA256 checksums
        run: |
          cd ..
          sha256sum *.deb > SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xanmod-arm64-stable-deb
          path: |
            ../*.deb
            ../SHA256SUMS.txt

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            ../*.deb
            ../SHA256SUMS.txt
