name: XanMod ARM64 Main Build

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

concurrency:
  group: xanmod-arm64-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Release
        id: xanmod
        shell: bash
        env:
          GITLAB_API: https://gitlab.com/api/v4/projects/xanmod%2Flinux
        run: |
          set -euo pipefail

          tag=""
          commit=""
          released_at=""
          package_url=""

          for page in $(seq 1 50); do
            releases="$(
              curl -fsSL \
                --retry 5 \
                --retry-all-errors \
                "$GITLAB_API/releases?order_by=released_at&sort=desc&per_page=100&page=$page"
            )"

            while IFS=$'\t' read -r candidate candidate_commit candidate_released candidate_url; do
              [[ -n "$candidate" ]] || continue

              if [[ "$candidate" =~ ^[0-9]+\.[0-9]+\.[0-9]+-xanmod[0-9]+$ ]]; then
                tag="$candidate"
                commit="$candidate_commit"
                released_at="$candidate_released"
                package_url="$candidate_url"
                break
              fi
            done < <(
              jq -r '
                .[]
                | select(.upcoming_release == false)
                | select(.tag_name | test("^[0-9]+\\.[0-9]+\\.[0-9]+-xanmod[0-9]+$"))
                | select(
                    any(
                      .assets.links[]?;
                      (.url // "")
                      | test("sourceforge\\.net/projects/xanmod/files/releases/edge/")
                    )
                  )
                | [
                    .tag_name,
                    .commit.id,
                    .released_at,
                    (
                      .assets.links[]
                      | select(
                          (.url // "")
                          | test("sourceforge\\.net/projects/xanmod/files/releases/edge/")
                        )
                      | .url
                    )
                  ]
                | @tsv
              ' <<<"$releases"
            )

            [[ -n "$tag" ]] && break
            [[ "$(jq 'length' <<<"$releases")" -lt 100 ]] && break
          done

          [[ -n "$tag" ]] || {
            echo "Unable to find XanMod Main release"
            exit 1
          }

          release="$(
            curl -fsSL \
              --retry 5 \
              --retry-all-errors \
              "$GITLAB_API/releases/$tag"
          )"

          api_tag="$(jq -r '.tag_name' <<<"$release")"
          api_commit="$(jq -r '.commit.id' <<<"$release")"
          api_released="$(jq -r '.released_at' <<<"$release")"

          test "$api_tag" = "$tag"
          test "$api_commit" = "$commit"
          test "$api_released" = "$released_at"

          {
            echo "tag=$tag"
            echo "commit=$commit"
            echo "released_at=$released_at"
            echo "package_url=$package_url"
          } >> "$GITHUB_OUTPUT"

          echo "TAG=$tag"
          echo "COMMIT=$commit"
          echo "PACKAGE=$package_url"

      - name: Status
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.xanmod.outputs.tag }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Dependencies
        if: steps.published.outputs.skip != 'true'
        run: |
          set -euo pipefail

          sudo dpkg --add-architecture arm64

          sudo sed -i \
            's/^Types: deb/Types: deb\nArchitectures: amd64 i386/' \
            /etc/apt/sources.list.d/ubuntu.sources

          cat <<EOF | sudo tee /etc/apt/sources.list.d/ubuntu-ports.sources
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: noble noble-updates noble-security
          Components: main restricted universe multiverse
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache clang cpio debhelper dpkg-dev \
            dwarves fakeroot flex kmod libdw-dev libelf-dev libssl-dev lld \
            llvm lz4 openssl pkg-config python3 rsync xz-utils zstd \
            crossbuild-essential-arm64 \
            libssl-dev:arm64 libelf-dev:arm64 zlib1g-dev:arm64

      - name: Cache
        if: steps.published.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-cross-arm64-xanmod-${{ steps.xanmod.outputs.tag }}-clang-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cross-arm64-xanmod-

      - name: Source
        if: steps.published.outputs.skip != 'true'
        env:
          TAG: ${{ steps.xanmod.outputs.tag }}
          EXPECTED_COMMIT: ${{ steps.xanmod.outputs.commit }}
        run: |
          set -euo pipefail

          git clone \
            --depth 1 \
            --branch "$TAG" \
            https://gitlab.com/xanmod/linux.git \
            kernel

          cd kernel

          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"

          test -f arch/arm64/configs/defconfig
          test -f CONFIGS/x86_64/config

      - name: Configure
        if: steps.published.outputs.skip != 'true'
        id: config
        env:
          TAG: ${{ steps.xanmod.outputs.tag }}
        run: |
          set -euo pipefail

          cd kernel

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LLVM=1

          rm -f \
            .config \
            .config.xanmod \
            .config.final \
            .config.audit \
            .config.clean \
            .config.vps \
            .xanmod-candidates \
            .kconfig.log \
            .kconfig.err \
            localversion

          make \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 \
            defconfig

          cp .config .config.arm64-base

          awk '
            /^[[:space:]]*CONFIG_[A-Za-z0-9_]+=(y|m|-?[0-9]+|0x[0-9A-Fa-f]+|".*")$/ {
              print
            }
          ' CONFIGS/x86_64/config > .xanmod-candidates

          test -s .xanmod-candidates

          ./scripts/kconfig/merge_config.sh \
            -m \
            .config \
            .xanmod-candidates \
            > .kconfig.log \
            2> .kconfig.err || true

          if grep -Eiq \
            'warning:|error:|invalid|unknown symbol|undefined symbol|recursive dependency' \
            .kconfig.err; then

            if grep -Eiq \
              'unknown symbol|recursive dependency|error:' \
              .kconfig.err; then
              cat .kconfig.err
              exit 1
            fi
          fi

          make \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 \
            olddefconfig \
            > .kconfig.olddefconfig.log \
            2> .kconfig.olddefconfig.err

          if grep -Eiq \
            'warning:|error:|invalid|unknown symbol|recursive dependency' \
            .kconfig.olddefconfig.err; then
            cat .kconfig.olddefconfig.err
            exit 1
          fi

          cp .config .config.xanmod

          ./scripts/config \
            --disable SOUND \
            --disable WLAN \
            --disable WIRELESS \
            --disable BT \
            --disable MEDIA_SUPPORT \
            --disable FIREWIRE \
            --disable NFC \
            --disable IRDA \
            --disable GAMEPORT \
            --disable JOYSTICK \
            --disable TV \
            --disable CONFIG_SND \
            --disable CONFIG_DVB_CORE \
            --disable CONFIG_RC_CORE \
            --disable LOCALVERSION_AUTO

          printf '%s\n' '-arm64-main' > localversion

          make \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 \
            olddefconfig \
            > .kconfig.vps.log \
            2> .kconfig.vps.err

          if grep -Eiq \
            'warning:|error:|invalid|unknown symbol|recursive dependency' \
            .kconfig.vps.err; then
            cat .kconfig.vps.err
            exit 1
          fi

          cp .config .config.final

          make \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 \
            -s kernelrelease > kernel.release

          release="$(cat kernel.release)"
          expected="${TAG}-arm64-main"

          test "$release" = "$expected"

          cp .config.final .config.audit

          echo "config_hash=$(sha256sum .config.final | cut -d' ' -f1)" \
            >> "$GITHUB_OUTPUT"

          echo "kernel_release=$release" \
            >> "$GITHUB_OUTPUT"

      - name: Audit
        if: steps.published.outputs.skip != 'true'
        env:
          TAG: ${{ steps.xanmod.outputs.tag }}
          EXPECTED_RELEASE: ${{ steps.xanmod.outputs.tag }}-arm64-main
        run: |
          set -euo pipefail

          cd kernel

          test -s .config.audit
          test -s .config.final
          test -s .xanmod-candidates

          cp .config.audit .config

          make \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 \
            olddefconfig \
            > /dev/null \
            2> .audit.kconfig.err

          if [[ -s .audit.kconfig.err ]]; then
            cat .audit.kconfig.err
            exit 1
          fi

          cmp -s .config .config.audit

          grep -q '^CONFIG_ARM64=y$' .config
          grep -q '^CONFIG_64BIT=y$' .config
          grep -q '^CONFIG_MODULES=y$' .config

          if grep -Eq '^CONFIG_X86(=|_)|^CONFIG_X86_64(=|_)' .config; then
            grep -E '^CONFIG_X86(=|_)|^CONFIG_X86_64(=_)' .config
            exit 1
          fi

          if grep -Eq '^CONFIG_(SOUND|WLAN|WIRELESS|BT|MEDIA_SUPPORT|FIREWIRE|NFC|IRDA|GAMEPORT|JOYSTICK|TV)=' .config; then
            grep -E '^CONFIG_(SOUND|WLAN|WIRELESS|BT|MEDIA_SUPPORT|FIREWIRE|NFC|IRDA|GAMEPORT|JOYSTICK|TV)=' .config
            exit 1
          fi

          if grep -Eq '^CONFIG_(SND|DVB_CORE|RC_CORE)=' .config; then
            grep -E '^CONFIG_(SND|DVB_CORE|RC_CORE)=' .config
            exit 1
          fi

          grep -Eq '^CONFIG_VIRTIO=(y|m)$' .config
          grep -Eq '^CONFIG_VIRTIO_NET=(y|m)$' .config
          grep -q '^CONFIG_NET=y$' .config
          grep -q '^CONFIG_INET=y$' .config
          grep -q '^CONFIG_PROC_FS=y$' .config
          grep -q '^CONFIG_SYSFS=y$' .config
          grep -q '^CONFIG_CGROUPS=y$' .config
          grep -q '^CONFIG_NAMESPACES=y$' .config
          grep -q '^CONFIG_BPF=y$' .config
          grep -q '^CONFIG_BPF_SYSCALL=y$' .config

          if grep -q '^CONFIG_LOCALVERSION_AUTO=y$' .config; then
            exit 1
          fi

          if grep -q '^CONFIG_LOCALVERSION=' .config; then
            localversion="$(
              sed -n \
                's/^CONFIG_LOCALVERSION="\(.*\)"$/\1/p' \
                .config
            )"

            test -z "$localversion"
          fi

          release="$(
            make \
              ARCH=arm64 \
              CROSS_COMPILE=aarch64-linux-gnu- \
              LLVM=1 \
              -s kernelrelease
          )"

          test "$release" = "$EXPECTED_RELEASE"

          if grep -qE \
            '^CONFIG_(MCORE2|MZEN|X86_NATIVE_CPU|X86_64_VERSION)=' \
            .config; then
            grep -E \
              '^CONFIG_(MCORE2|MZEN|X86_NATIVE_CPU|X86_64_VERSION)=' \
              .config
            exit 1
          fi

          if grep -vE \
            '^(CONFIG_[A-Za-z0-9_]+=(y|m|-?[0-9]+|0x[0-9A-Fa-f]+|"[^"]*")|# CONFIG_[A-Za-z0-9_]+ is not set)$' \
            .config | grep -q .; then
            exit 1
          fi

          duplicates="$(
            grep '^CONFIG_' .config |
              sed 's/=.*//' |
              sort |
              uniq -d
          )"

          test -z "$duplicates"

          make \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LLVM=1 \
            -s prepare

          if [[ -s .audit.kconfig.err ]]; then
            cat .audit.kconfig.err
            exit 1
          fi

          echo "Release: $release"
          echo "Architecture: arm64"
          echo "Profile: VPS"
          echo "XanMod candidates: $(grep -c '^CONFIG_' .xanmod-candidates || true)"
          echo "Final config: $(grep -c '^CONFIG_' .config || true)"
          echo "Config SHA256: $(sha256sum .config | cut -d' ' -f1)"
          echo "Audit: PASS"

      - name: Build
        if: steps.published.outputs.skip != 'true'
        env:
          KBUILD_BUILD_USER: github-actions
          KBUILD_BUILD_HOST: github-arm64-cross
          DEBFULLNAME: github-actions
          DEBEMAIL: github-actions@users.noreply.github.com
          KDEB_CHANGELOG_DIST: noble
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          set -euo pipefail

          cd kernel

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CCACHE_DIR="$CCACHE_DIR"

          ccache --zero-stats

          make \
            ARCH=arm64 \
            LLVM=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            LOCALVERSION=-arm64-main \
            CC="ccache clang --target=aarch64-linux-gnu" \
            HOSTCC="ccache clang" \
            -j"$(( $(nproc) + 1 ))" \
            bindeb-pkg

          ccache --show-stats

      - name: Verify
        if: steps.published.outputs.skip != 'true'
        env:
          TAG: ${{ steps.xanmod.outputs.tag }}
        run: |
          set -euo pipefail

          mkdir -p dist

          shopt -s nullglob

          packages=(*.deb)

          ((${#packages[@]} > 0)) || exit 1

          for deb in "${packages[@]}"; do
            [[ "$(dpkg-deb --field "$deb" Architecture)" == "arm64" ]] || exit 1

            case "$(dpkg-deb --field "$deb" Package)" in
              linux-image-*)
                image_pkg="$deb"
                ;;
              linux-headers-*)
                headers_pkg="$deb"
                ;;
              linux-libc-dev)
                libc_pkg="$deb"
                ;;
            esac
          done

          dpkg-deb --contents "$image_pkg" |
            grep '/boot/vmlinuz-' >/dev/null

          dpkg-deb --contents "$image_pkg" |
            grep '/lib/modules/' >/dev/null

          dpkg-deb --contents "$headers_pkg" |
            grep '/usr/src/linux-headers-' >/dev/null

          image_release="$(
            dpkg-deb --field "$image_pkg" Package
          )"

          [[ "$image_release" == *"-arm64-main" ]]

          cp "${packages[@]}" dist/

          sha256sum dist/*.deb > dist/SHA256SUMS

          {
            echo "XanMod ARM64 Main: $TAG"
            echo "Kernel release: ${TAG}-arm64-main"
            echo "Architecture: arm64"
            echo "Profile: VPS"
            echo "Channel: main"
            echo "Source: https://gitlab.com/xanmod/linux"
            echo "GitLab release: https://gitlab.com/xanmod/linux/-/releases/$TAG"
            echo ""
            cat dist/SHA256SUMS
          } > dist/RELEASE.md

      - name: Publish
        if: steps.published.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.xanmod.outputs.tag }}
        run: |
          set -euo pipefail

          gh release create \
            "$TAG" \
            dist/*.deb \
            dist/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "XanMod ${TAG} ARM64 Main" \
            --notes-file dist/RELEASE.md
